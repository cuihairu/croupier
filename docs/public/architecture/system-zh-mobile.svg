<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1286" viewBox="0 0 480 1286" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Croupier 系统进程拓扑</title><desc id="desc">实线表示业务请求与结果，虚线表示注册与发现。运营控制台经 HTTPS 驱动 Server，Server 通过 Agent 外联的 TCP 会话下发调用，游戏进程以本地 provider 会话注册。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="480" height="1286" fill="#fff"/>
<text x="24" y="37" font-size="24" font-weight="600" text-anchor="start">系统进程拓扑</text>
<text x="24" y="67" font-size="18" font-weight="400" text-anchor="start" class="sub">Agent 只向外拨号。</text>
<text x="24" y="92" font-size="18" font-weight="400" text-anchor="start" class="sub">游戏进程在本地注册 provider 会话。</text>
<g data-node="console">
<rect x="30" y="118" width="420" height="100" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="152" font-size="23" font-weight="600" text-anchor="start">运营控制台</text>
<text x="48" y="180" font-size="18" font-weight="400" text-anchor="start" class="sub">dashboard nginx</text>
<text x="48" y="206" font-size="18" font-weight="400" text-anchor="start" class="sub">Umi Max · Ant Design</text>
</g>
<path d="M240 218 L240 258" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="250" y="226" width="180" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="340" y="244" font-size="18" font-weight="500" text-anchor="middle" class="blue">HTTPS · REST / SSE</text>
<g data-node="server">
<rect x="30" y="258" width="420" height="116" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="48" y="290" font-size="23" font-weight="600" text-anchor="start">Server</text>
<text x="48" y="318" font-size="18" font-weight="400" text-anchor="start" class="sub">HTTP :18780 · TCP :19090</text>
<text x="48" y="344" font-size="18" font-weight="400" text-anchor="start" class="sub">注册表 · 策略 · 审批 · 审计 · 路由</text>
</g>
<path d="M240 374 L240 452" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="274" y="396" width="116" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="332" y="414" font-size="18" font-weight="500" text-anchor="middle" class="blue">调用 · 结果</text>
<path d="M30 500 L7 500 L7 316 L30 316" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<text x="30" y="396" font-size="18" font-weight="400" text-anchor="start" class="teal">注册 · 心跳</text>
<text x="30" y="420" font-size="18" font-weight="400" text-anchor="start" class="sub">外联至 :19090</text>
<g data-node="agent">
<rect x="30" y="452" width="420" height="116" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="484" font-size="23" font-weight="600" text-anchor="start">Agent</text>
<text x="48" y="512" font-size="18" font-weight="400" text-anchor="start" class="sub">本地网关 :19091 · 上行会话客户端</text>
<text x="48" y="538" font-size="18" font-weight="400" text-anchor="start" class="sub">作业执行 · 扩展同步拉取</text>
</g>
<path d="M240 568 L240 606" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M130 606 L350 606" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M130 606 L130 650" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<path d="M350 606 L350 650" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="167" y="613" width="145" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="240" y="631" font-size="18" font-weight="500" text-anchor="middle" class="blue">本地 TCP 会话</text>
<g data-node="game server A">
<rect x="30" y="650" width="200" height="114" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="684" font-size="21" font-weight="600" text-anchor="start">游戏进程 A</text>
<text x="48" y="712" font-size="18" font-weight="400" text-anchor="start" class="sub">SDK</text>
<text x="48" y="738" font-size="18" font-weight="400" text-anchor="start" class="sub">本地会话</text>
</g>
<g data-node="game server B">
<rect x="250" y="650" width="200" height="114" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="268" y="684" font-size="21" font-weight="600" text-anchor="start">游戏进程 B</text>
<text x="268" y="712" font-size="18" font-weight="400" text-anchor="start" class="sub">SDK</text>
<text x="268" y="738" font-size="18" font-weight="400" text-anchor="start" class="sub">本地会话</text>
</g>
<text x="30" y="792" font-size="18" font-weight="400" text-anchor="start" class="sub">第三方应用共用此会话。</text>
<path d="M30 866 L16 866 L16 344 L30 344" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<g data-node="satellite agents">
<rect x="30" y="814" width="420" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="848" font-size="23" font-weight="600" text-anchor="start">旁路 agent</text>
<text x="48" y="876" font-size="18" font-weight="400" text-anchor="start" class="sub">capture · devops · synthetics</text>
<text x="48" y="902" font-size="18" font-weight="400" text-anchor="start" class="sub">无入站监听端口</text>
</g>
<path d="M450 316 L464 316 L464 1000 L220 1000" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="313" y="977" width="54" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="340" y="995" font-size="18" font-weight="500" text-anchor="middle" class="blue">SQL</text>
<path d="M30 1000 A95.0 13 0 0 1 220 1000 V1060 A95.0 13 0 0 1 30 1060 Z" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<ellipse cx="125.0" cy="1000" rx="95.0" ry="13" fill="#eef2f7" stroke="#ced8e5" stroke-width="1.3"/>
<text x="125.0" y="1032" font-size="20" font-weight="600" text-anchor="middle">存储</text>
<text x="125.0" y="1055" font-size="16" font-weight="400" text-anchor="middle" class="sub">元库 + 分游戏库</text>
<g data-node="analytics">
<rect x="30" y="1086" width="420" height="104" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="1120" font-size="23" font-weight="600" text-anchor="start">analytics</text>
<text x="48" y="1148" font-size="18" font-weight="400" text-anchor="start" class="sub">ingest :8088（HMAC）→ Redis Streams</text>
<text x="48" y="1174" font-size="18" font-weight="400" text-anchor="start" class="sub">analytics-worker → ClickHouse</text>
</g>
<text x="30" y="1234" font-size="18" font-weight="400" text-anchor="start" class="sub">实线：业务 / 数据</text>
<text x="30" y="1260" font-size="18" font-weight="400" text-anchor="start" class="sub">虚线：注册 / 发现</text>
</svg>
