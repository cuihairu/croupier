<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1652" viewBox="0 0 1200 1652" role="img" aria-labelledby="title desc"><title id="title">启动注册与断线恢复</title><desc id="desc">2026-10-30 source review. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1652" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">启动注册与断线恢复</text>
<text x="30" y="78" class="small" text-anchor="start">时间向下 ↓ · 虚线为生命线 · ALT 框内选一个分支 · 无圆点交叉不相连</text>
<g data-node="游戏 SDK"><rect x="65" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="81" y="135" class="head" text-anchor="start">游戏 SDK</text>
</g>
<path d="M180 170 V1587" class="life"/>
<g data-node="Agent 宿主"><rect x="345" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="361" y="135" class="head" text-anchor="start">Agent 宿主</text>
</g>
<path d="M460 170 V1587" class="life"/>
<g data-node="Server / owner"><rect x="625" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="641" y="135" class="head" text-anchor="start">Server / owner</text>
</g>
<path d="M740 170 V1587" class="life"/>
<g data-node="数据库 / 协调"><rect x="905" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="921" y="135" class="head" text-anchor="start">数据库 / 协调</text>
</g>
<path d="M1020 170 V1587" class="life"/>
<g data-node="前置条件"><rect x="50" y="195" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="225" class="head" text-anchor="start">前置条件</text>
<text x="66" y="253" class="" text-anchor="start">先校验配置/scope；Server 先装配 DB/resolver/可选 cluster 再监听</text>
</g>
<text x="600" y="335" class="message" text-anchor="middle">02 · Agent 主动建 TCP/TLS → Register(scope / functions / Providers)</text>
<path d="M460 361 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="451" class="message" text-anchor="middle">03 · 校验连接身份绑定并更新 registry / agent_sessions / 可选 owner</text>
<path d="M740 477 H1020" class="edge control" marker-end="url(#control)"/>
<text x="600" y="567" class="message" text-anchor="middle">04 · Register ACK(sessionId / owner)；失败则关闭连接并重试</text>
<path d="M740 593 H460" class="edge control" marker-end="url(#control)"/>
<text x="600" y="683" class="message" text-anchor="middle">05 · SDK 主动 Connect(serviceId / descriptors)，可晚于 Agent 上线</text>
<path d="M180 709 H460" class="edge control" marker-end="url(#control)"/>
<text x="600" y="799" class="message" text-anchor="middle">06 · Connect ACK(sessionId)；本地 Provider 可路由</text>
<path d="M460 825 H180" class="edge control" marker-end="url(#control)"/>
<text x="600" y="915" class="message" text-anchor="middle">07 · 函数快照变化 → 去抖后重新 Register；不是命令重放</text>
<path d="M460 941 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="1031" class="message" text-anchor="middle">08 · 周期 Heartbeat(owner) → Server 续期与 ACK</text>
<path d="M460 1057 H740" class="edge control" marker-end="url(#control)"/>
<rect x="40" y="1115" width="1120" height="224" rx="12" fill="#faf5f5" stroke="#976a3d" stroke-width="2"/>
<text x="600" y="1230" class="small" text-anchor="middle">或 · 仅选一个分支</text>
<g data-node="ALT · 连接健康"><rect x="50" y="1123" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1153" class="head" text-anchor="start">ALT · 连接健康</text>
<text x="66" y="1181" class="" text-anchor="start">继续心跳/配置同步；不执行重连分支</text>
</g>
<g data-node="ALT · 断链 / 连续心跳失败"><rect x="50" y="1239" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1269" class="head" text-anchor="start">ALT · 断链 / 连续心跳失败</text>
<text x="66" y="1297" class="" text-anchor="start">关闭旧连接 → 新连接与全量注册；不恢复在途命令</text>
</g>
<text x="600" y="1379" class="message" text-anchor="middle">11 · 仅断线分支：按 agentID + sessionID 清旧会话，不删除新会话</text>
<path d="M740 1397 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<g data-node="结束条件"><rect x="50" y="1471" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1501" class="head" text-anchor="start">结束条件</text>
<text x="66" y="1529" class="" text-anchor="start">Stop / ctx 取消结束心跳重试并关闭连接；SDK 恢复依各语言实现</text>
</g>
<text x="30" y="1627" class="small" text-anchor="start">结束：仅代表图示边界，未承诺的恢复/排空能力见正文</text>
</svg>
