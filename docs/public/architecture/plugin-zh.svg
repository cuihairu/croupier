<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1536" viewBox="0 0 1200 1536" role="img" aria-labelledby="title desc"><title id="title">本地插件生命周期</title><desc id="desc">2026-10-30 source review. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1536" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">本地插件生命周期</text>
<text x="30" y="78" class="small" text-anchor="start">时间向下 ↓ · 虚线为生命线 · ALT 框内选一个分支 · 无圆点交叉不相连</text>
<g data-node="调用方"><rect x="65" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="81" y="135" class="head" text-anchor="start">调用方</text>
</g>
<path d="M180 170 V1471" class="life"/>
<g data-node="Agent 宿主"><rect x="345" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="361" y="135" class="head" text-anchor="start">Agent 宿主</text>
</g>
<path d="M460 170 V1471" class="life"/>
<g data-node="插件子进程"><rect x="625" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="641" y="135" class="head" text-anchor="start">插件子进程</text>
</g>
<path d="M740 170 V1471" class="life"/>
<g data-node="目标 / 结果"><rect x="905" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="921" y="135" class="head" text-anchor="start">目标 / 结果</text>
</g>
<path d="M1020 170 V1471" class="life"/>
<g data-node="前置条件"><rect x="50" y="195" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="225" class="head" text-anchor="start">前置条件</text>
<text x="66" y="253" class="" text-anchor="start">插件已配置且未裁剪；本地 go-plugin gRPC，不改变 SDK 协议</text>
</g>
<text x="600" y="335" class="message" text-anchor="middle">02 · 进入并发 gate；Stop / 预算到期时拒绝</text>
<path d="M180 361 H460" class="edge control" marker-end="url(#control)"/>
<text x="600" y="451" class="message" text-anchor="middle">03 · 首次/恢复调用：exec → handshake / Dispense → Describe</text>
<path d="M460 477 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="567" class="message" text-anchor="middle">04 · Describe ACK(name / version)；失败 Kill 并记退避</text>
<path d="M740 593 H460" class="edge control" marker-end="url(#control)"/>
<text x="600" y="683" class="message" text-anchor="middle">05 · 握手成功才进入有界 Check / Invoke；健康进程复用</text>
<path d="M460 709 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="799" class="message" text-anchor="middle">06 · 插件按其实现访问目标并产生结果</text>
<path d="M740 825 H1020" class="edge control" marker-end="url(#control)"/>
<text x="600" y="915" class="message" text-anchor="middle">07 · 结果 / 错误；探测凭据脱敏；释放并发 gate</text>
<path d="M740 941 H460" class="edge control" marker-end="url(#control)"/>
<rect x="40" y="999" width="1120" height="224" rx="12" fill="#faf5f5" stroke="#976a3d" stroke-width="2"/>
<text x="600" y="1114" class="small" text-anchor="middle">或 · 仅选一个分支</text>
<g data-node="ALT · 失败 / 超时 / 崩溃"><rect x="50" y="1007" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1037" class="head" text-anchor="start">ALT · 失败 / 超时 / 崩溃</text>
<text x="66" y="1065" class="" text-anchor="start">Kill → 失败计数/退避/熔断；另次允许调用才恢复</text>
</g>
<g data-node="ALT · 成功"><rect x="50" y="1123" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1153" class="head" text-anchor="start">ALT · 成功</text>
<text x="66" y="1181" class="" text-anchor="start">更新健康状态并复用，不执行失败分支</text>
</g>
<text x="600" y="1263" class="message" text-anchor="middle">10 · Stop：拒绝新工作，最多等 5s 在途，然后 Kill 子进程</text>
<path d="M180 1289 H460" class="edge control" marker-end="url(#control)"/>
<g data-node="结束条件"><rect x="50" y="1355" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1385" class="head" text-anchor="start">结束条件</text>
<text x="66" y="1413" class="" text-anchor="start">宿主清理子进程；握手与凭据过滤不构成安全沙箱</text>
</g>
<text x="30" y="1511" class="small" text-anchor="start">结束：仅代表图示边界，未承诺的恢复/排空能力见正文</text>
</svg>
