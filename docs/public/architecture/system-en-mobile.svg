<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580" role="img" aria-labelledby="title desc">
<title id="title">Croupier current architecture</title>
<desc id="desc">Console to Server; four Agent roles connect outbound, SDKs connect to the sidecar. Relational state, optional cluster coordination and a separate Redis analytics pipeline.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7c5260"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#292830} .heading{font-size:26px;font-weight:700} .label{font-size:20px;font-weight:700} .body{font-size:20px;fill:#55535e} .note{font-size:18px;fill:#6a6269} .line{fill:none;stroke:#7c5260;stroke-width:2;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5}</style>
<rect width="640" height="1580" rx="16" fill="#faf8f5"/>

<text x="28" y="43" class="heading">CROUPIER / CURRENT ARCHITECTURE</text>
<text x="28" y="73" class="note">Source review · 2026-10-28</text>
<rect x="24" y="100" width="592" height="91" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="132" class="label">Operator console · HTTP API / SSE</text>
<text x="44" y="163" class="body">React / Umi · Page Studio / Console</text>
<path d="M320 191 V222" class="line"/>
<rect x="24" y="222" width="592" height="116" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="254" class="label">Two optional ingress paths</text>
<text x="44" y="285" class="body">L7 nginx → HTTP :18780</text>
<text x="44" y="312" class="body">L4 HAProxy → Agent control :19090</text>
<path d="M320 338 V370" class="line"/>
<rect x="24" y="370" width="592" height="255" rx="12" fill="#f6e9ed" stroke="#b77a8b"/>
<text x="44" y="402" class="label">SERVER · MODULAR CONTROL PLANE</text>
<text x="44" y="433" class="body">Identity / scope / policy / contracts / pages</text>
<text x="44" y="460" class="body">functioninvoke → dispatch → Agent session</text>
<text x="44" y="487" class="body">Task state / SSE / SQL audit</text>
<text x="44" y="514" class="body">Optional HA: owner forwarding + epoch fencing</text>
<text x="44" y="541" class="body">Approvals in memory; plaintext interconnect</text>
<text x="44" y="568" class="body">TLS configurable; off in development templates</text>
<path d="M320 625 V657" class="line dash"/>
<rect x="24" y="657" width="592" height="116" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="689" class="label">Persistent state and optional coordination</text>
<text x="44" y="720" class="body">Relational DB: business / pages / tasks / audit</text>
<text x="44" y="747" class="body">Shared DB or Redis: membership / owner leases</text>
<text x="44" y="817" class="note">Agents dial L4 / control above; sessions are bidirectional</text>
<rect x="24" y="838" width="592" height="200" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="870" class="label">Role-specific Agents</text>
<text x="44" y="901" class="body">sidecar: SDK gateway / functions / tasks / plugins</text>
<text x="44" y="928" class="body">capture: CDC / checkpoints / rules</text>
<text x="44" y="955" class="body">synthetics: HTTP probes / probe plugins</text>
<text x="44" y="982" class="body">devops: session foundations; console relay pending</text>
<text x="44" y="1009" class="body">Each instance declares one gameId + env</text>
<path d="M320 1068 V1038" class="line"/>
<rect x="24" y="1068" width="592" height="90" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="1100" class="label">Game process + SDK → sidecar :19091</text>
<text x="44" y="1131" class="body">SDK initiates a bidirectional provider session</text>
<rect x="24" y="1185" width="592" height="116" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="1217" class="label">Shared core/ runtime · explicit role composition</text>
<text x="44" y="1248" class="body">transport / register / backoff / configsync</text>
<text x="44" y="1275" class="body">pluginhost / report / process / healthprobe</text>
<rect x="24" y="1330" width="592" height="174" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="44" y="1362" class="label">Separate analytics pipeline</text>
<text x="44" y="1393" class="body">ingest → Redis Streams</text>
<text x="44" y="1420" class="body">→ analytics-worker → ClickHouse</text>
<text x="44" y="1447" class="body">Built-in worker consumes Redis, not Kafka</text>
<text x="44" y="1474" class="body">Separate from SDK function execution</text>
<text x="24" y="1542" class="note">Arrows label connection or data flow; see text for limits</text>
</svg>