<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc"><title id="title">受控同步函数执行</title><desc id="desc">2026-10-29 source wiring. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1420" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">受控同步函数执行</text>
<text x="30" y="78" class="small" text-anchor="start">时间向下 ↓ · 虚线为生命线 · ALT 框内选一个分支 · 无圆点交叉不相连</text>
<g data-node="运营客户端"><rect x="65" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="81" y="135" class="head" text-anchor="start">运营客户端</text>
</g>
<path d="M180 170 V1355" class="life"/>
<g data-node="Server / 治理"><rect x="345" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="361" y="135" class="head" text-anchor="start">Server / 治理</text>
</g>
<path d="M460 170 V1355" class="life"/>
<g data-node="sidecar"><rect x="625" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="641" y="135" class="head" text-anchor="start">sidecar</text>
</g>
<path d="M740 170 V1355" class="life"/>
<g data-node="游戏 SDK"><rect x="905" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="921" y="135" class="head" text-anchor="start">游戏 SDK</text>
</g>
<path d="M1020 170 V1355" class="life"/>
<g data-node="前置条件"><rect x="50" y="195" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="225" class="head" text-anchor="start">前置条件</text>
<text x="66" y="253" class="" text-anchor="start">已登录、授权 scope、有效 binding；Agent / Provider 在线</text>
</g>
<text x="600" y="335" class="message" text-anchor="middle">02 · HTTP binding execute → 快照、输入契约、政策与权限门禁</text>
<path d="M180 361 H460" class="edge control" marker-end="url(#control)"/>
<rect x="40" y="419" width="1120" height="224" rx="12" fill="#faf5f5" stroke="#976a3d" stroke-width="2"/>
<text x="600" y="534" class="small" text-anchor="middle">或 · 仅选一个分支</text>
<g data-node="ALT · 拒绝 / 待审批：本次请求结束"><rect x="50" y="427" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="457" class="head" text-anchor="start">ALT · 拒绝 / 待审批：本次请求结束</text>
<text x="66" y="485" class="" text-anchor="start">返回拒绝或审批 ID，不下发；批准后经续跑重新校验</text>
</g>
<g data-node="ALT · 允许同步执行"><rect x="50" y="543" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="573" class="head" text-anchor="start">ALT · 允许同步执行</text>
<text x="66" y="601" class="" text-anchor="start">以下仅属允许分支；task 模式见独立任务图</text>
</g>
<text x="600" y="683" class="message" text-anchor="middle">05 · 本机 session 或单跳 owner → Invoke</text>
<path d="M460 709 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="799" class="message" text-anchor="middle">06 · Provider Invoke(JSON)；插件/内建函数按路由另选</text>
<path d="M740 825 H1020" class="edge control" marker-end="url(#control)"/>
<text x="600" y="915" class="message" text-anchor="middle">07 · 返回结果 / 错误；超时可能结果未知</text>
<path d="M1020 941 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="1031" class="message" text-anchor="middle">08 · InvokeResponse / error 经已有会话返回</text>
<path d="M740 1057 H460" class="edge control" marker-end="url(#control)"/>
<text x="600" y="1147" class="message" text-anchor="middle">09 · 按路径记录审计 → HTTP 结果 / 错误</text>
<path d="M460 1173 H180" class="edge control" marker-end="url(#control)"/>
<g data-node="结束条件与幂等边界"><rect x="50" y="1239" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1269" class="head" text-anchor="start">结束条件与幂等边界</text>
<text x="66" y="1297" class="" text-anchor="start">HTTP 返回不承诺游戏副作用可安全重试；未知结果需查游戏凭据</text>
</g>
<text x="30" y="1395" class="small" text-anchor="start">结束：仅代表图示边界，未承诺的恢复/排空能力见正文</text>
</svg>
