<text x="31" y="2148" class="" text-anchor="start">Blue: control/session; green: data; brown: external dependency; dashed: optional.</text>
<text x="31" y="2173" class="" text-anchor="start">Dots join edges; crossings without dots do not. Two heads show request/result, not two dialers.</text>
<text x="31" y="2198" class="" text-anchor="start">Topology is current wiring, not deployment proof. See runtime-topology for trust and lifecycle evidence.</text>
<text x="31" y="2223" class="" text-anchor="start">Redis coordination and analytics are distinct uses; shared placement needs failure/capacity checks.</text>
