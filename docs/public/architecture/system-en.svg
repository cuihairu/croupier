<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Croupier system processes and data flow</title><desc id="desc">Solid lines carry business requests and results; dashed lines carry registration and discovery. The console drives the Server over HTTPS, the Server dispatches to agents over outbound TCP sessions, and game processes register as local provider sessions.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="920" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">System processes and data flow</text>
<path d="M760 31 L806 31" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="818" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">Business / data</text>
<path d="M960 31 L1006 31" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="1018" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">Registration / discovery</text>
<text x="28" y="75" font-size="17" font-weight="400" text-anchor="start" class="sub">Agents only dial out: the Server never connects back to an agent, and an agent never connects back to an SDK.</text>
<rect x="28" y="106" width="1224" height="180" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="134" font-size="17" font-weight="600" text-anchor="start" class="teal">Control plane</text>
<g data-node="console">
<rect x="48" y="150" width="250" height="102" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="184" font-size="23" font-weight="600" text-anchor="start">console</text>
<text x="66" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">dashboard nginx</text>
<text x="66" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">Umi Max · Ant Design</text>
</g>
<g data-node="server">
<rect x="440" y="150" width="420" height="102" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="458" y="184" font-size="23" font-weight="600" text-anchor="start">server</text>
<text x="458" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">HTTP :18780 · TCP :19090</text>
<text x="458" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">Registry · policy · approvals · audit · dispatch</text>
</g>
<path d="M930 150 A130.0 14 0 0 1 1190 150 V250 A130.0 14 0 0 1 930 250 Z" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<ellipse cx="1060.0" cy="150" rx="130.0" ry="14" fill="#eef2f7" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1060.0" y="200" font-size="20" font-weight="600" text-anchor="middle">Storage</text>
<text x="1060.0" y="224" font-size="15" font-weight="400" text-anchor="middle" class="sub">Meta DB + per-game DBs · Redis</text>
<path d="M298 201 L440 201" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="291" y="178" width="156" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="369" y="194" font-size="15" font-weight="500" text-anchor="middle" class="blue">HTTPS · REST / SSE</text>
<path d="M860 201 L930 201" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="871" y="178" width="48" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="895" y="194" font-size="15" font-weight="500" text-anchor="middle" class="blue">SQL</text>
<rect x="28" y="380" width="1224" height="214" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="408" font-size="17" font-weight="600" text-anchor="start">Agent plane — outbound sessions only</text>
<g data-node="agent">
<rect x="300" y="434" width="400" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="318" y="468" font-size="23" font-weight="600" text-anchor="start">agent</text>
<text x="318" y="498" font-size="17" font-weight="400" text-anchor="start" class="sub">Local gateway :19091 · session client</text>
<text x="318" y="524" font-size="17" font-weight="400" text-anchor="start" class="sub">Job executor · extension sync puller</text>
</g>
<g data-node="satellite agents">
<rect x="760" y="434" width="360" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="778" y="468" font-size="23" font-weight="600" text-anchor="start">satellite agents</text>
<text x="778" y="498" font-size="17" font-weight="400" text-anchor="start" class="sub">capture · devops · synthetics</text>
<text x="778" y="524" font-size="17" font-weight="400" text-anchor="start" class="sub">No inbound listener</text>
</g>
<path d="M500 252 L500 434" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="354" y="314" width="136" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="422" y="330" font-size="15" font-weight="500" text-anchor="middle" class="blue">Invoke · results</text>
<path d="M620 434 L620 252" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="630" y="314" width="168" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="714" y="330" font-size="15" font-weight="500" text-anchor="middle" class="teal">Register · heartbeat</text>
<path d="M940 434 L940 366 L800 366 L800 252" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="790" y="343" width="144" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="862" y="359" font-size="15" font-weight="500" text-anchor="middle" class="teal">Register · report</text>
<rect x="28" y="638" width="1224" height="152" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="666" font-size="17" font-weight="600" text-anchor="start">Game processes</text>
<g data-node="game server A">
<rect x="220" y="688" width="250" height="88" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="238" y="722" font-size="22" font-weight="600" text-anchor="start">game server A</text>
<text x="238" y="751" font-size="17" font-weight="400" text-anchor="start" class="sub">SDK · provider session</text>
</g>
<g data-node="game server B">
<rect x="515" y="688" width="250" height="88" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="533" y="722" font-size="22" font-weight="600" text-anchor="start">game server B</text>
<text x="533" y="751" font-size="17" font-weight="400" text-anchor="start" class="sub">SDK · provider session</text>
</g>
<g data-node="third-party app">
<rect x="810" y="688" width="250" height="88" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="828" y="722" font-size="22" font-weight="600" text-anchor="start">third-party app</text>
<text x="828" y="751" font-size="17" font-weight="400" text-anchor="start" class="sub">Provider session</text>
</g>
<path d="M500 546 L500 606 L345 606 L345 688" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<path d="M500 606 L935 606 L935 688" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M640 606 L640 688" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="372" y="583" width="236" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="490" y="599" font-size="15" font-weight="500" text-anchor="middle" class="blue">Local TCP · provider session</text>
<rect x="28" y="822" width="1224" height="72" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="856" font-size="21" font-weight="600" text-anchor="start">analytics</text>
<text x="170" y="861" font-size="17" font-weight="400" text-anchor="start" class="sub">Optional profile: ingest :8088 (HMAC) → Redis Streams → analytics-worker → ClickHouse</text>
</svg>
