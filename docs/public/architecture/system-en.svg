<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">Croupier current architecture</title>
<desc id="desc">Console to Server; four Agent roles connect outbound, SDKs connect to the sidecar. Relational state, optional cluster coordination and a separate Redis analytics pipeline.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7c5260"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#292830} .heading{font-size:26px;font-weight:700} .label{font-size:20px;font-weight:700} .body{font-size:17px;fill:#55535e} .note{font-size:16px;fill:#6a6269} .line{fill:none;stroke:#7c5260;stroke-width:2;marker-end:url(#arrow)} .dash{stroke-dasharray:6 5}</style>
<rect width="1200" height="1050" rx="16" fill="#faf8f5"/>

<text x="28" y="43" class="heading">CROUPIER / CURRENT ARCHITECTURE</text>
<text x="28" y="73" class="note">Source review · 2026-10-28</text>
<rect x="30" y="104" width="330" height="105" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="50" y="136" class="label">Operator console</text>
<text x="50" y="167" class="body">React / Umi · Page Studio</text>
<text x="50" y="194" class="body">HTTP API / SSE</text>
<rect x="415" y="104" width="360" height="105" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="435" y="136" class="label">Web ingress · optional L7</text>
<text x="435" y="167" class="body">nginx → Server HTTP :18780</text>
<text x="435" y="194" class="body">HTTPS commonly ends at proxy</text>
<rect x="835" y="104" width="335" height="105" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="855" y="136" class="label">Agent ingress · optional L4</text>
<text x="855" y="167" class="body">HAProxy → control :19090</text>
<text x="855" y="194" class="body">Distributes persistent sessions</text>
<path d="M360 156 H415" class="line"/>
<path d="M595 209 V265" class="line"/>
<path d="M1000 209 V240 H750 V265" class="line"/>
<rect x="30" y="265" width="745" height="260" rx="12" fill="#f6e9ed" stroke="#b77a8b"/>
<text x="50" y="297" class="label">SERVER · MODULAR CONTROL PLANE</text>
<text x="50" y="328" class="body">HTTP: identity / scope / policy / pages and contracts</text>
<text x="50" y="355" class="body">Execution: functioninvoke → dispatch → Agent session</text>
<text x="50" y="382" class="body">Async: task_runs / task_events · queries and SSE</text>
<text x="50" y="409" class="body">Optional HA: owner forwarding · one hop · epoch fencing</text>
<text x="50" y="436" class="body">Approvals wired to memory; interconnect is plaintext TCP</text>
<text x="50" y="463" class="body">Audit follows path/policy; TLS is configuration-dependent</text>
<rect x="835" y="265" width="335" height="126" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="855" y="297" class="label">Relational database</text>
<text x="855" y="328" class="body">Business / contracts / pages / tasks</text>
<text x="855" y="355" class="body">SQL audit · optional game DBs</text>
<rect x="835" y="418" width="335" height="107" rx="12" fill="#ffffff" stroke="#d8d2d5" stroke-dasharray="6 5"/>
<text x="855" y="450" class="label">Cluster coordination · optional</text>
<text x="855" y="481" class="body">Shared DB or Redis</text>
<text x="855" y="508" class="body">Membership / Agent owner</text>
<path d="M775 330 H835" class="line"/>
<path d="M775 471 H835" class="line dash"/>
<text x="30" y="568" class="label">AGENTS / One gameId + env per instance; outbound connections</text>
<path d="M170 610 V592 H1184 V156 H1170" class="line"/>
<path d="M460 610 V592" fill="none" stroke="#7c5260" stroke-width="2"/>
<path d="M750 610 V592" fill="none" stroke="#7c5260" stroke-width="2"/>
<path d="M1040 610 V592" fill="none" stroke="#7c5260" stroke-width="2"/>
<rect x="30" y="610" width="270" height="136" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="50" y="642" class="label">sidecar</text>
<text x="50" y="673" class="body">SDK gateway / functions / tasks</text>
<text x="50" y="700" class="body">provider :19091</text>
<text x="50" y="727" class="body">Managed processes / plugins</text>
<rect x="320" y="610" width="270" height="136" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="340" y="642" class="label">capture</text>
<text x="340" y="673" class="body">Database CDC</text>
<text x="340" y="700" class="body">Checkpoints / filters / rules</text>
<text x="340" y="727" class="body">Separate capture role</text>
<rect x="610" y="610" width="270" height="136" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="630" y="642" class="label">synthetics</text>
<text x="630" y="673" class="body">External HTTP probes</text>
<text x="630" y="700" class="body">Results / probe plugins</text>
<text x="630" y="727" class="body">Separate probe role</text>
<rect x="900" y="610" width="270" height="136" rx="12" fill="#ffffff" stroke="#d8d2d5" stroke-dasharray="6 5"/>
<text x="920" y="642" class="label">devops</text>
<text x="920" y="673" class="body">Session foundations / allowlist</text>
<text x="920" y="700" class="body">Console relay incomplete</text>
<text x="920" y="727" class="body">RDP / VNC unavailable</text>
<rect x="30" y="792" width="400" height="90" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="50" y="824" class="label">Game process + SDK</text>
<text x="50" y="855" class="body">Dials sidecar; bidirectional session</text>
<path d="M165 792 V746" class="line"/>
<rect x="460" y="792" width="710" height="90" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="480" y="824" class="label">Shared core/ packages · composed by each role</text>
<text x="480" y="855" class="body">transport / register / backoff / configsync / pluginhost / report</text>
<text x="30" y="921" class="label">Separate analytics pipeline · outside SDK function routing</text>
<rect x="30" y="940" width="250" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="50" y="972" class="label">ingest</text>
<text x="50" y="1003" class="body">Receives events</text>
<rect x="330" y="940" width="250" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="350" y="972" class="label">Redis Streams</text>
<text x="350" y="1003" class="body">Queue / consumer groups</text>
<rect x="630" y="940" width="250" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="650" y="972" class="label">analytics-worker</text>
<text x="650" y="1003" class="body">Consume / aggregate</text>
<rect x="930" y="940" width="240" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="950" y="972" class="label">ClickHouse</text>
<text x="950" y="1003" class="body">Analytics storage</text>
<path d="M280 978 H330" class="line"/>
<path d="M580 978 H630" class="line"/>
<path d="M880 978 H930" class="line"/>
</svg>