<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1536" viewBox="0 0 1200 1536" role="img" aria-labelledby="title desc"><title id="title">CDC alert reporting and notification outlets</title><desc id="desc">2026-10-30 source review. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1536" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">CDC alert reporting and notification outlets</text>
<text x="30" y="78" class="small" text-anchor="start">Time ↓ · Dashed lifelines · Choose one ALT branch · Crossings do not join</text>
<g data-node="Source DB"><rect x="65" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="81" y="135" class="head" text-anchor="start">Source DB</text>
</g>
<path d="M180 170 V1471" class="life"/>
<g data-node="capture"><rect x="345" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="361" y="135" class="head" text-anchor="start">capture</text>
</g>
<path d="M460 170 V1471" class="life"/>
<g data-node="Server / owner"><rect x="625" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="641" y="135" class="head" text-anchor="start">Server / owner</text>
</g>
<path d="M740 170 V1471" class="life"/>
<g data-node="Station / Herald"><rect x="905" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="921" y="135" class="head" text-anchor="start">Station / Herald</text>
</g>
<path d="M1020 170 V1471" class="life"/>
<g data-node="Preconditions"><rect x="50" y="195" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="225" class="head" text-anchor="start">Preconditions</text>
<text x="66" y="253" class="" text-anchor="start">Source replication permissions/bookmark and registered uplink; Herald is opt-in</text>
</g>
<text x="600" y="335" class="message" text-anchor="middle">02 · Load bookmark → Open / Poll; source streams ChangeEvents back</text>
<path d="M460 361 H180" class="edge control" marker-end="url(#control)"/>
<text x="600" y="451" class="message" text-anchor="middle">03 · Optional journal → consume/rules → AckCheckpoint; periodically save bookmark</text>
<path d="M460 469 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="567" class="message" text-anchor="middle">04 · Persist rule hits in spool first; queue pressure still attempts durable storage</text>
<path d="M460 585 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="683" class="message" text-anchor="middle">05 · AlertEventRequest(rule / position / key / time / scope)</text>
<path d="M460 709 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="799" class="message" text-anchor="middle">06 · Normalize session identity; idempotent alert insert with deterministic ID</text>
<path d="M740 817 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="915" class="message" text-anchor="middle">07 · After persistence: Dispatch starts async delivery; delivery may precede or follow ACK</text>
<path d="M740 941 H1020" class="edge control" marker-end="url(#control)"/>
<rect x="40" y="999" width="1120" height="224" rx="12" fill="#faf5f5" stroke="#976a3d" stroke-width="2"/>
<text x="600" y="1114" class="small" text-anchor="middle">OR · choose one branch</text>
<g data-node="ALT · Report succeeded"><rect x="50" y="1007" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1037" class="head" text-anchor="start">ALT · Report succeeded</text>
<text x="66" y="1065" class="" text-anchor="start">CaptureRuleHitAck: Server → capture; remove the matching spool entry</text>
</g>
<path d="M740 1081 H460" class="edge control" marker-end="url(#control)"/>
<g data-node="ALT · Report failed"><rect x="50" y="1123" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1153" class="head" text-anchor="start">ALT · Report failed</text>
<text x="66" y="1181" class="" text-anchor="start">Keep spool and retry; persistence failure skips delivery, while a lost ACK leaves outcome unknown</text>
</g>
<g data-node="Notification failure semantics"><rect x="50" y="1239" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1269" class="head" text-anchor="start">Notification failure semantics</text>
<text x="66" y="1297" class="" text-anchor="start">Maintenance suppresses; permanent errors stop; transport errors retry finitely. Storage ACK is not delivery</text>
</g>
<g data-node="Termination"><rect x="50" y="1355" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1385" class="head" text-anchor="start">Termination</text>
<text x="66" y="1413" class="" text-anchor="start">Source EOF flushes/closes then reopens; cancellation flushes and closes the source</text>
</g>
<text x="30" y="1511" class="small" text-anchor="start">End: guarantees stop at this boundary; see text for recovery/drain gaps</text>
</svg>
