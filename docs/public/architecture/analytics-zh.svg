<svg data-check-edges="true" xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc"><title id="title">CROUPIER · 分析链路实际拓扑</title><desc id="desc">2026-10-30 source review. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1800" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">CROUPIER · 分析链路实际拓扑</text>
<text x="30" y="78" class="small" text-anchor="start">现状 · 默认 Redis 路径 · 箭头不代表时间顺序</text>
<g data-node="外部事件生产方"><rect x="40" y="115" width="550" height="100" rx="10" fill="#fff4e8" stroke="#aebdce"/>
<text x="56" y="145" class="head" text-anchor="start">外部事件生产方</text>
<text x="56" y="173" class="" text-anchor="start">游戏服 / 受信采集端 · 事件与支付 JSON</text>
<text x="56" y="198" class="" text-anchor="start">HMAC 密钥留在受信端，不分发到玩家客户端</text>
</g>
<path d="M315 215 V315" class="edge external" marker-end="url(#external)"/>
<text x="340" y="253" class="small" text-anchor="start">HTTP POST /api/ingest/{events,payments}</text>
<text x="340" y="281" class="small" text-anchor="start">HMAC-SHA256 · timestamp / nonce / body</text>
<g data-node="INGEST · cmd/ingest"><rect x="40" y="315" width="550" height="100" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="56" y="345" class="head" text-anchor="start">INGEST · cmd/ingest</text>
<text x="56" y="373" class="" text-anchor="start">独立进程 · 验签 / 限流 / 校验 / 发布</text>
<text x="56" y="398" class="" text-anchor="start">HTTP 202 只确认接入，不确认仓库落盘</text>
</g>
<path d="M315 415 V525" class="edge data" marker-end="url(#data)"/>
<text x="340" y="455" class="small" text-anchor="start">Redis RESP / XADD</text>
<text x="340" y="483" class="small" text-anchor="start">JSON envelope · data 字段</text>
<g data-node="REDIS · Streams"><rect x="40" y="525" width="550" height="115" rx="10" fill="#eaf5f1" stroke="#aebdce"/>
<text x="56" y="555" class="head" text-anchor="start">REDIS · Streams</text>
<text x="56" y="583" class="" text-anchor="start">analytics:events / analytics:payments</text>
<text x="56" y="608" class="" text-anchor="start">外部数据服务 · 消费组 / pending / 死信流</text>
<text x="56" y="633" class="" text-anchor="start">连接凭据与 TLS 由 Redis URL 配置</text>
</g>
<path d="M315 640 V745" class="edge data" marker-end="url(#data)" marker-start="url(#data)"/>
<text x="340" y="678" class="small" text-anchor="start">RESP / XREADGROUP + XACK</text>
<text x="340" y="706" class="small" text-anchor="start">worker 主动拉取；返回事件 / 支付</text>
<g data-node="WORKER · cmd/analytics-worker"><rect x="40" y="745" width="550" height="130" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="56" y="775" class="head" text-anchor="start">WORKER · cmd/analytics-worker</text>
<text x="56" y="803" class="" text-anchor="start">独立进程 · 消费 / 规范化 / 批写 / 聚合</text>
<text x="56" y="828" class="" text-anchor="start">pending 回收 / 失败重试 / 死信</text>
<text x="56" y="853" class="" text-anchor="start">Send 后 ACK；聚合并发待修 DATA-014</text>
</g>
<path d="M315 875 V995" class="edge data" marker-end="url(#data)"/>
<text x="340" y="920" class="small" text-anchor="start">clickhouse-go / INSERT batches</text>
<text x="340" y="948" class="small" text-anchor="start">DSN 决定地址 / 认证 / TLS</text>
<g data-node="CLICKHOUSE"><rect x="40" y="995" width="550" height="130" rx="10" fill="#eaf5f1" stroke="#aebdce"/>
<text x="56" y="1025" class="head" text-anchor="start">CLICKHOUSE</text>
<text x="56" y="1053" class="" text-anchor="start">analytics.events / analytics.payments</text>
<text x="56" y="1078" class="" text-anchor="start">minute_online / daily_users / daily_revenue</text>
<text x="56" y="1103" class="" text-anchor="start">外部数据服务 · 明细 + 现有聚合表</text>
</g>
<path d="M315 1245 V1125" class="edge control" marker-end="url(#control)" marker-start="url(#control)"/>
<text x="340" y="1167" class="small" text-anchor="start">clickhouse-go / SQL SELECT / rows</text>
<text x="340" y="1195" class="small" text-anchor="start">由 Server 发起 · 仓库只读 API</text>
<g data-node="SERVER · croupier-server"><rect x="40" y="1245" width="600" height="210" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="56" y="1275" class="head" text-anchor="start">SERVER · croupier-server</text>
<text x="56" y="1303" class="" text-anchor="start">一个独立进程，以下均为进程内模块</text>
<text x="56" y="1328" class="" text-anchor="start">Analytics API：scope / 报表查询 / 响应</text>
<text x="56" y="1353" class="" text-anchor="start">GORM：关系模型查询，与仓库来源不同</text>
<text x="56" y="1378" class="" text-anchor="start">Telemetry bridge：可选进程内事件发布器</text>
<text x="56" y="1403" class="" text-anchor="start">bridge 遥测不等于玩家活跃或完整留存</text>
</g>
<path d="M640 1400 H685 V582 H590" class="edge data optional" marker-end="url(#data)"/>
<text x="745" y="560" class="head" text-anchor="start">可选 bridge → Redis</text>
<text x="745" y="595" class="small" text-anchor="start">RESP / XADD · analytics:events</text>
<text x="745" y="625" class="small" text-anchor="start">进程内缓冲 / 后台批次</text>
<text x="745" y="655" class="small" text-anchor="start">无 ingest HTTP / HMAC 跳转</text>
<text x="745" y="1200" class="small" text-anchor="start">由 Server 发起 · SQL / GORM</text>
<text x="745" y="1228" class="small" text-anchor="start">请求 / 行结果 · 数据源配置凭据</text>
<g data-node="关系数据库"><rect x="760" y="1285" width="400" height="130" rx="10" fill="#eaf5f1" stroke="#aebdce"/>
<text x="776" y="1315" class="head" text-anchor="start">关系数据库</text>
<text x="776" y="1343" class="" text-anchor="start">元数据库 / 按 game 路由的库</text>
<text x="776" y="1368" class="" text-anchor="start">玩家 / 支付 / cohort 等模型</text>
<text x="776" y="1393" class="" text-anchor="start">不是从 ClickHouse 自动同步</text>
</g>
<path d="M640 1335 H760" class="edge control" marker-end="url(#control)" marker-start="url(#control)"/>
<path d="M315 1560 V1455" class="edge control" marker-end="url(#control)" marker-start="url(#control)"/>
<text x="340" y="1494" class="small" text-anchor="start">HTTP / JWT / gameId + env</text>
<text x="340" y="1522" class="small" text-anchor="start">浏览器请求 Server API，返回报表 JSON</text>
<g data-node="运营浏览器 · Analytics 页面"><rect x="40" y="1560" width="600" height="100" rx="10" fill="#fff4e8" stroke="#aebdce"/>
<text x="56" y="1590" class="head" text-anchor="start">运营浏览器 · Analytics 页面</text>
<text x="56" y="1618" class="" text-anchor="start">仓库页与关系报表页共用 Server API 入口</text>
<text x="56" y="1643" class="" text-anchor="start">浏览器不直连数据库，不持有数据库凭据</text>
</g>
<text x="30" y="1707" class="small" text-anchor="start">图例：绿色＝写入/事件传输；蓝色＝查询请求与响应；棕色＝外部上报；虚线＝可选。</text>
<text x="30" y="1737" class="small" text-anchor="start">交叉线无圆点不相连。节点底色区分进程、进程内模块、存储与外部端。</text>
<text x="30" y="1767" class="small" text-anchor="start">专业分析集成为目标方案，未画成已部署服务；指标正确性与持久化缺口见 DATA / ARCH 待办。</text>
</svg>
