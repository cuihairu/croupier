<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Croupier 系统进程与数据流</title><desc id="desc">实线表示业务请求与结果，虚线表示注册与发现。运营控制台经 HTTPS 驱动 Server，Server 通过 Agent 主动外联的 TCP 会话下发调用，游戏进程以本地 provider 会话注册。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="920" fill="#fff"/>
<text x="28" y="40" font-size="27" font-weight="600" text-anchor="start">系统进程与数据流</text>
<path d="M760 31 L806 31" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="818" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">业务 / 数据</text>
<path d="M960 31 L1006 31" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="1018" y="37" font-size="16" font-weight="400" text-anchor="start" class="sub">注册 / 发现</text>
<text x="28" y="75" font-size="17" font-weight="400" text-anchor="start" class="sub">Agent 只向外拨号：Server 永不回连 Agent，Agent 也永不回连 SDK。</text>
<rect x="28" y="106" width="1224" height="180" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="134" font-size="17" font-weight="600" text-anchor="start" class="teal">控制面</text>
<g data-node="console">
<rect x="48" y="150" width="250" height="102" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="66" y="184" font-size="23" font-weight="600" text-anchor="start">运营控制台</text>
<text x="66" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">dashboard nginx</text>
<text x="66" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">Umi Max · Ant Design</text>
</g>
<g data-node="server">
<rect x="440" y="150" width="420" height="102" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="458" y="184" font-size="23" font-weight="600" text-anchor="start">Server</text>
<text x="458" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">HTTP :18780 · TCP :19090</text>
<text x="458" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">注册表 · 策略 · 审批 · 审计 · 路由</text>
</g>
