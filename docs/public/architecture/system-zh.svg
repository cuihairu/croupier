<text x="350" y="1003" class="body">队列 / 消费组</text>
<rect x="630" y="940" width="250" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
<text x="650" y="972" class="label">analytics-worker</text>
<text x="650" y="1003" class="body">消费 / 聚合</text>
<rect x="930" y="940" width="240" height="78" rx="12" fill="#ffffff" stroke="#d8d2d5"/>
