<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1536" viewBox="0 0 1200 1536" role="img" aria-labelledby="title desc"><title id="title">CDC 告警上报与通知出口</title><desc id="desc">2026-10-29 source wiring. Time runs down sequence lifelines; ALT alternatives are exclusive. Crossings without dots do not join.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53658d"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237b72"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#976a3d"/></marker>
</defs><style>text{font:17px Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263344}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:15px;fill:#526174}.edge{stroke-width:2;fill:none}.control{stroke:#53658d}.data{stroke:#237b72}.external{stroke:#976a3d}.optional{stroke-dasharray:7 5}.life{stroke:#bdc6d2;stroke-width:1.3;stroke-dasharray:5 6}.message{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style>
<rect width="1200" height="1536" fill="#f8fafc"/>
<text x="30" y="45" class="title" text-anchor="start">CDC 告警上报与通知出口</text>
<text x="30" y="78" class="small" text-anchor="start">时间向下 ↓ · 虚线为生命线 · ALT 框内选一个分支 · 无圆点交叉不相连</text>
<g data-node="源数据库"><rect x="65" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="81" y="135" class="head" text-anchor="start">源数据库</text>
</g>
<path d="M180 170 V1471" class="life"/>
<g data-node="capture"><rect x="345" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="361" y="135" class="head" text-anchor="start">capture</text>
</g>
<path d="M460 170 V1471" class="life"/>
<g data-node="Server / owner"><rect x="625" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="641" y="135" class="head" text-anchor="start">Server / owner</text>
</g>
<path d="M740 170 V1471" class="life"/>
<g data-node="站内 / Herald"><rect x="905" y="105" width="230" height="65" rx="10" fill="#fff" stroke="#aebdce"/>
<text x="921" y="135" class="head" text-anchor="start">站内 / Herald</text>
</g>
<path d="M1020 170 V1471" class="life"/>
<g data-node="前置条件"><rect x="50" y="195" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="225" class="head" text-anchor="start">前置条件</text>
<text x="66" y="253" class="" text-anchor="start">源复制权限/bookmark 与已注册上行；Herald 按配置启用</text>
</g>
<text x="600" y="335" class="message" text-anchor="middle">02 · 加载位点 → Open / Poll；源持续返回 ChangeEvent</text>
<path d="M460 361 H180" class="edge control" marker-end="url(#control)"/>
<text x="600" y="451" class="message" text-anchor="middle">03 · 可选 journal → consume / 规则 → AckCheckpoint；周期保存位点</text>
<path d="M460 469 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="567" class="message" text-anchor="middle">04 · 规则命中先持久 spool；入队满仍尝试留盘</text>
<path d="M460 585 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="683" class="message" text-anchor="middle">05 · AlertEventRequest(rule / position / key / time / scope)</text>
<path d="M460 709 H740" class="edge control" marker-end="url(#control)"/>
<text x="600" y="799" class="message" text-anchor="middle">06 · 连接身份归一化；确定性告警 ID 幂等入库</text>
<path d="M740 817 h55 v24 h-55" class="edge control" marker-end="url(#control)"/>
<text x="600" y="915" class="message" text-anchor="middle">07 · 入库成功才 Dispatch 异步通知；送达可先于或晚于 ACK</text>
<path d="M740 941 H1020" class="edge control" marker-end="url(#control)"/>
<rect x="40" y="999" width="1120" height="224" rx="12" fill="#faf5f5" stroke="#976a3d" stroke-width="2"/>
<text x="600" y="1114" class="small" text-anchor="middle">或 · 仅选一个分支</text>
<g data-node="ALT · 上报成功"><rect x="50" y="1007" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1037" class="head" text-anchor="start">ALT · 上报成功</text>
<text x="66" y="1065" class="" text-anchor="start">CaptureRuleHitAck：Server → capture；删除对应 spool 项</text>
</g>
<path d="M740 1081 H460" class="edge control" marker-end="url(#control)"/>
<g data-node="ALT · 上报失败"><rect x="50" y="1123" width="1100" height="85" rx="10" fill="#f6eeee" stroke="#aebdce"/>
<text x="66" y="1153" class="head" text-anchor="start">ALT · 上报失败</text>
<text x="66" y="1181" class="" text-anchor="start">保留 spool 并重试；入库失败不通知，ACK 丢失则结果未知</text>
</g>
<g data-node="通知失败语义"><rect x="50" y="1239" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1269" class="head" text-anchor="start">通知失败语义</text>
<text x="66" y="1297" class="" text-anchor="start">维护抑制停止通知；永久拒绝不重试；网络错有限重试。存储 ACK 不是外部送达</text>
</g>
<g data-node="结束条件"><rect x="50" y="1355" width="1100" height="85" rx="10" fill="#eef1fb" stroke="#aebdce"/>
<text x="66" y="1385" class="head" text-anchor="start">结束条件</text>
<text x="66" y="1413" class="" text-anchor="start">源 EOF 刷位点/Close 后重开；ctx 取消最终刷位点并关闭源连接</text>
</g>
<text x="30" y="1511" class="small" text-anchor="start">结束：仅代表图示边界，未承诺的恢复/排空能力见正文</text>
</svg>
