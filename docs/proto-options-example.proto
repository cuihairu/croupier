syntax = "proto3";

package examples.player.v1;

import "google/protobuf/descriptor.proto";
import "croupier/options/v1/function_options.proto";
import "croupier/common/v1/ui.proto";

// 玩家服务示例
service PlayerService {
  // 获取玩家信息 - 展示基本配置
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {
    option (croupier.options.v1.function) = {
      function_id: "player.get_info";
      category: "player";
      version: "1.2.0";
      risk: "low";
      mode: "query";
      timeout: "10s";
      idempotency_key: true;
      placement: "agent";
      display_name: {
        zh: "获取玩家信息",
        en: "Get Player Info"
      };
      summary: {
        zh: "根据玩家ID获取玩家的基本信息、状态和游戏数据",
        en: "Retrieve player information by player ID"
      };
      tags: ["player", "info", "query"];
      permissions: {
        verbs: ["read"];
        scopes: ["player:read"];
        default_grants: {
          admin: ["read"],
          operator: ["read"]
        };
      };
      ui: {
        category: "Player Management";
        icon: "user";
        order: 10
      };
    };
  }

  // 修改玩家状态 - 展示风险和权限控制
  rpc UpdatePlayerStatus(UpdatePlayerStatusRequest) returns (UpdatePlayerStatusResponse) {
    option (croupier.options.v1.function) = {
      function_id: "player.update_status";
      category: "player";
      version: "1.0.0";
      risk: "high";
      mode: "command";
      timeout: "5s";
      two_person_rule: true;
      placement: "agent";
      display_name: {
        zh: "修改玩家状态",
        en: "Update Player Status"
      };
      summary: {
        zh: "修改玩家状态（如封禁、解禁等），需要双人审核",
        en: "Update player status (ban/unban etc.), requires two-person approval"
      };
      tags: ["player", "admin", "status"];
      permissions: {
        verbs: ["update"];
        scopes: ["player:admin"];
        default_grants: {
          admin: ["update"],
          operator: []
        };
      };
      ui: {
        category: "Player Management";
        icon: "setting";
        order: 20;
        confirm: {
          zh: "确定要修改玩家状态吗？此操作需要管理员审核。",
          en: "Are you sure to update player status? This operation requires admin review."
        };
      };
    };
  }

  // 增加金币 - 展示并发控制
  rpc AddGold(AddGoldRequest) returns (AddGoldResponse) {
    option (croupier.options.v1.function) = {
      function_id: "player.add_gold";
      category: "economy";
      version: "1.0.0";
      risk: "medium";
      mode: "command";
      timeout: "30s";
      placement: "agent";
      display_name: {
        zh: "增加金币",
        en: "Add Gold"
      };
      summary: {
        zh: "为玩家增加金币数量",
        en: "Add gold to player's account"
      };
      tags: ["player", "economy", "gold"];
      permissions: {
        verbs: ["create"];
        scopes: ["economy:modify"];
        default_grants: {
          admin: ["create"],
          gm: ["create"]
        };
      };
    };
  }
}

// 请求消息示例
message GetPlayerRequest {
  uint64 player_id = 1 [(croupier.options.v1.ui) = {
    label: "玩家ID",
    widget: "number",
    required: true,
    placeholder: "请输入玩家ID"
  }];
}

message UpdatePlayerStatusRequest {
  uint64 player_id = 1 [(croupier.options.v1.ui) = {
    label: "玩家ID",
    widget: "number",
    required: true
  }];

  enum PlayerStatus {
    ACTIVE = 0;
    BANNED = 1;
    SUSPENDED = 2;
  }

  PlayerStatus status = 2 [(croupier.options.v1.ui) = {
    label: "状态",
    widget: "select",
    required: true,
    options: [
      { value: "ACTIVE", label: "正常" },
      { value: "BANNED", label: "封禁" },
      { value: "SUSPENDED", label: "暂停" }
    ]
  }];

  string reason = 3 [(croupier.options.v1.ui) = {
    label: "原因",
    widget: "textarea",
    required: true,
    placeholder: "请输入修改原因"
  }];
}

message AddGoldRequest {
  uint64 player_id = 1 [(croupier.options.v1.ui) = {
    label: "玩家ID",
    widget: "number",
    required: true
  }];

  int64 amount = 2 [(croupier.options.v1.ui) = {
    label: "金币数量",
    widget: "number",
    required: true,
    minimum: 1,
    maximum: 1000000
  }];

  string reason = 3 [(croupier.options.v1.ui) = {
    label: "原因",
    widget: "textarea"
  }];
}

// 响应消息示例
message GetPlayerResponse {
  uint64 player_id = 1;
  string nickname = 2;
  int32 level = 3;
  int64 gold = 4;
  PlayerStatus status = 5;
  string last_login = 6;
}

message UpdatePlayerStatusResponse {
  bool success = 1;
  string message = 2;
  PlayerStatus old_status = 3;
  PlayerStatus new_status = 4;
}

message AddGoldResponse {
  bool success = 1;
  string message = 2;
  int64 old_balance = 3;
  int64 new_balance = 4;
  int64 added_amount = 5;
}