server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HA 双实例负载均衡：
    # - resolver + 变量 proxy_pass 运行时解析（开源 nginx upstream 块只在
    #   启动时解析一次，server 容器重建换 IP 会 502；变量方式 10s 重解析）
    # - split_clients 按请求随机哈希分流，两实例各半；服务端为无状态
    #   （JWT 认证 + 共享 DB），SSE watch 亦为共享库轮询实现，任意实例
    #   均可服务；函数调用经集群互联转发到 owner 实例（HA 二期）
    # - croupier-server / croupier-server2 为 compose 容器名（固定短名
    #   防宿主 search domain 解析到外部域名）
    resolver 127.0.0.11 valid=10s ipv6=off;

    split_clients $request_id $croupier_backend {
        50%      croupier-server:18780;
        *        croupier-server2:18780;
    }

    # API requests -> server instances inside docker network
    location /api/ {
        proxy_pass http://$croupier_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/watch、任务事件流）：关缓冲拉长超时，保证事件实时推送
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # History API fallback for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
