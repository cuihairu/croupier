server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 分流变量 $croupier_backend 由 nginx-main.conf http 块的
    # split_clients 定义（http 级指令，server 块内不可声明）；
    # croupier-server / croupier-server2 为 compose 容器名（固定短名
    # 防宿主 search domain 解析到外部域名）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API requests -> server instances inside docker network
    location /api/ {
        proxy_pass http://$croupier_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/watch、任务事件流）：关缓冲拉长超时，保证事件实时推送
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # History API fallback for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}