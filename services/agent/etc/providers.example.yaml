# ============================================================================
# Croupier Agent - Provider 配置示例
# ============================================================================
# 此文件展示如何通过 OpenAPI 文件注册函数到 Agent
#
# 配置位置：services/agent/etc/providers.yaml
# ============================================================================

providers:
  # ========================================================================
  # 示例 1: 从本地文件加载单个 OpenAPI spec
  # ========================================================================
  local_functions:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 方式 1: 使用单个 OpenAPI 文件
      openapi_spec: ./etc/openapi.example.yaml

      # 或者使用绝对路径
      # openapi_spec: /path/to/openapi.yaml

      # Base URL（如果需要调用实际的后端服务）
      base_url: http://localhost:18780

      # 超时设置
      timeout: 30s

      # 重试次数
      retry_count: 3

      # 认证配置（可选）
      # auth:
      #   type: bearer  # 可选: none, bearer, basic, api_key, custom
      #   token: "${API_TOKEN}"  # 支持环境变量

  # ========================================================================
  # 示例 2: 从本地文件加载多个 OpenAPI specs
  # ========================================================================
  game_functions:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 方式 2: 使用多个 OpenAPI 文件（会自动合并）
      openapi_specs:
        - ./etc/openapi.example.yaml          # 示例函数
        - ../../packs/http/openapi.yaml          # HTTP 函数包
        - ../../packs/player/openapi.yaml        # 玩家管理包
        - ../../packs/prom/openapi.yaml          # Prometheus 查询包
        - ../../packs/grafana/openapi.yaml       # Grafana 集成包

      base_url: http://localhost:18780
      timeout: 30s
      retry_count: 3

      # 默认请求头
      headers:
        X-Game-ID: "${GAME_ID}"
        X-Env: "${ENV}"

  # ========================================================================
  # 示例 3: 从远程 URL 加载 OpenAPI spec
  # ========================================================================
  external_api:
    enabled: false  # 默认禁用，按需启用
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 方式 3: 从 HTTP URL 加载 OpenAPI spec
      openapi_spec: https://api.example.com/openapi.yaml

      base_url: https://api.example.com
      timeout: 10s
      retry_count: 2

      # API Key 认证
      auth:
        type: api_key
        api_key:
          name: X-API-Key
          value: "${EXTERNAL_API_KEY}"
          in: header  # 或 query

  # ========================================================================
  # 示例 4: 手动定义方法（不使用 OpenAPI 自动发现）
  # ========================================================================
  manual_methods:
    enabled: false
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      base_url: http://localhost:18780
      timeout: 30s

      # 方式 4: 手动定义 API 方法（完全控制）
      methods:
        - name: get_player
          operation_id: player.get
          summary: 获取玩家信息
          description: 根据玩家 ID 获取详细信息
          path: /api/v1/player/{player_id}
          method: GET
          tags: [player, read]
          parameters:
            - name: player_id
              in: path
              required: true
              type: string
              description: 玩家 ID
            - name: include
              in: query
              required: false
              type: string
              description: 额外包含的字段

        - name: ban_player
          operation_id: player.ban
          summary: 封禁玩家
          description: 永久封禁玩家账号
          path: /api/v1/player/{player_id}/ban
          method: POST
          tags: [player, moderation]
          deprecated: false
          parameters:
            - name: player_id
              in: path
              required: true
              type: string
          request_body:
            type: json
            fields:
              reason: reason
              duration: duration
              moderator: moderator_id

  # ========================================================================
  # 示例 5: 混合使用 OpenAPI 自动发现和手动方法
  # ========================================================================
  hybrid_functions:
    enabled: false
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 先从 OpenAPI 文件自动发现
      openapi_spec: ./etc/openapi.example.yaml
      base_url: http://localhost:18780

      # 然后添加手动定义的方法（会与自动发现的方法合并）
      methods:
        - name: custom_function
          summary: 自定义函数
          path: /api/v1/custom
          method: POST
          tags: [custom]

  # ========================================================================
  # 示例 6: 带响应转换的配置
  # ========================================================================
  legacy_api:
    enabled: false
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_spec: https://legacy.example.com/api-docs/swagger.json
      base_url: https://legacy.example.com
      timeout: 30s

      # 响应转换（将旧 API 格式转换为标准格式）
      transform:
        success_field: code
        success_value: 0
        data_field: data
        error_field: message

  # ========================================================================
  # 示例 7: 带速率限制的配置
  # ========================================================================
  rate_limited_api:
    enabled: false
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_spec: ./etc/openapi.example.yaml
      base_url: http://localhost:18780

      # 速率限制（每分钟请求数）
      rate_limit:
        requests_per_minute: 60
        burst_size: 10

# ============================================================================
# 配置说明
# ============================================================================
#
## 文件位置
# - 配置文件应放置在: services/agent/etc/providers.yaml
# - OpenAPI 文件建议放在: services/agent/etc/*.yaml
# - 或者使用绝对路径
#
## 环境变量
# 配置中支持 ${VAR_NAME} 格式的环境变量：
# - token: "${API_TOKEN}"
# - base_url: "http://${SERVICE_HOST}:${SERVICE_PORT}"
#
## OpenAPI 文件格式
# 支持:
# - JSON 格式 (.json)
# - YAML 格式 (.yaml, .yml)
# - HTTP/HTTPS URL
# - 本地文件路径（相对或绝对）
#
## 加载顺序
# 1. 先加载 openapi_specs 列表中的所有文件（如果有）
# 2. 然后加载 openapi_spec 单个文件（如果有）
# 3. 最后加载手动定义的 methods（如果有）
# 4. 后加载的方法会覆盖先加载的同名方法
#
## 函数命名
# - 注册的函数 ID 格式: "{platform_name}.{method_name}"
# - 例如: local_functions.player.create
# - method_name 优先使用 operationId，否则从 path 生成
#
## 验证配置
# 启动 Agent 时会自动加载 providers.yaml，检查日志确认：
# - "provider loaded" 表示成功
# - "failed to init provider" 表示配置有误
