Name: croupier-agent
Host: 0.0.0.0
Port: 18888

# Server configuration
Server:
  Addr: localhost:18443
  Insecure: false  # Use TLS (server auto-generates certs when Config.Cert/Key are empty)
  TLSCertFile: ""
  TLSKeyFile: ""
  CAFile: "etc/certs/ca.crt"  # CA cert for verifying server (auto-generated by server)
  ServerName: ""
  InsecureSkipVerify: false  # Verify server cert using CA

# Agent configuration
Agent:
  ID: ""
  GameID: ""
  Env: ""
  LocalAddr: "127.0.0.1:19090"
  HTTPAddr: "127.0.0.1:19091"
  Region: ""
  Zone: ""
  Labels: {}

# gRPC configuration
GRPC:
  Host: 127.0.0.1
  Port: 19090
  Timeout: 30000

# Upstream configuration
Upstream:
  HeartbeatInterval: 30
  RetryInterval: 5
  MaxRetries: 3
  Timeout: 10000

# Job configuration
Job:
  MaxConcurrent: 100
  Timeout: 300000
  Retries: 3

# Metrics configuration
Metrics:
  Enabled: true
  Port: 9090
  Path: /metrics

# TLS configuration
TLS:
  Enabled: false
  CertFile: ""
  KeyFile: ""
  CAFile: ""
  InsecureSkipVerify: false

# Outbound TLS for connecting to game servers (FunctionService)
OutboundTLS:
  Enabled: false
  CertFile: ""
  KeyFile: ""
  CAFile: ""
  ServerName: ""
  InsecureSkipVerify: false
