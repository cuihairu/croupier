Name: croupier-agent
Host: 0.0.0.0
Port: 18888

# Server configuration
Server:
  Addr: localhost:18443
  Insecure: false              # Use TLS (encryption)
  TLSCertFile: ""              # Client cert (for mTLS, not needed for local dev)
  TLSKeyFile: ""               # Client key (for mTLS, not needed for local dev)
  CAFile: ""                    # CA cert (not needed when InsecureSkipVerify=true)
  ServerName: ""
  InsecureSkipVerify: true     # Skip cert verification for local dev (TLS still used)

# Agent configuration
Agent:
  ID: ""
  GameID: ""
  Env: ""
  LocalAddr: "127.0.0.1:19090"
  HTTPAddr: "127.0.0.1:19091"
  Region: ""
  Zone: ""
  Labels: {}

# gRPC configuration
GRPC:
  Host: 127.0.0.1
  Port: 19090
  Timeout: 30000

# Upstream configuration
Upstream:
  HeartbeatInterval: 30
  RetryInterval: 5
  MaxRetries: 3
  Timeout: 10000

# Job configuration
Job:
  MaxConcurrent: 100
  Timeout: 300000
  Retries: 3

# Metrics configuration
Metrics:
  Enabled: true
  Port: 9090
  Path: /metrics

# TLS configuration
TLS:
  Enabled: false
  CertFile: ""
  KeyFile: ""
  CAFile: ""
  InsecureSkipVerify: false

# Outbound TLS for connecting to game servers (FunctionService)
OutboundTLS:
  Enabled: false
  CertFile: ""
  KeyFile: ""
  CAFile: ""
  ServerName: ""
  InsecureSkipVerify: false
