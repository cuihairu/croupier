# ============================================
# Croupier Agent 配置文件
# ============================================
# 这是 Agent 的主配置文件示例，包含所有可配置项及其默认值
# Agent 负责连接到 Server 并执行游戏函数调用

# ============================================
# 服务基本配置 (go-zero RestConf)
# ============================================
Name: croupier-agent            # 服务名称
Host: 0.0.0.0                   # 监听地址
Port: 18888                     # HTTP 管理端口
Timeout: 30000                  # 超时时间(毫秒)

# ============================================
# Server 配置 (连接到 Croupier Server)
# ============================================
Server:
  Addr: "localhost:19090"       # Server NNG ControlService 地址
  Insecure: false                # 是否使用 TLS 加密
  TLSCertFile: ""                # 客户端证书 (mTLS 需要，本地开发不需要)
  TLSKeyFile: ""                 # 客户端私钥 (mTLS 需要，本地开发不需要)
  CAFile: ""                     # CA 证书
  ServerName: ""                 # 期望的服务器名称 (SNI)
  InsecureSkipVerify: true       # 跳过证书验证 (本地开发时使用，TLS 仍会启用)

# ============================================
# Agent 配置
# ============================================
Agent:
  ID: ""                         # Agent ID (留空自动生成)
  GameID: ""                     # 游戏 ID
  Env: ""                        # 环境标识 (dev/test/prod)
  LocalAddr: "127.0.0.1:19090"   # 本地 NNG 监听地址 (SDK 连接用)
  HTTPAddr: "127.0.0.1:19091"    # 本地 HTTP 管理地址
  Region: ""                     # 区域
  Zone: ""                       # 可用区
  Labels: {}                     # 自定义标签

# ============================================
# ServerControl 配置 (连接到 Server 的 NNG 控制服务)
# ============================================
ServerControl:
  Host: "127.0.0.1"              # Server 主机地址
  Port: 19090                    # Server NNG 端口
  Timeout: 30000                 # 连接超时(毫秒)
  IPCAddr: ""                    # IPC 地址(可选)，用于本地高性能通信
                                 # Windows: ipc://croupier-server
                                 # Linux: ipc:///tmp/croupier-server.sock

# ============================================
# LocalNNG 配置 (本地 NNG 服务器，供 SDK 连接)
# ============================================
LocalNNG:
  Addr: ":19090"                 # 监听地址，如 ":19090" 或 ":19090,ipc://croupier-agent"
  IPCAddr: ""                    # IPC 地址，如 "ipc://croupier-agent"

# ============================================
# Upstream 配置 (连接到 Server 的上游设置)
# ============================================
Upstream:
  HeartbeatInterval: 30          # 心跳间隔(秒)
  RetryInterval: 5               # 重试间隔(秒)
  MaxRetries: 3                  # 最大重试次数
  Timeout: 10000                 # 请求超时(毫秒)

# ============================================
# Job 配置 (任务执行设置)
# ============================================
Job:
  MaxConcurrent: 100             # 最大并发任务数
  Timeout: 300000                # 任务超时(毫秒)，默认 5 分钟
  Retries: 3                     # 失败重试次数

# ============================================
# Metrics 配置
# ============================================
Metrics:
  Enabled: true                  # 是否启用指标采集
  Port: 9090                     # Prometheus 指标端口
  Path: "/metrics"               # 指标路径

# ============================================
# TLS 配置 (入站 TLS，接受 Server 连接)
# ============================================
TLS:
  Enabled: false                 # 是否启用 TLS
  CertFile: ""                   # 证书文件路径
  KeyFile: ""                    # 私钥文件路径
  CAFile: ""                     # CA 证书文件路径
  InsecureSkipVerify: false      # 是否跳过证书验证

# ============================================
# OutboundTLS 配置 (连接到游戏服务器的出站 TLS)
# ============================================
OutboundTLS:
  Enabled: false                 # 是否启用 mTLS
  CertFile: ""                   # 客户端证书文件
  KeyFile: ""                    # 客户端私钥文件
  CAFile: ""                     # CA 证书文件
  ServerName: ""                 # 期望的服务器名称 (SNI)
  InsecureSkipVerify: false      # 是否跳过证书验证

# ============================================
# Logging (日志) 配置
# ============================================
Log:
  Level: "info"                  # 日志级别: debug|info|warn|error
  Format: "console"              # 日志格式: console|json
  Output: "stdout"               # 输出位置: stdout|stderr
  File: ""                       # 日志文件路径 (留空则不写文件，如 "./logs/agent.log")
  MaxSize: 100                   # 单个日志文件最大大小 (MB)
  MaxBackups: 3                  # 保留的旧日志文件数量
  MaxAge: 7                      # 保留旧日志文件的最大天数
  Compress: true                 # 是否压缩旧日志文件
