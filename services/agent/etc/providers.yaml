# ============================================================================
# Croupier Agent - 默认 Provider 配置
# ============================================================================
# 此配置用于 VS Code 调试启动
# 自动加载多个 OpenAPI 文件
# ============================================================================

providers:
  # ========================================================================
  # 示例函数（用于开发测试）
  # ========================================================================
  examples:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_spec: ./etc/openapi.example.yaml
      base_url: http://localhost:8080
      timeout: 30s
      retry_count: 3

  # ========================================================================
  # 加载所有 Pack 函数
  # ========================================================================
  packs:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_specs:
        - ../../packs/http/openapi.yaml
        - ../../packs/prom/openapi.yaml
        - ../../packs/player/openapi.yaml
        - ../../packs/grafana/openapi.yaml
        - ../../packs/alertmanager/openapi.yaml
      base_url: http://localhost:8080
      timeout: 30s
      retry_count: 3
      rate_limit:
        requests_per_minute: 100
        burst_size: 20

# ============================================================================
# 说明
# ============================================================================
#
# 此配置会注册以下函数：
#
# 1. examples (13 个示例函数):
#    - examples.player.create
#    - examples.player.get
#    - examples.player.update_profile
#    - examples.player.delete
#    - examples.player.ban_batch
#    - examples.inventory.get
#    - examples.player.upload_avatar
#    - examples.player.list
#    - examples.chat.send_message
#    - examples.game.trigger_event
#    - examples.config.set
#    - examples.analytics.player_retention
#    - examples.player.get_stats_legacy
#
# 2. packs (6 个 Pack 函数):
#    - packs.http.generic_invoke
#    - packs.prom.query
#    - packs.prom.query_range
#    - packs.player.ban
#    - packs.grafana.search_dashboards
#    - packs.alertmanager.list_alerts
#
# ============================================================================
# 使用方法
# ============================================================================
#
# 在 VS Code 中按 F5，选择 "Agent (多文件示例)" 启动
#
# 或命令行启动：
# cd services/agent
# ../../bin/croupier-agent -f etc/agent.yaml
#
# ============================================================================
