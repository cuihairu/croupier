# ============================================================================
# Croupier Agent - 多服务配置示例
# ============================================================================
# 此文件展示如何注册多个 OpenAPI 文件，每个指向不同的后端服务
# ============================================================================

providers:
  # ========================================================================
  # 服务 1: 玩家服务 (端口 8081)
  # ========================================================================
  player_service:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 只包含玩家相关的 OpenAPI 文件
      openapi_specs:
        - ./etc/player-functions.yaml
        - ./etc/player-profile-functions.yaml

      # 指向玩家服务的端口
      base_url: http://localhost:8081

      timeout: 30s
      retry_count: 3

      # 玩家服务的认证
      auth:
        type: bearer
        token: "${PLAYER_SERVICE_TOKEN}"

      # 玩家服务的速率限制
      rate_limit:
        requests_per_minute: 100
        burst_size: 20

  # ========================================================================
  # 服务 2: 物品/背包服务 (端口 8082)
  # ========================================================================
  inventory_service:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 只包含物品相关的 OpenAPI 文件
      openapi_specs:
        - ./etc/inventory-functions.yaml
        - ./etc/item-functions.yaml
        - ./etc/shop-functions.yaml

      # 指向物品服务的端口
      base_url: http://localhost:8082

      timeout: 30s
      retry_count: 3

      # 物品服务的认证（可能不同）
      auth:
        type: bearer
        token: "${INVENTORY_SERVICE_TOKEN}"

      rate_limit:
        requests_per_minute: 150
        burst_size: 30

  # ========================================================================
  # 服务 3: 聊天服务 (端口 8083)
  # ========================================================================
  chat_service:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 只包含聊天相关的 OpenAPI 文件
      openapi_specs:
        - ./etc/chat-functions.yaml
        - ./etc/notification-functions.yaml

      # 指向聊天服务的端口
      base_url: http://localhost:8083

      timeout: 10s  # 聊天服务需要更快的响应
      retry_count: 1  # 聊天消息不重试

      auth:
        type: bearer
        token: "${CHAT_SERVICE_TOKEN}"

      # 聊天服务更高的速率限制
      rate_limit:
        requests_per_minute: 300
        burst_size: 50

  # ========================================================================
  # 服务 4: 匹配/游戏逻辑服务 (端口 8084)
  # ========================================================================
  match_service:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_specs:
        - ./etc/match-functions.yaml
        - ./etc/tournament-functions.yaml

      base_url: http://localhost:8084

      timeout: 60s  # 匹配可能需要更长时间
      retry_count: 2

      auth:
        type: bearer
        token: "${MATCH_SERVICE_TOKEN}"

      rate_limit:
        requests_per_minute: 50
        burst_size: 10

  # ========================================================================
  # 服务 5: 监控/分析服务 (端口 9090 - Prometheus)
  # ========================================================================
  monitoring_service:
    enabled: true
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      # 使用现有的 Prometheus pack
      openapi_specs:
        - ../packs/prom/openapi.yaml

      # Prometheus 服务端口
      base_url: http://localhost:9090

      timeout: 10s
      retry_count: 2

      # Prometheus 使用 basic auth
      auth:
        type: basic
        username: "${PROM_USER}"
        password: "${PROM_PASSWORD}"

  # ========================================================================
  # 服务 6: 外部 API (第三方服务)
  # ========================================================================
  external_api:
    enabled: false  # 默认禁用，按需启用
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_spec: https://external.example.com/api/openapi.yaml

      # 外部 API 的 URL
      base_url: https://external.example.com

      timeout: 30s
      retry_count: 3

      # 外部 API 的密钥
      auth:
        type: api_key
        api_key:
          name: X-API-Key
          value: "${EXTERNAL_API_KEY}"
          in: header

  # ========================================================================
  # 服务 7: Grafana 集成 (端口 3000)
  # ========================================================================
  grafana_service:
    enabled: false
    type: openapi
    game_id: "game-A"
    env: "prod"
    config:
      openapi_specs:
        - ../packs/grafana/openapi.yaml

      base_url: http://localhost:3000

      timeout: 30s
      retry_count: 2

      auth:
        type: bearer
        token: "${GRAFANA_TOKEN}"

  # ========================================================================
  # 服务 8: 本地开发服务 (端口 8080)
  # ========================================================================
  dev_service:
    enabled: false  # 仅开发环境启用
    type: openapi
    game_id: "game-A"
    env: "dev"
    config:
      openapi_specs:
        - ./etc/openapi.example.yaml

      base_url: http://localhost:18780

      timeout: 30s
      retry_count: 3

# ============================================================================
# 注册结果说明
# ============================================================================
#
# 上面的配置会注册以下函数（函数 ID 格式）：
#
# 1. player_service:
#    - player_service.player.create
#    - player_service.player.get
#    - player_service.player.update
#    - player_service.player.delete
#    - player_service.player.profile.update
#
# 2. inventory_service:
#    - inventory_service.inventory.get
#    - inventory_service.item.add
#    - inventory_service.item.remove
#    - inventory_service.shop.buy
#
# 3. chat_service:
#    - chat_service.chat.send
#    - chat_service.chat.get_history
#    - chat_service.notification.send
#
# 4. match_service:
#    - match_service.match.create
#    - match_service.match.join
#    - match_service.tournament.create
#
# 5. monitoring_service:
#    - monitoring_service.prom.query
#    - monitoring_service.prom.query_range
#
# 每个平台的函数会路由到对应的 base_url
#
# ============================================================================
# 使用场景
# ============================================================================
#
# 场景 1: 微服务架构
#   - 玩家服务 → player_service (8081)
#   - 物品服务 → inventory_service (8082)
#   - 聊天服务 → chat_service (8083)
#   - 匹配服务 → match_service (8084)
#
# 场景 2: 第三方集成
#   - Prometheus → monitoring_service (9090)
#   - Grafana → grafana_service (3000)
#   - 外部 API → external_api (https://...)
#
# 场景 3: 开发/生产分离
#   - 开发环境 → dev_service (8080)
#   - 生产环境 → prod_service (不同的 base_url)
#
# ============================================================================
# 环境变量配置
# ============================================================================
#
# 在启动 Agent 前设置环境变量：
#
# export PLAYER_SERVICE_TOKEN="token-for-player-service"
# export INVENTORY_SERVICE_TOKEN="token-for-inventory-service"
# export CHAT_SERVICE_TOKEN="token-for-chat-service"
# export MATCH_SERVICE_TOKEN="token-for-match-service"
# export PROM_USER="prometheus"
# export PROM_PASSWORD="prometheus-password"
# export GRAFANA_TOKEN="grafana-token"
# export EXTERNAL_API_KEY="external-api-key"
#
# 或使用 .env 文件：
#
# PLAYER_SERVICE_TOKEN=token-for-player-service
# INVENTORY_SERVICE_TOKEN=token-for-inventory-service
# CHAT_SERVICE_TOKEN=token-for-chat-service
# MATCH_SERVICE_TOKEN=token-for-match-service
# PROM_USER=prometheus
# PROM_PASSWORD=prometheus-password
# GRAFANA_TOKEN=grafana-token
# EXTERNAL_API_KEY=external-api-key
#
# ============================================================================
# 调用示例
# ============================================================================
#
# 调用玩家服务的函数：
# curl -X POST http://localhost:18780/api/v1/functions/invoke \
#   -d '{
#     "function_id": "player_service.player.create",
#     "payload": {...}
#   }'
#
# 调用物品服务的函数：
# curl -X POST http://localhost:18780/api/v1/functions/invoke \
#   -d '{
#     "function_id": "inventory_service.item.add",
#     "payload": {...}
#   }'
#
# Agent 会根据函数 ID 前缀自动路由到对应的服务
#
# ============================================================================
# 故障排查
# ============================================================================
#
# 问题 1: 函数调用失败，提示 connection refused
# 原因: 对应的服务未启动
# 解决: 检查各服务是否在正确的端口运行
#
# 问题 2: 认证失败
# 原因: 环境变量未设置或 token 错误
# 解决: 检查 ${SERVICE_TOKEN} 环境变量
#
# 问题 3: 函数未注册
# 原因: enabled: false 或 OpenAPI 文件路径错误
# 解决: 设置 enabled: true，检查文件路径
#
# ============================================================================
# 最佳实践
# ============================================================================
#
# 1. 命名规范
#    - 使用描述性的平台名称：player_service, inventory_service
#    - 避免使用 platform1, platform2 这种无意义名称
#
# 2. 独立的认证
#    - 每个服务使用独立的 token
#    - 使用环境变量管理，不要硬编码
#
# 3. 不同的速率限制
#    - 根据服务特性设置不同的速率限制
#    - 聊天服务 → 高频率、低延迟
#    - 匹配服务 → 低频率、高延迟
#
# 4. 超时配置
#    - 即时操作（查询）→ 10s
#    - 普通操作（创建）→ 30s
#    - 长时间操作（匹配）→ 60s
#
# 5. 错误隔离
#    - 一个服务故障不影响其他服务
#    - 每个平台独立配置 retry_count
#
# 6. 监控
#    - 为每个平台添加日志前缀
#    - 监控每个平台的调用次数和错误率
