# goctl 统一配置文件
# 适用于所有子服务：server, agent, edge, ingest, demo
# 设置默认命名风格为 go_zero（下划线分隔，符合 Go 官方规范）

# 全局命名风格
style: go_zero

# API 配置
api:
  # 文件命名风格：user_handler.go, user_logic.go
  style: go_zero

  # 是否生成 swagger 文档
  # swagger: false

# RPC 配置
rpc:
  # 文件命名风格
  style: go_zero

# Model 配置
model:
  # 文件命名风格
  style: go_zero

# 说明：
# 命名风格选项：
#   - go_zero   推荐！下划线分隔，如：user_handler.go
#   - gozero    默认，全小写无分隔，如：userhandler.go
#   - goZero    驼峰命名，如：userHandler.go（不符合Go规范）
#   - go-zero   短横线分隔，如：user-handler.go（不推荐）
