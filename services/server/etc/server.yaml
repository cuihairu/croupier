# go-zero server configuration
Name: croupier-api
Host: 0.0.0.0
Port: 18780

# Database configuration
Database:
  Driver: sqlite
  DataSource: data/croupier.db

# gRPC server configuration (control plane)
GRPC:
  Addr: ":18443"          # gRPC (mTLS)
  Cert: ""                # TLS cert (empty to auto-generate)
  Key: ""                 # TLS key (empty to auto-generate)
  CA: ""                  # TLS CA (empty to auto-generate)

# Registry configuration
Registry:
  AssignmentsPath: "data/assignments.json"
  AnalyticsFiltersPath: "packs/ui/analytics_filters.json"
  RateLimitsPath: "data/rate_limits.json"

# Dispatch configuration
Dispatch:
  JobRoutingDir: "data"
  JobRoutingTTL: "" # e.g. "24h"; empty disables cleanup
  AgentTLS:
    Enabled: false
    CertFile: ""
    KeyFile: ""
    CAFile: ""
    ServerName: ""
    InsecureSkipVerify: false

# Authentication configuration
Auth:
  JWTSecret: "localdevsecret-change-me"
  RBACConfig: "configs/rbac.json"
  UsersConfig: "configs/users.json"
  GamesConfig: "configs/games.json"

# Bootstrap data (default JSON seeds)
BootstrapData:
  BaseDir: "configs"

# Descriptors configuration
Descriptors:
  Dir: "packs"

# Components configuration
Components:
  DataDir: "data"
  StagingDir: "data/components/staging"

# Schemas configuration
Schemas:
  Dir: "packs/ui"

# Packs configuration
Packs:
  Dir: "packs"

# Storage configuration
Storage:
  Driver: "file"
  BaseDir: "data/uploads"

# Cache configuration
Cache:
  Enabled: true
  Type: "local"          # local | redis
  TTL: "5m"             # Default TTL
  EvictTTL: "10m"       # Cleanup interval
  MaxItems: 10000       # Max items for local cache

# Logging configuration
CroupierLog:
  Level: "info"
  Format: "console"
  Output: "stdout"

# Metrics configuration
Metrics:
  PerFunction: true
  PerGameDenies: false
