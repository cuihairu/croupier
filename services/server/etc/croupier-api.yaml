# Croupier Server API 配置
# 所有配置都有智能默认值，可以直接启动

Name: croupier-api
Host: 0.0.0.0
Port: 8888

# 可选配置（开发模式不需要）：
#
# Auth:
#   JWTSecret: "your-secret"     # 不配置时使用 noop 认证（dev/admin）
#
# Server:
#   Database:
#     Driver: "sqlite"           # 默认 SQLite
#     DataSource: "data/croupier.db"
#
# Storage:
#   Driver: "file"               # 默认本地文件系统
#   BaseDir: "data/uploads"      # 默认上传目录
