syntax = "proto3";

package croupier.sdk.v1;
option java_package = "io.github.cuihairu.croupier.sdk.v1";
option java_multiple_files = true;

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/sdk/v1;sdkv1";

// Provider function declaration from embedded SDK to Agent.
// Based on OpenAPI 3.0.3 Operation Object fields.
message LocalFunctionDescriptor {
  string id = 1;                          // Unique function identifier
  string version = 2;                     // Function version

  // OpenAPI 3.0.3 Operation Object fields
  repeated string tags = 3;               // Tags for grouping operations
  string summary = 4;                     // Short summary
  string description = 5;                 // Detailed description (supports markdown)
  string operation_id = 6;                // Unique operation ID
  bool deprecated = 7;                    // Deprecation status

  // OpenAPI 3.0.3 Schema fields (JSON Schema format)
  string input_schema = 8;                // JSON Schema for request body
  string output_schema = 9;               // JSON Schema for response body

  // Croupier capability fields. These are business/governance contract fields,
  // not Dashboard page, menu, Formily, label, or placement fields.
  string resource = 10;                   // x-resource: business resource/capability key (e.g., "player", "mail")
  string operation = 11;                  // x-operation: business action key (e.g., "ban", "send", "list")
  string risk = 12;                       // x-risk: risk level (e.g., "safe", "warning", "high", "danger")
  bool enabled = 13;                      // x-enabled: whether this function is enabled
  string permission = 14;                 // x-permission: optional permission identifier
  string capability = 15;                 // x-capability: collection_query|item_query|create|update|delete|action|task|report
  string execution = 16;                  // x-execution: sync|task

  // Approval policy (independent of execution mode)
  bool approval_required = 17;            // x-approval.required: whether approval is required
  string approval_policy_key = 18;        // x-approval.policyKey: optional policy key (e.g., "two_person")
}

// ProviderConnectRequest establishes a provider session on the current SDK-Agent connection.
message ProviderConnectRequest {
  string service_id = 1;                     // Provider / process identifier
  string version = 2;                        // Provider version
  repeated LocalFunctionDescriptor functions = 3;
  string sdk_language = 4;                   // e.g. "go", "java", "csharp"
  string sdk_version = 5;                    // SDK release version
  string sdk_name = 6;                       // SDK display name, e.g. "croupier-js-sdk"; user-overridable
  string protocol_version = 7;               // Wire protocol semantic version string
  repeated string supported_capabilities = 8;
  string transport_security_mode = 9;        // "plaintext" | "tls"
  repeated string supported_transports = 10; // currently fixed to "tcp"
  string game_id = 11;                       // game scope the provider belongs to (validated against agent)
  string env = 12;                           // logical environment (prod/stage/dev)
}

message ProviderConnectResponse {
  string session_id = 1;
  repeated string accepted_capabilities = 2;
  repeated string warnings = 3;
}

message ProviderHeartbeatRequest {
  string service_id = 1;
  string session_id = 2;
}

message ProviderHeartbeatResponse {}

message ProviderDrainRequest {
  string session_id = 1;
  string reason = 2;
  uint32 retry_after_ms = 3;
}

message ProviderDrainResponse {}

// Query task result from Agent (best-effort).
// This remains in the shared SDK package because task polling is still SDK-visible.
message GetTaskResultRequest {
  string task_id = 1;
}

message GetTaskResultResponse {
  string state = 1;
  bytes payload = 2;
  string error = 3;
}
