syntax = "proto3";

package croupier.sdk.v1;
option java_package = "io.github.cuihairu.croupier.sdk.v1";
option java_multiple_files = true;

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/sdk/v1;sdkv1";

// SDK Function Invocation Request.
// payload is always UTF-8 JSON in protocol v1.
message InvokeRequest {
  string function_id = 1;           // e.g. "player.ban"
  string idempotency_key = 2;       // client-supplied idempotency key
  bytes payload = 3;                // serialized request JSON bytes
  map<string, string> metadata = 4; // optional k/v metadata
}

// SDK Function Invocation Response.
// payload is always UTF-8 JSON in protocol v1.
message InvokeResponse {
  bytes payload = 1; // serialized response JSON bytes
}

// SDK Task Start Response
message StartTaskResponse {
  string task_id = 1;
}

// SDK Task Stream Request
message TaskStreamRequest {
  string task_id = 1;
}

// SDK Task Event.
// payload is always UTF-8 JSON in protocol v1.
message TaskEvent {
  string task_id = 1;
  string type = 2;      // "queued" | "started" | "progress" | "log" | "completed" | "failed" | "cancel_requested" | "cancelled"
  string message = 3;   // free text for log/error
  int32 progress = 4;   // 0..100 when type == progress
  bytes payload = 5;    // optional JSON bytes
}

// SDK Task Cancellation Request
message CancelTaskRequest {
  string task_id = 1;
}
