syntax = "proto3";

package croupier.component.v1;
option java_package = "io.github.cuihairu.croupier.component.v1";
option java_multiple_files = true;

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/component/v1;componentv1";

// Generic i18n text with common languages.
message I18nText {
  string en = 1;
  string zh = 2;
  // reserved for more locales
}

// Menu metadata for building dynamic navigation in the UI.
message Menu {
  // Dynamic menu tree nodes (english keys only), e.g. ["game","player"].
  // Optional: server may infer from category/entity/function_id when empty.
  repeated string nodes = 1;
  // Optional landing path. If empty, server generates default path by entity/function id.
  string path    = 2;
  int32  order   = 3;  // Ordering weight (ascending)
  string icon    = 4;  // Icon id (frontend mapping)
  string badge   = 5;  // "beta" | "new" | custom
  bool   hidden  = 6;  // true → do not show in menu
}

// Role binding: which roles should be granted which verbs by default.
message RoleBinding {
  string role = 1;
  repeated string verbs = 2;
}

// Permission specification for a resource (function/component).
message PermissionSpec {
  // Verbs applicable to the resource: e.g. read/invoke/view_history/manage/use
  repeated string verbs = 1;
  // Scopes supported for ABAC policies: e.g. game/env/function_id
  repeated string scopes = 2;
  // Default role → verbs bindings (suggested grants).
  repeated RoleBinding defaults = 3;
  // Optional zh texts per verb. If absent, UI will fallback to templates.
  map<string, string> i18n_zh = 4;
}
