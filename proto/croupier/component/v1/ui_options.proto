syntax = "proto3";
package croupier.component.v1;
option java_package = "io.github.cuihairu.croupier.component.v1";
option java_multiple_files = true;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/component/v1;componentv1";

// 已废弃：字段级 UI 元信息。
//
// UI 生成完全由 Server 端负责（见 docs/architecture/ui-generation.md）。
// Proto 层只定义 API 契约（类型、约束、语义），不定义展示细节。
// 字段的 widget、label、placeholder、条件显示等应由以下方式提供：
//   1. Server 端从 JSON Schema 自动推导
//   2. configs/ui/ 文件级配置覆盖
//   3. Dashboard UI 编辑器持久化
//
// 保留此消息定义以维持 wire 兼容性，新代码不应使用。
message UIFieldOptions {
  option deprecated = true;

  // 组件：input/textarea/number/select/checkbox/radio/switch/date/time/json-editor/file
  string widget = 1 [deprecated = true];
  // 标签文本/i18n key
  string label = 2 [deprecated = true];
  // 占位符
  string placeholder = 3 [deprecated = true];
  // 敏感字段（审计脱敏）
  bool sensitive = 4 [deprecated = true];
  // 静态枚举：value→label
  map<string,string> enum_map = 5 [deprecated = true];
  // 显隐/必填（表达式，CEL 语义，基于请求体字段）
  string show_if = 6 [deprecated = true];
  string required_if = 7 [deprecated = true];
}

extend google.protobuf.FieldOptions {
  UIFieldOptions ui = 52001 [deprecated = true];
}

