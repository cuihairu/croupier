syntax = "proto3";

package croupier.component.v1;
option java_package = "io.github.cuihairu.croupier.component.v1";
option java_multiple_files = true;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/component/v1;componentv1";

// FunctionOptions is a proto annotation for executable function capability
// contracts. It does not define Dashboard UI, menu, labels, page placement,
// Formily schema, or PageSpec.
message FunctionOptions {
  string function_id = 1;       // Stable function id, e.g. "player.ban".
  string version = 2;           // Function version.
  string resource = 3;          // Business resource/capability key.
  string operation = 4;         // Business action key.
  string risk = 5;              // safe/warning/high/danger.
  string route = 6;             // lb/broadcast/targeted/hash.
  string timeout = 7;           // e.g. "30s".
  bool two_person_rule = 8;     // Whether approval is required.
  string mode = 9;              // query/command.
  bool idempotency_key = 10;
  string summary = 11;          // Catalog/search text only.
  string description = 12;      // Catalog/help text only.
  repeated string tags = 13;
  string permission = 14;       // Optional permission identifier.
}

extend google.protobuf.MethodOptions {
  FunctionOptions function = 51001;
}
