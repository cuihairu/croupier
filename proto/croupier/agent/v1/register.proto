syntax = "proto3";

package croupier.agent.v1;
option java_package = "io.github.cuihairu.croupier.agent.v1";
option java_multiple_files = true;

option go_package = "github.com/cuihairu/croupier/pkg/pb/croupier/agent/v1;agentv1";

// Function Descriptor - server-side executable capability contract.
// It intentionally carries no Dashboard UI, menu, route, label, Formily,
// placement, or PageSpec metadata.
message FunctionDescriptor {
  string id = 1;        // function id, e.g. "player.ban"
  string version = 2;   // semver, e.g. "1.2.0"
  string resource = 3;  // business resource/capability key, e.g. "player"
  string operation = 4; // business action key, e.g. "ban", "send", "list"
  string risk = 5;      // "safe"|"warning"|"high"|"danger"
  string permission = 6; // optional permission identifier
  bool enabled = 7;     // whether this function is currently enabled
  string capability = 8; // collection_query|item_query|create|update|delete|action|task|report
  string execution = 9;  // sync|task

  // Approval policy (independent of execution mode)
  bool approval_required = 10;     // whether approval is required
  string approval_policy_key = 11; // optional policy key (e.g., "two_person")

  // OpenAPI 3.0.3 Operation Object fields for catalog/search.
  string summary = 25;
  string description = 26;
  repeated string tags = 27;
  bool deprecated = 28;

  // OpenAPI 3.0.3 Schema fields (JSON Schema format)
  string input_schema = 30;               // JSON Schema for request body
  string output_schema = 31;              // JSON Schema for response body
}

// Process/service instance registered to an agent (e.g. a game server process)
message AgentProcess {
  string service_id = 1;          // unique id from SDK
  string addr = 2;                // reachable address (agent-local)
  string version = 3;             // process/service version
  int64 last_seen_unix = 4;       // unix seconds
  repeated string function_ids = 5; // functions exposed by this process
  string sdk_language = 6;        // SDK language: go/java/python/cpp/csharp/node/custom
  string sdk_version = 7;         // SDK version
  string sdk_name = 8;            // SDK display name, e.g. "croupier-js-sdk"; user-overridable
  string game_id = 9;             // game scope the provider belongs to
  string env = 10;                // logical environment (prod/stage/dev)
}

// Agent Registration Request
message RegisterRequest {
  string agent_id = 1;              // agent unique id
  string version = 2;               // agent version
  repeated FunctionDescriptor functions = 3; // summarized function list
  reserved 4;
  reserved "rpc_addr";
  string game_id = 5;               // game scope (required for multi-game routing)
  string env = 6;                   // logical environment scope (optional: prod/stage/test)
  repeated AgentProcess processes = 7; // registered processes (sdk->agent)
  uint32 ttl_seconds = 8;           // session TTL (default 300s = 5min)

  // Location and labels
  string region = 10;               // region/zone info (e.g. "us-west-1")
  string zone = 11;                 // availability zone (e.g. "us-west-1a")
  map<string, string> labels = 12;  // system metadata labels (os, arch, hostname, etc.)
}

// Agent Registration Response
message RegisterResponse {
  string session_id = 1;
  int64 expire_at = 2; // epoch seconds
  repeated string warnings = 3;
  // 处理本次注册的集群实例 ID（单实例部署为空）——agent 侧三方对账用：
  // agent 自报"我连着的实例"，与归属表 claim、LB 会话对照定位半开/漂移
  //（docs/operations/load-balancing.md「三方对账」）。
  string instance_id = 4;
}

// Agent Heartbeat Request
message HeartbeatRequest {
  string agent_id = 1;
  string session_id = 2;
  // agent 自报：最近一次注册响应中的实例 ID（三方对账，agent 视角）。
  string owner_instance_id = 3;
}

// Agent Heartbeat Response
message HeartbeatResponse {}

// Provider capabilities (manifest) — language-agnostic declaration
message ProviderMeta {
  string id = 1;
  string version = 2;
  string lang = 3;
  string sdk = 4;
}

// Register Capabilities Request
message RegisterCapabilitiesRequest {
  ProviderMeta provider = 1;
  bytes manifest_json_gz = 2; // gzipped manifest.json
}

// Register Capabilities Response
message RegisterCapabilitiesResponse {}
