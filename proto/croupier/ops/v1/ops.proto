syntax = "proto3";

package croupier.ops.v1;

option go_package = "github.com/cuihairu/croupier/pkg/pb/ops/v1;opsv1";
option java_package = "io.github.cuihairu.croupier.ops.v1";
option java_multiple_files = true;
option csharp_namespace = "Croupier.Ops.V1";

import "google/protobuf/timestamp.proto";

// Ops message types for Agent → Server operations communication.

// MetricsReport contains system metrics from an agent.
message MetricsReport {
  string agent_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  
  // CPU metrics
  CpuMetrics cpu = 3;
  
  // Memory metrics
  MemoryMetrics memory = 4;
  
  // Disk metrics
  repeated DiskMetrics disks = 5;
  
  // Network metrics
  repeated NetworkMetrics networks = 6;
  
  // Process metrics
  repeated ProcessMetrics processes = 7;
  
  // Custom metrics (key-value pairs)
  map<string, double> custom = 8;

  // Snapshots of supervisor-managed processes (resource usage and state)
  repeated SupervisedProcessSnapshot supervised_processes = 9;

  // Supervisor events that occurred since the previous report (incremental)
  repeated SupervisorEvent supervisor_events = 10;

  // Probe stats folded in since the previous report (probe sampler, same
  // shape as supervisor sampler folding; review §13.1). Aggregated per
  // target per reporting window: success samples count only, failure
  // details ride the AlertEvent channel.
  repeated ProbeStats probe_stats = 11;
}

message CpuMetrics {
  double usage_percent = 1;      // Overall CPU usage percentage (0-100)
  int32 cores = 2;               // Number of CPU cores
  repeated double per_core = 3;  // Per-core usage percentage
  double load_1m = 4;            // 1-minute load average
  double load_5m = 5;            // 5-minute load average
  double load_15m = 6;           // 15-minute load average
}

message MemoryMetrics {
  uint64 total_bytes = 1;        // Total memory in bytes
  uint64 used_bytes = 2;         // Used memory in bytes
  uint64 available_bytes = 3;    // Available memory in bytes
  double usage_percent = 4;      // Memory usage percentage
  uint64 swap_total = 5;         // Swap total in bytes
  uint64 swap_used = 6;          // Swap used in bytes
}

message DiskMetrics {
  string mount_point = 1;        // Mount point path
  string device = 2;             // Device name
  string fs_type = 3;            // Filesystem type
  uint64 total_bytes = 4;        // Total disk space
  uint64 used_bytes = 5;         // Used disk space
  uint64 available_bytes = 6;    // Available disk space
  double usage_percent = 7;      // Disk usage percentage
  uint64 inode_total = 8;        // Total inodes
  uint64 inode_used = 9;         // Used inodes
}

message NetworkMetrics {
  string interface = 1;          // Network interface name
  uint64 bytes_sent = 2;         // Total bytes sent
  uint64 bytes_recv = 3;         // Total bytes received
  uint64 packets_sent = 4;       // Total packets sent
  uint64 packets_recv = 5;       // Total packets received
  uint64 errors_in = 6;          // Input errors
  uint64 errors_out = 7;         // Output errors
}

message ProcessMetrics {
  int32 pid = 1;                 // Process ID
  string name = 2;               // Process name
  string status = 3;             // Process status
  double cpu_percent = 4;        // CPU usage percentage
  uint64 memory_bytes = 5;       // Memory usage in bytes
  int32 threads = 6;             // Number of threads
  google.protobuf.Timestamp start_time = 7;  // Process start time
}

// SystemInfo contains detailed system information.
message SystemInfo {
  string hostname = 1;
  string os = 2;                 // Operating system (linux, windows, darwin)
  string os_version = 3;         // OS version
  string kernel_version = 4;     // Kernel version
  string arch = 5;               // Architecture (amd64, arm64, etc.)
  int32 cpu_cores = 6;           // Number of CPU cores
  uint64 total_memory = 7;       // Total memory in bytes
  google.protobuf.Timestamp boot_time = 8;  // System boot time
  string agent_version = 9;      // Croupier agent version
  
  // Ops module status
  OpsStatus ops_status = 10;
}

message OpsStatus {
  bool enabled = 1;              // Whether ops module is enabled
  bool allow_restart = 2;        // Whether restart operations are allowed
  bool allow_exec = 3;           // Whether command execution is allowed
  repeated string managed_processes = 4;  // List of managed process names
}

// RestartProcessRequest requests a process restart.
message RestartProcessRequest {
  string process_name = 1;       // Name of the process to restart
  bool force = 2;                // Force restart (kill if not responding)
  int32 timeout_seconds = 3;     // Timeout for graceful shutdown (default: 30)
}

message RestartProcessResponse {
  bool success = 1;
  string message = 2;
  int32 new_pid = 3;             // New process ID after restart
}

// StopProcessRequest requests a process stop.
message StopProcessRequest {
  string process_name = 1;       // Name of the process to stop
  bool force = 2;                // Force stop (SIGKILL instead of SIGTERM)
  int32 timeout_seconds = 3;     // Timeout for graceful shutdown
}

message StopProcessResponse {
  bool success = 1;
  string message = 2;
}

// StartProcessRequest requests a process start.
message StartProcessRequest {
  string process_name = 1;       // Name of the process to start
}

message StartProcessResponse {
  bool success = 1;
  string message = 2;
  int32 pid = 3;                 // Process ID
}

// ListProcessesResponse contains the list of managed processes.
message ListProcessesResponse {
  repeated ManagedProcess processes = 1;
}

message ManagedProcess {
  string name = 1;               // Process name (as configured)
  string command = 2;            // Command to start the process
  string working_dir = 3;        // Working directory
  ProcessState state = 4;        // Current state
  int32 pid = 5;                 // Current PID (0 if not running)
  int32 restart_count = 6;       // Number of restarts
  google.protobuf.Timestamp last_start = 7;  // Last start time
  int64 uptime_seconds = 8;      // Seconds since last start (0 when not running)
  repeated string flags = 9;     // Anomaly markers (mem_over_limit / cpu_over_limit)
  int64 next_restart_at_unix = 10; // Unix seconds of the scheduled auto-restart (0 if none)
}

// SupervisorEvent records one supervisor lifecycle event (exit, restart, breaker
// trip, resource over-limit, manual start/stop) for the process event log.
message SupervisorEvent {
  int64 ts_unix = 1;             // Event time (Unix seconds)
  string process = 2;            // Managed process name
  string event = 3;              // Closed set: detect_down/auto_restart/restart_failed/breaker_tripped/resource_over_limit/manual_start/manual_stop/snapshot_hint
  int32 old_pid = 4;             // PID before the event (0 if none)
  int32 new_pid = 5;             // PID after the event (0 if none)
  int32 exit_code = 6;           // Exit code of the process that died
  string signal = 7;             // Signal name if killed by signal ("" otherwise)
  int32 restart_count = 8;       // Restart count at event time
  string message = 9;            // Human-readable detail (required for breaker_tripped)
  // Context captured at event time (best-effort diagnostics).
  int64 last_heartbeat_unix = 10;
  string last_error = 11;
  bool oom_suspect = 12;         // Heuristic: killed by SIGKILL-like signal with high RSS
  int64 last_rss_bytes = 13;
  int64 seq = 14;                // Agent-assigned monotonic sequence (report dedupe / incremental pull)
  // Crash snapshot context (S3, best-effort): artifacts found on disk after a
  // detect_down. snapshot_hint events carry the host-level core_pattern
  // suggestion in message instead.
  string snapshot_dir = 15;      // Directory scanned for artifacts ("" when snapshot profile disabled)
  repeated string snapshot_files = 16; // Artifact file names found after the crash
}

// GetSupervisorLogRequest pulls the supervisor event log file content from an agent.
message GetSupervisorLogRequest {
  int32 max_bytes = 1;           // Size cap for the returned content (tail bytes kept)
}

// GetSupervisorLogResponse carries the (possibly truncated) log file content.
message GetSupervisorLogResponse {
  bytes content = 1;             // Log content (JSON lines), tail side kept when truncated
  string file_name = 2;          // Source file name (for Content-Disposition)
  bool truncated = 3;            // True when content was cut by max_bytes
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_RUNNING = 1;
  PROCESS_STATE_STOPPED = 2;
  PROCESS_STATE_FAILED = 3;
  PROCESS_STATE_STARTING = 4;
  PROCESS_STATE_STOPPING = 5;
  PROCESS_STATE_BACKOFF = 6;     // Exited, waiting in restart backoff
  PROCESS_STATE_BROKEN = 7;      // Restart breaker tripped, manual intervention required
}

// SupervisedProcessSnapshot is a per-sample view of one supervisor-managed
// process, carried in MetricsReport so the server can display live state
// without a dedicated polling RPC.
message SupervisedProcessSnapshot {
  string name = 1;               // Managed process name (as configured)
  int32 pid = 2;                 // Current PID (0 if not running)
  ProcessState state = 3;        // Current state
  int64 uptime_seconds = 4;      // Seconds since last start
  int32 restart_count = 5;       // Number of restarts since agent start
  int64 rss_bytes = 6;           // Resident set size in bytes (0 when not running)
  double cpu_percent = 7;        // CPU usage percent over the sampling interval
  repeated string flags = 8;     // Anomaly markers (mem_over_limit / cpu_over_limit / breaker_tripped)
  int64 last_event_unix = 9;     // Unix seconds of the last supervisor event (0 if none)
  int64 next_restart_at_unix = 10; // Unix seconds of the scheduled auto-restart (BACKOFF only)
  string snapshot_profile = 11;  // Crash snapshot profile in effect (none/go/node/python/jvm; "" when unknown)
}

// ExecuteCommandRequest requests command execution.
// WARNING: This is a high-risk operation.
message ExecuteCommandRequest {
  string command = 1;            // Command to execute
  repeated string args = 2;      // Command arguments
  string working_dir = 3;        // Working directory (optional)
  map<string, string> env = 4;   // Environment variables (optional)
  int32 timeout_seconds = 5;     // Execution timeout (default: 60, max: 300)
}

message ExecuteCommandResponse {
  bool success = 1;
  int32 exit_code = 2;
  string std_out = 3;            // Renamed from 'stdout' to avoid Windows CRT macro conflict
  string std_err = 4;            // Renamed from 'stderr' to avoid Windows CRT macro conflict
  string error = 5;              // Error message if execution failed
}

// ========== System Services ==========

// ListServicesRequest requests a list of system services.
message ListServicesRequest {
  string state = 1;              // Filter by state: "running", "stopped", "paused" (optional)
  string name_pattern = 2;       // Filter by service name pattern (optional)
  int32 limit = 3;               // Maximum number of results (default: 100)
}

// ListServicesResponse contains the list of system services.
message ListServicesResponse {
  repeated ServiceInfo services = 1;
  int32 total = 2;
}

// ServiceInfo contains information about a system service.
message ServiceInfo {
  string name = 1;               // Service name
  string display_name = 2;       // Display name
  string status = 3;             // Status: "running", "stopped", "paused"
  string start_type = 4;         // Start type: "auto", "manual", "disabled"
  uint32 process_id = 5;         // Process ID (0 if not running)
}

// GetServiceStatusRequest requests detailed status of a specific service.
message GetServiceStatusRequest {
  string name = 1;               // Service name
}

// GetServiceStatusResponse contains detailed service status.
message GetServiceStatusResponse {
  string name = 1;               // Service name
  string display_name = 2;       // Display name
  string status = 3;             // Status
  string start_type = 4;         // Start type
  uint32 process_id = 5;         // Process ID (0 if not running)
  string binary_path = 6;        // Path to service binary
  string description = 7;        // Service description
}

// ========== Cron Jobs (Linux) ==========

// ListCronJobsResponse contains the list of cron jobs.
message ListCronJobsResponse {
  repeated CronJob jobs = 1;
  int32 total = 2;
}

// CronJob represents a cron job entry.
message CronJob {
  string schedule = 1;           // Cron expression or @keyword
  string command = 2;            // Command to execute
  string user = 3;               // User who runs the job
  string source_file = 4;        // File where this job is defined
  bool enabled = 5;              // Whether the job is active
}

// ========== Capture rule-hit alerts (anti-cheat CDC gates) ==========

// CaptureRuleHitReport carries one capture-agent gate hit on the CDC change
// stream (reconcile / CEP / lineage rules) to the server alert store.
// Server maps it into the alerts table idempotently (dedup by hit identity).
message CaptureRuleHitReport {
  string agent_id = 1;        // Reporting capture-agent id
  string game_id = 2;         // Game scope label
  string env = 3;             // Environment scope label
  string rule = 4;            // Rule id (reconcile.missing_ledger | cep.burst_delta | cep.off_hours | cep.probing | lineage.whitelist_violation)
  string severity = 5;        // warn | critical (gate closed set)
  string table = 6;           // "db.table" the hit fired on
  string key = 7;             // Join/row key (may be empty: missing-key sentinel)
  string detail = 8;          // Human-readable hit detail
  string gtid = 9;            // Source change event GTID (idempotency material)
  string event_op = 10;       // insert | update | delete
  int64 event_ts_unix_ms = 11; // Source change event timestamp (ms)
}

// CaptureRuleHitAck acknowledges one uploaded hit.
message CaptureRuleHitAck {
  bool accepted = 1;   // Upserted into the alerts store
  bool duplicate = 2;  // alert_id already existed (idempotent replay)
}

// CaptureGatesConfigRequest pulls the game-scoped capture gate rules the
// server holds for the calling agent (scope resolved from the registered
// session; agent-side pull via core/configsync).
message CaptureGatesConfigRequest {
  string agent_id = 1; // Calling capture-agent id (must match the session)
}

// CaptureGatesConfigResponse carries the latest published rules payload.
// Empty version = nothing published for this scope (agent keeps file rules).
// gates_json is opaque to the server: the agent validates the full shape
// before hot-applying (agent is the validator of last resort).
message CaptureGatesConfigResponse {
  string version = 1;    // config_versions.Version (as string); "" = none
  string gates_json = 2; // capture.gates JSON block (reconcile/cep/lineage)
}

// ProbePolicyConfigRequest pulls the game/env-scoped probe sampling policy
// the server holds for the calling agent (scope resolved from the registered
// session; agent-side pull via core/configsync, review §13.3 C).
message ProbePolicyConfigRequest {
  string agent_id = 1; // Calling agent id (must match the session)
}

// ProbePolicyConfigResponse carries the latest published policy payload.
// Empty version = nothing published for this scope (agent keeps local
// intervals). policy_json is validated by both sides (admin publish
// pre-check and agent apply share core/healthprobe.ParseProbePolicy).
message ProbePolicyConfigResponse {
  string version = 1;     // config_versions.Version (as string); "" = none
  string policy_json = 2; // probe.policy JSON block (interval/targets/windows/events)
}

// ProbeDBTargetsConfigRequest pulls the db probe targets the server derives
// for the calling agent (R4: periodic db probes run on the owning agent,
// derived at pull time from db_sources.owner_agent_id; no config_versions
// row and no push channel — the pull response IS the source of truth).
message ProbeDBTargetsConfigRequest {
  string agent_id = 1; // Calling agent id (must match the session)
}

// ProbeDBTargetsConfigResponse carries the derived db probe targets.
//   - version: content hash of targets_json (stable across unchanged sets,
//     so the agent-side configsync puller skips no-op rounds). Never empty
//     on success — the empty target set has its own hash.
//   - targets_json: JSON array of core/healthprobe.TargetConfig (db type:
//     name/dsn/driver/timeout). Empty version + empty payload = server side
//     not derivable (degrade: agent keeps current targets).
message ProbeDBTargetsConfigResponse {
  string version = 1;
  string targets_json = 2;
}

// ========== Probe uplink (agent probes → server; review §11/§13) ==========

// AlertEvent is the one-way probe/alert event stream upload (new wire
// message MsgAlertEvent, review §11 decision 2: alert traffic needs its own
// QoS lane, not the metrics batch slot). v1 carries two probe kinds;
// future alert families evolve on the same channel.
//   - kind = probe.window: window open/close (Window below)
//   - kind = probe.detail: per-failure detail (Detail below, immediate,
//     not waiting for the batch window — asymmetric uplink §13.1)
message AlertEvent {
  string kind = 1;     // machine identifier: probe.window | probe.detail
  string agent_id = 2; // sender id (server validates non-empty; review R2 log sink)
  string game_id = 3;  // Game scope label
  string env = 4;      // Environment scope label
  ProbeWindow window = 5; // set when kind = probe.window
  ProbeDetail detail = 6; // set when kind = probe.detail
}

// ProbeWindow mirrors one probe window open/close (unavailable → recovered).
message ProbeWindow {
  string target = 1;
  string semantics = 2;      // liveness | readiness | heartbeat
  string window_kind = 3;    // unavailable | recovered
  int64 start_ts_unix_ms = 4;
  int64 end_ts_unix_ms = 5;  // 0 = still open
  int64 duration_ms = 6;     // 0 until recovered
  string last_reason = 7;    // failure reason at threshold (truncated 2KB)
}

// ProbeDetail mirrors one failed probe result (asymmetric uplink: failures
// report full detail, never a bare bool — review §13.1).
message ProbeDetail {
  string target = 1;
  string semantics = 2;
  bool ok = 3;                     // always false for detail events
  string err = 4;                  // error text (truncated 2KB by sender)
  int64 at_ts_unix_ms = 5;
  int64 latency_ms = 6;
  int32 consecutive_failures = 7;
  bool window_open = 8;
  map<string, string> details = 9; // probeType/phase/assertion etc (Detailing)
}

// ProbeStats aggregates probe results per target per reporting window
// (normal state = counts only; failure facts are never trimmed — only the
// detail stream is capped, counted here as dropped_details; review §13.1).
message ProbeStats {
  string target = 1;
  string semantics = 2;
  string game_id = 3;
  string env = 4;
  int64 checked = 5;                  // checks in this reporting window
  int64 failed = 6;                   // failures in this window (as-is)
  double success_rate = 7;            // 1 - failed/checked; 1 when checked=0
  repeated int64 latency_buckets = 8; // counts per bucket, boundaries [50ms,200ms,1s,5s], len 5
  bool window_open = 9;               // fault window open at drain time
  int64 window_duration_ms = 10;      // open fault window elapsed (0 when closed)
  string last_reason = 11;            // last failure reason
  int64 dropped_details = 12;         // details trimmed by the per-window cap
}
