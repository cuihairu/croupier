version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/cuihairu/croupier/pkg/pb
plugins:
  # Go plugins for new SDK structure - using local protoc-gen-go (from PATH)
  - name: go
    out: pkg/pb
    opt:
      - paths=source_relative
  - name: go-grpc
    out: pkg/pb
    opt:
      - paths=source_relative

  # Local custom plugin: protoc-gen-croupier (must be on PATH)
  - name: croupier
    path: bin/protoc-gen-croupier
    strategy: all
    out: gen/croupier
    opt:
      - emit_pack=true

  # Generate C++ code for SDK using local protoc
  - name: cpp
    out: sdks/cpp/generated
    strategy: all

  # Generate C++ gRPC code using grpc_cpp_plugin
  - name: grpc-cpp
    path: grpc_cpp_plugin
    out: sdks/cpp/generated
    strategy: all

  # Generate Java code for SDK - keep remote plugin (no local java plugin)
  - plugin: buf.build/protocolbuffers/java
    out: sdks/java/generated

  # Java gRPC plugin - keep remote plugin (no local java plugin)
  - plugin: buf.build/grpc/java
    out: sdks/java/generated

  # Generate Go code for SDK - using local protoc-gen-go (from PATH)
  - name: go
    out: sdks/go/generated
    opt:
      - paths=source_relative
  - name: go-grpc
    out: sdks/go/generated
    opt:
      - paths=source_relative

  # Generate Python code for SDK - using local protoc
  - name: python
    out: sdks/python/generated
  # Generate Python gRPC code using grpc_python_plugin
  - name: grpc-python
    path: grpc_python_plugin
    out: sdks/python/generated

  # Generate JavaScript/TypeScript code for SDK - keep remote plugin (specialized)
  - plugin: buf.build/bufbuild/es
    out: sdks/js/generated
    opt:
      - target=ts  # 生成 TypeScript
  - plugin: buf.build/connectrpc/es
    out: sdks/js/generated
    opt:
      - target=ts  # 生成 Connect RPC TypeScript