//
// Copied from grpc/grpc (health/v1/health.proto) because grpc-go's health
// checking package is what go-plugin's host pings at startup and grpc-js
// ships no health service. Keep this file byte-identical to the upstream
// definition: scripts/verify-proto-drift.js asserts that.

syntax = "proto3";

package grpc.health.v1;

option go_package = "google.golang.org/grpc/health/grpc_health_v1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }

  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
