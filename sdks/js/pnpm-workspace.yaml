allowBuilds:
  esbuild: true
  protobufjs: true

onlyBuiltDependencies:
  - esbuild

overrides:
  # 2026-10-10 抬至 4.7.10（Dependabot #429/#430/#431 critical/medium，patched 4.7.10）
  handlebars: ^4.7.10
  # 2026-09-30 安全补丁：brace-expansion ReDoS/DoS 链（2.x 线修复 2.1.7）
  brace-expansion: ^2.1.7
  flatted: ^3.4.2
  picomatch: ^2.3.2
  "@babel/core": ^7.29.6
  js-yaml: ">=4.3.2 <5.0.0"
  # 2026-09-04 安全补丁：fast-uri SSRF/host confusion；2026-09-30 补 3.x 线
  # inconsistent host 解析修复（patched 3.1.8）；2026-11-07 抬至 3.1.9
  # （Dependabot #471-#474 四条，GHSA-333x/-w74x/-xhq7/-wjr9，patched 3.1.9）
  fast-uri: ">=3.1.9 <4.0.0"
  # 2026-11-07 抬（Dependabot #496，GHSA-g3hv-75wg-m249 globparts amplification，
  # patched 11.0.1；3.1.5 实例在受影响范围 >=7.0.0 之外，不钳）
  minimatch@>=7.0.0 <11.0.1: ">=11.0.1"
  # 2026-09-30 安全补丁：semver 6.x ReDoS（patched 6.3.1）。裸键 `semver:` 会把
  # make-dir@4（jest 链）所需的 semver ^7 也钳进 6.x——`semver/functions/gte`
  # 是 v7 专有子路径，require 直接 Cannot find module（2388c30 引入、CI-JS-SDK
  # 9-30 起爆）。版本线限定：仅 6.x 线消费者抬 6.3.1，7.x 消费者自然解析。
  semver@<7.0.0: ">=6.3.1 <7.0.0"
  # 保留不修复（2026-11-07 评估，Dependabot #482，GHSA-gcqx-w48m-w2h4 deepmerge
  # prototype poisoning）：上游无补丁版本（npm latest 4.3.1 即 last_affected，
  # 5.x 未发布），无可钳目标，等待上游修复；完整处置见 web/pnpm-workspace.yaml 同日备注
