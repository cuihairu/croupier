version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/cuihairu/croupier/sdks/go/pkg/pb
plugins:
  # Go plugins (使用固定版本 v1.36.11 对应 protobuf 4.25.x)
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: sdks/go/pkg/pb
    opt:
      - paths=source_relative
