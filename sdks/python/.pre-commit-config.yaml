repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --ignore=E203,W503]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-protobuf
        exclude: ^(generated/|croupier/pb/)

  # Local hook to run pytest
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-cov
        name: pytest-cov
        entry: uv run pytest -q --cov=croupier --cov-fail-under=70
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
