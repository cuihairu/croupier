[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "croupier-sdk"
version = "0.1.1"
description = "Croupier Python SDK for Game Function Registration and File Transfer"
authors = [
    {name = "cuihairu", email = "chuihairu@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# ============================================================================
# Version Locking
# buf.build/protocolbuffers/python:v25.1 generates code using protobuf 5.29.5
# Runtime uses protobuf 6.33.5 (backward compatible with 5.29.5 gencode)
# ============================================================================
dependencies = [
    "protobuf==6.33.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "types-protobuf>=5.0.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "structlog>=23.0.0",
]
web = [
    "uvicorn>=0.23.0",
    "gunicorn>=21.0.0",
    "fastapi>=0.100.0",
]

[project.urls]
Homepage = "https://github.com/cuihairu/croupier-sdk-python"
Repository = "https://github.com/cuihairu/croupier-sdk-python"
Documentation = "https://docs.croupier.io/sdk/python"
"Bug Tracker" = "https://github.com/cuihairu/croupier-sdk-python/issues"

[project.scripts]
croupier-client = "croupier.cli:main"

[tool.setuptools]
[tool.setuptools.packages.find]
include = ["croupier*"]

[tool.setuptools.package-data]
"croupier" = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "types-protobuf>=5.0.0",
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
skip-string-normalization = true
extend-exclude = '''
^/__pycache__/|
^/.pytest_cache/|
^/tests/test_data_validation\.py|
^/tests/test_concurrency\.py|
^/tests/test_performance\.py|
^/tests/test_security\.py|
^/tests/test_invoker\.py
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = [
    "generated/",
]

[tool.coverage.run]
omit = [
    "generated/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.flake8]
ignore = ["F841", "W391"]
max-line-length = 100
extend-exclude = [
    "generated/",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require running agent)"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Note: Don't use addopts to exclude integration tests, as it conflicts with -m integration in CI
# To skip integration tests locally, run: pytest -m "not integration"
