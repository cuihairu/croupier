openapi: 3.0.3
info:
  title: Alertmanager Functions Pack
  description: Prometheus Alertmanager functions for Croupier
  version: 1.0.0
  x-category: alert
paths:
  /alertmanager/list_alerts:
    post:
      operationId: alertmanager.list_alerts
      summary: List Alerts
      description: List all active alerts from Alertmanager
      x-category: alert
      x-risk: low
      x-entity: alert
      x-operation: read
      tags:
        - alertmanager
        - monitoring
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: string
                  description: Filter alerts by label (e.g., "alertname=MyAlert")
                receiver:
                  type: string
                  description: Filter by receiver
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                        state:
                          type: string
                          enum: [active, suppressed, unprocessed]
                        startsAt:
                          type: string
                          format: date-time
components: {}
