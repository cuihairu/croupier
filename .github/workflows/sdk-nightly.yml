name: SDK Nightly Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

concurrency:
  group: sdk-nightly-${{ github.ref }}-${{ github.run_number }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: write   # required for creating/uploading releases
  packages: write
  actions: write

env:
  NIGHTLY_TAG: sdk-nightly

jobs:
  cpp:
    name: cpp (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 2  # Limit parallel builds to reduce vcpkg cache conflicts
      matrix:
        include:
          - name: ubuntu-x64
            runs-on: ubuntu-latest
            triplet: x64-linux
            os_label: linux
            arch: x86_64
          - name: macos-x64
            runs-on: macos-13
            triplet: x64-osx
            os_label: macos-x64
            arch: x86_64
          - name: macos-arm64
            runs-on: macos-latest
            triplet: arm64-osx
            os_label: macos-arm64
            arch: arm64
          - name: windows-x64
            runs-on: windows-latest
            triplet: x64-windows-static
            os_label: windows
            arch: x86_64
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.allow_fail == true }}
    steps:
      - uses: actions/checkout@v4

      # Note: C++ proto code is generated using vcpkg's protoc (see "Regenerate C++ proto" step)
      # to ensure version compatibility with vcpkg protobuf runtime.
      # We don't need buf generate for C++ SDK.

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== Initial disk usage ==="
          df -h
          echo ""
          echo "=== Large directories in / ==="
          sudo du -sh /* 2>/dev/null | sort -hr | head -20 || true
          echo ""
          echo "=== Large directories in /usr ==="
          sudo du -sh /usr/* 2>/dev/null | sort -hr | head -10 || true
          echo ""
          echo "=== Cleaning up... ==="
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          # Additional cleanup for more space
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/Java*
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/sbt
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo ""
          echo "=== After cleanup ==="
          df -h
          # Additional aggressive cleanup
          echo "=== Additional aggressive cleanup ==="
          # Remove large unnecessary packages and caches
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean || true
          # Remove pip cache
          rm -rf ~/.cache/pip || true
          # Remove npm cache if exists
          rm -rf ~/.npm || true
          # Clean yarn cache if exists
          rm -rf ~/.cache/yarn || true
          # Remove docker images and containers completely
          sudo docker system prune -a --force --volumes || true
          # Remove Android SDK completely if present
          sudo rm -rf /usr/local/lib/android* || true
          # Remove Haskell/Stack
          sudo rm -rf ~/.stack || true
          # Remove Rust toolchain and cargo
          sudo rm -rf ~/.cargo || true
          # Remove Go cache
          sudo rm -rf ~/go/pkg || true
          # Remove .cache directories
          find ~ -maxdepth 2 -name ".cache" -type d -exec rm -rf {} + 2>/dev/null || true
          # Remove temporary files
          sudo find /tmp -type f -mtime +1 -delete 2>/dev/null || true
          sudo find /var/tmp -type f -mtime +1 -delete 2>/dev/null || true
          echo "=== Final disk usage ==="
          df -h

      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Initial disk usage ==="
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
          Write-Host ""
          Write-Host "=== Cleaning up... ==="
          # Remove unnecessary large directories
          $dirsToRemove = @(
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\dotnet\shared",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            "C:\hostedtoolcache\windows\Python"
          )
          foreach ($dir in $dirsToRemove) {
            if (Test-Path $dir) {
              Write-Host "Removing $dir..."
              Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            }
          }
          # Clean temp directories
          Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Windows\Temp\*" -ErrorAction SilentlyContinue
          # Clean npm/nuget caches
          if (Test-Path "$env:LOCALAPPDATA\npm-cache") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\npm-cache" -ErrorAction SilentlyContinue
          }
          Write-Host ""
          Write-Host "=== After cleanup ==="
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
          # Additional aggressive cleanup for Windows
          Write-Host "=== Additional aggressive cleanup ==="
          # Clean NuGet cache
          if (Test-Path "$env:LOCALAPPDATA\NuGet\Cache") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\NuGet\Cache" -ErrorAction SilentlyContinue
          }
          # Clean package caches
          if (Test-Path "$env:USERPROFILE\.nuget\packages") {
            Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Filter "*.nupkg" | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          # Clean MSBuild cache
          if (Test-Path "$env:LOCALAPPDATA\Microsoft\MSBuild") {
            Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\MSBuild" -Recurse -Filter "*.cache" | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          # Clean CMake cache
          if (Test-Path "$env:LOCALAPPDATA\CMake") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\CMake" -ErrorAction SilentlyContinue
          }
          Write-Host "=== Final disk usage ==="
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Install basic build tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y build-essential cmake ninja-build
          elif command -v brew >/dev/null 2>&1; then
            brew update || true
            brew install cmake ninja || true
          fi

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Verify build tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          echo "Verifying build tools are available..."
          which cmake && cmake --version
          if which ninja >/dev/null 2>&1; then
            which ninja && ninja --version
          elif which ninja-build >/dev/null 2>&1; then
            which ninja-build && ninja-build --version
          else
            echo "ERROR: Neither ninja nor ninja-build found in PATH"
            exit 1
          fi
          which g++ && g++ --version
          which make && make --version

      - name: Install vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          VCPKG_ROOT="$PWD/.vcpkg"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          # Cache vcpkg downloads to speed up subsequent runs
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          # Build only Release binaries for ports to halve build time
          echo "VCPKG_BUILD_TYPE=release" >> "$GITHUB_ENV"

      - name: Create nuget.config (GitHub Packages) [Unix]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # On Unix runners, avoid NuGet provider to prevent mono dependency.
          # Use local 'files' binary cache only; we still cache it via actions/cache.
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_ROOT/archives,readwrite" >> "$GITHUB_ENV"

      - name: Set vcpkg concurrency (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CORES="$( (command -v nproc >/dev/null 2>&1 && nproc) || (command -v sysctl >/dev/null 2>&1 && sysctl -n hw.ncpu) || echo 2 )"
          echo "VCPKG_MAX_CONCURRENCY=$CORES" >> "$GITHUB_ENV"

      - name: Install aria2 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y aria2 || true
          elif command -v brew >/dev/null 2>&1; then
            brew update || true
            brew install aria2 || true
          fi
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: .vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.triplet }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-
      - name: Cache vcpkg archives (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.triplet }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-
      - name: Bootstrap and install ports (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Disk space before vcpkg install ==="
          df -h
          VCPKG_ROOT="$PWD/.vcpkg"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          # Preinstall via manifest to warm cache.
          # In manifest mode, avoid positional package args; set default triplet via env.
          export VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }}
          echo "Starting vcpkg manifest preinstall..."
          (cd sdks/cpp && "$VCPKG_ROOT/vcpkg" install --debug)
          echo "vcpkg manifest preinstall completed successfully"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          # Clean up vcpkg buildtrees to free disk space
          echo "=== Cleaning up vcpkg buildtrees ==="
          rm -rf "$VCPKG_ROOT/buildtrees" || true
          rm -rf "$VCPKG_ROOT/downloads" || true
          rm -rf "$VCPKG_ROOT/packages" || true
          # Also clean any other large vcpkg directories
          rm -rf "$VCPKG_ROOT/buildtrees-*" || true
          # Clean up package build artifacts in vcpkg_installed
          find "$VCPKG_ROOT" -name "debug" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$VCPKG_ROOT" -name "share" -path "*/man" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== Disk space after vcpkg cleanup ==="
          df -h
          echo "=== vcpkg directory size ==="
          du -sh "$VCPKG_ROOT" || true
          du -sh sdks/cpp/vcpkg_installed || true

          # Additional aggressive cleanup to free more space
          echo "=== Additional disk cleanup ==="
          # Remove vcpkg temporary files
          rm -rf "$VCPKG_ROOT/buildtrees" || true
          rm -rf "$VCPKG_ROOT/packages" || true
          rm -rf "$VCPKG_ROOT/downloads" || true
          # Clean up any leftover build files
          rm -rf build 2>/dev/null || true
          rm -rf sdks/cpp/build 2>/dev/null || true
          # Clean up go mod cache if exists
          go clean -modcache 2>/dev/null || true
          # Clean up npm cache if exists
          rm -rf ~/.npm 2>/dev/null || true
          # Clean up pip cache
          rm -rf ~/.cache/pip 2>/dev/null || true
          # Clear temporary directories
          sudo rm -rf /tmp/* 2>/dev/null || true
          sudo rm -rf /var/tmp/* 2>/dev/null || true

          echo "=== Final disk space after all cleanup ==="
          df -h
          # Show available space in MB
          AVAILABLE_SPACE=$(df . | awk 'NR==2 {print int($4/1024)}')
          echo "Available disk space: ${AVAILABLE_SPACE} MB"

      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT="$PWD\.vcpkg"
          $needsClone = $true
          if (Test-Path $env:VCPKG_ROOT -PathType Container) {
            if (Test-Path (Join-Path $env:VCPKG_ROOT "bootstrap-vcpkg.bat")) {
              Write-Host "Reusing existing vcpkg directory at $env:VCPKG_ROOT"
              $needsClone = $false
            } else {
              Write-Host "Existing $env:VCPKG_ROOT missing bootstrap script; removing"
              Remove-Item $env:VCPKG_ROOT -Recurse -Force
            }
          } elseif (Test-Path $env:VCPKG_ROOT) {
            Remove-Item $env:VCPKG_ROOT -Recurse -Force
          }
          if ($needsClone) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }
          # Build only Release binaries for ports to halve build time
          echo "VCPKG_BUILD_TYPE=release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Configure NuGet-based binary caching (GitHub Packages) with files fallback
          $owner = "${{ github.repository_owner }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $nuget = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="github" value="https://nuget.pkg.github.com/$owner/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="$owner" />
                <add key="ClearTextPassword" value="$token" />
              </github>
            </packageSourceCredentials>
          </configuration>
          "@
          # Write NuGet config to the default location so nuget.exe can discover it implicitly
          $nugetDir = Join-Path $env:APPDATA "NuGet"
          New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null
          $nugetPath = Join-Path $nugetDir "NuGet.Config"
          $nuget | Out-File -FilePath $nugetPath -Encoding UTF8
          # Use 'nuget,<url>' provider so vcpkg passes -Source explicitly; credentials resolved from NuGet.Config
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/$owner/index.json,readwrite;files,$env:VCPKG_ROOT\archives,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Remove any workspace-level nuget.config to avoid older runs influencing nuget.exe
          if (Test-Path \"$env:GITHUB_WORKSPACE\\nuget.config\") { Remove-Item \"$env:GITHUB_WORKSPACE\\nuget.config\" -Force }

      - name: Diagnostics (Windows NuGet/vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host \"VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES\"
          if (Get-Command nuget.exe -ErrorAction SilentlyContinue) {
            nuget sources list -NonInteractive -Verbosity detailed
            Write-Host \"NuGet.Config location:\" (Join-Path $env:APPDATA \"NuGet\\NuGet.Config\")
            if (Test-Path \"$env:GITHUB_WORKSPACE\\nuget.config\") {
              Write-Host \"Warning: found workspace nuget.config; removing to avoid conflicts\"
              Remove-Item \"$env:GITHUB_WORKSPACE\\nuget.config\" -Force
            }
          } else {
            Write-Host \"nuget.exe not found in PATH\"
          }

      - name: Set vcpkg concurrency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cores = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          if (-not $cores) { $cores = 2 }
          echo "VCPKG_MAX_CONCURRENCY=$cores" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install aria2 -y || echo "aria2 install skipped"
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y || echo "ninja install skipped"
      - name: Cache vcpkg downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg\downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.triplet }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-
      - name: Cache vcpkg archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.triplet }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-
      - name: Bootstrap and install ports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT="$PWD\.vcpkg"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          pushd sdks/cpp
          # Preinstall via manifest to warm cache.
          # In manifest mode, avoid positional package args; set default triplet via env.
          $env:VCPKG_DEFAULT_TRIPLET = "${{ matrix.triplet }}"
          & "$env:VCPKG_ROOT\vcpkg.exe" install
          if ($LASTEXITCODE -ne 0) {
            Write-Host "manifest preinstall skipped (non-zero exit code $LASTEXITCODE)"
            $global:LASTEXITCODE = 0
          }
          popd
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV

      - name: Verify vcpkg environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "Verifying vcpkg environment..."
          echo "VCPKG_ROOT: $VCPKG_ROOT"
          test -n "$VCPKG_ROOT" || (echo "VCPKG_ROOT not set" && exit 1)
          test -d "$VCPKG_ROOT" || (echo "VCPKG_ROOT directory not found" && exit 1)
          test -x "$VCPKG_ROOT/vcpkg" || (echo "vcpkg executable not found" && exit 1)
          "$VCPKG_ROOT/vcpkg" version
          test -f sdks/cpp/vcpkg.json || (echo "vcpkg.json not found" && exit 1)
          echo "vcpkg environment verified successfully"

      - name: Regenerate C++ proto with vcpkg protoc (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          # Find vcpkg-installed protoc and grpc_cpp_plugin
          VCPKG_INSTALLED="sdks/cpp/vcpkg_installed/${{ matrix.triplet }}"
          if [ ! -d "$VCPKG_INSTALLED" ]; then
            # Fallback: find in build directory
            VCPKG_INSTALLED="build/vcpkg_installed/${{ matrix.triplet }}"
          fi

          PROTOC="$VCPKG_INSTALLED/tools/protobuf/protoc"
          GRPC_PLUGIN="$VCPKG_INSTALLED/tools/grpc/grpc_cpp_plugin"

          if [ ! -x "$PROTOC" ]; then
            echo "vcpkg protoc not found at $PROTOC, searching..."
            PROTOC=$(find . -name "protoc" -type f -executable 2>/dev/null | grep vcpkg | head -1 || true)
          fi
          if [ ! -x "$GRPC_PLUGIN" ]; then
            echo "vcpkg grpc_cpp_plugin not found at $GRPC_PLUGIN, searching..."
            GRPC_PLUGIN=$(find . -name "grpc_cpp_plugin" -type f -executable 2>/dev/null | grep vcpkg | head -1 || true)
          fi

          if [ -z "$PROTOC" ] || [ ! -x "$PROTOC" ]; then
            echo "ERROR: vcpkg protoc not found - cannot generate C++ proto code"
            echo "Please ensure vcpkg packages are installed correctly"
            exit 1
          fi

          echo "Using vcpkg protoc: $PROTOC"
          "$PROTOC" --version

          # Clear old generated files
          rm -rf sdks/cpp/generated/*

          # Find all proto files
          PROTO_FILES=$(find proto -name "*.proto" -type f)
          PROTO_INCLUDE="-Iproto"

          # Add google protobuf includes from vcpkg
          if [ -d "$VCPKG_INSTALLED/include/google/protobuf" ]; then
            PROTO_INCLUDE="$PROTO_INCLUDE -I$VCPKG_INSTALLED/include"
          fi

          mkdir -p sdks/cpp/generated

          # Generate C++ code
          for proto in $PROTO_FILES; do
            echo "Generating C++ for: $proto"
            "$PROTOC" $PROTO_INCLUDE \
              --cpp_out=sdks/cpp/generated \
              "$proto" || true

            # Generate gRPC code if plugin available
            if [ -n "$GRPC_PLUGIN" ] && [ -x "$GRPC_PLUGIN" ]; then
              "$PROTOC" $PROTO_INCLUDE \
                --grpc_out=sdks/cpp/generated \
                --plugin=protoc-gen-grpc="$GRPC_PLUGIN" \
                "$proto" || true
            fi
          done

          echo "C++ proto regeneration completed"
          ls -la sdks/cpp/generated/ || true

      - name: Regenerate C++ proto with vcpkg protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VCPKG_INSTALLED = "sdks\cpp\vcpkg_installed\${{ matrix.triplet }}"
          if (-not (Test-Path $VCPKG_INSTALLED)) {
            $VCPKG_INSTALLED = "build\vcpkg_installed\${{ matrix.triplet }}"
          }

          $PROTOC = Join-Path (Get-Location) $VCPKG_INSTALLED "tools\protobuf\protoc.exe"
          $GRPC_PLUGIN = Join-Path (Get-Location) $VCPKG_INSTALLED "tools\grpc\grpc_cpp_plugin.exe"

          if (-not (Test-Path $PROTOC)) {
            Write-Host "ERROR: vcpkg protoc not found at $PROTOC"
            Write-Host "Please ensure vcpkg packages are installed correctly"
            exit 1
          }

          Write-Host "Using vcpkg protoc: $PROTOC"
          & $PROTOC --version

          # Clear old generated files
          Remove-Item -Recurse -Force sdks\cpp\generated\* -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path sdks\cpp\generated | Out-Null

          # Get absolute paths
          $PROTO_DIR = (Resolve-Path "proto").Path
          $VCPKG_INCLUDE = Join-Path (Resolve-Path $VCPKG_INSTALLED).Path "include"
          $OUTPUT_DIR = (Resolve-Path "sdks\cpp\generated").Path

          Write-Host "Proto directory: $PROTO_DIR"
          Write-Host "Vcpkg include: $VCPKG_INCLUDE"
          Write-Host "Output directory: $OUTPUT_DIR"

          # Find all proto files
          $protoFiles = Get-ChildItem -Path proto -Filter "*.proto" -Recurse

          foreach ($proto in $protoFiles) {
            $protoFullPath = $proto.FullName
            Write-Host "Generating C++ for: $protoFullPath"

            # Use full path for proto file with -I pointing to proto directory
            & $PROTOC "-I$PROTO_DIR" "-I$VCPKG_INCLUDE" `
              "--cpp_out=$OUTPUT_DIR" `
              "$protoFullPath"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Warning: cpp generation failed for $protoFullPath (exit code: $LASTEXITCODE)"
            }

            if (Test-Path $GRPC_PLUGIN) {
              & $PROTOC "-I$PROTO_DIR" "-I$VCPKG_INCLUDE" `
                "--grpc_out=$OUTPUT_DIR" `
                "--plugin=protoc-gen-grpc=$GRPC_PLUGIN" `
                "$protoFullPath"

              if ($LASTEXITCODE -ne 0) {
                Write-Host "Warning: grpc generation failed for $protoFullPath (exit code: $LASTEXITCODE)"
              }
            }
          }

          # Verify generated files
          $generatedFiles = Get-ChildItem sdks\cpp\generated -Recurse -Filter "*.pb.*" -ErrorAction SilentlyContinue
          if ($generatedFiles.Count -eq 0) {
            Write-Host "ERROR: No proto files were generated"
            exit 1
          }

          Write-Host "C++ proto regeneration completed - $($generatedFiles.Count) files generated"
          Get-ChildItem sdks\cpp\generated -Recurse | Select-Object FullName

      - name: Configure (Release, static) - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          echo "Starting CMake configuration..."

          # Explicitly set compiler environment variables for vcpkg
          export CC=$(which gcc || which clang)
          export CXX=$(which g++ || which clang++)

          # Determine ninja command and generator
          if which ninja >/dev/null 2>&1; then
            NINJA_CMD=$(which ninja)
            CMAKE_GENERATOR="Ninja"
          elif which ninja-build >/dev/null 2>&1; then
            NINJA_CMD=$(which ninja-build)
            CMAKE_GENERATOR="Ninja"
          else
            echo "ERROR: Neither ninja nor ninja-build found in PATH"
            exit 1
          fi

          echo "Using ninja command: $NINJA_CMD"
          echo "Using CMake generator: $CMAKE_GENERATOR"

          cmake -S sdks/cpp -B build \
            -G "$CMAKE_GENERATOR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_MAKE_PROGRAM="$NINJA_CMD" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_FEATURE_FLAGS=manifests,binarycaching \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Configure (Release, static) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Starting CMake configuration for Windows..."

          # Use Visual Studio generator with MSVC compiler (required for vcpkg compatibility)
          cmake -S sdks/cpp -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DVCPKG_MANIFEST_MODE=ON `
            "-DVCPKG_FEATURE_FLAGS=manifests,binarycaching" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Cache vcpkg_installed (manifest)
        uses: actions/cache@v4
        with:
          path: sdks/cpp/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('sdks/cpp/vcpkg.json') }}-${{ github.run_number }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Pre-build disk cleanup and check
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Disk usage before build ==="
          df -h
          echo ""
          echo "=== Large directories check ==="
          du -sh * 2>/dev/null | sort -hr | head -10 || true
          echo ""
          # Clean up any leftover build artifacts
          rm -rf build/CMakeFiles/*.o 2>/dev/null || true
          # Clear any temporary files
          rm -rf /tmp/* 2>/dev/null || true
          # Clean up any caches that might have been created
          rm -rf ~/.cache/* 2>/dev/null || true
          echo "=== Final disk usage before build ==="
          df -h

      - name: Build static library
        shell: bash
        run: |
          set -euo pipefail

          # Check disk space before build
          echo "=========================================="
          echo "BEFORE BUILD - Disk Space Check"
          echo "=========================================="
          df -h
          AVAILABLE_KB=$(df . | awk 'NR==2 {print $4}')
          AVAILABLE_MB=$((AVAILABLE_KB / 1024))
          AVAILABLE_GB=$((AVAILABLE_MB / 1024))
          echo "Available disk space: ${AVAILABLE_GB}GB (${AVAILABLE_MB}MB)"

          # Warning thresholds
          if [ "$AVAILABLE_MB" -lt 1024 ]; then
            echo "⚠️  CRITICAL: Less than 1GB available!"
            echo "This build will likely fail due to insufficient disk space."
          elif [ "$AVAILABLE_MB" -lt 5120 ]; then
            echo "⚠️  WARNING: Less than 5GB available!"
            echo "Build may fail, proceeding with minimal resources."
          elif [ "$AVAILABLE_MB" -lt 10240 ]; then
            echo "⚠️  CAUTION: Less than 10GB available"
            echo "Consider freeing up more disk space."
          else
            echo "✓ Sufficient disk space available for build"
          fi
          echo "=========================================="

          # Use max available cores (default to 2 if not detected)
          CORES="${VCPKG_MAX_CONCURRENCY:-}"
          if [ -z "$CORES" ]; then
            CORES="$( (command -v nproc >/dev/null 2>&1 && nproc) || (command -v sysctl >/dev/null 2>&1 && sysctl -n hw.ncpu) || echo 2 )"
          fi

          # Adjust build parameters based on available space
          if [ "$AVAILABLE_MB" -lt 2048 ]; then
            echo "Extremely low disk space, using single core build..."
            CORES=1
            # Use minimal build options
            export CMAKE_BUILD_PARALLEL_LEVEL=1
          elif [ "$AVAILABLE_MB" -lt 5120 ]; then
            echo "Low disk space, limiting parallelism..."
            CORES=1
          elif [ "$AVAILABLE_MB" -lt 10240 ]; then
            echo "Moderate disk space, limiting parallelism to 2 cores..."
            CORES=2
          fi

          echo "Starting build with $CORES cores..."

          # Monitor disk space during build
          echo "Starting build at $(date)"
          cmake --build build --config Release --target croupier-sdk-static -j "$CORES" 2>&1 | while IFS= read -r line; do
            echo "$line"
            # Check disk space every 50 lines of output
            if [[ $((++line_count)) % 50 -eq 0 ]]; then
              CURRENT_KB=$(df . | awk 'NR==2 {print $4}')
              CURRENT_MB=$((CURRENT_KB / 1024))
              echo "[INFO] Current disk space: ${CURRENT_MB}MB (was ${AVAILABLE_MB}MB)"
            fi
          done

          echo "Build completed at $(date)"
          echo "Final disk space check:"
          df -h

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          PKG="croupier-cpp-sdk-${{ matrix.os_label }}-${{ matrix.arch }}-static"
          mkdir -p "out/${PKG}/include" "out/${PKG}/lib"
          mkdir -p "out/${PKG}/cmake"
          cp -R sdks/cpp/include/* "out/${PKG}/include/"
          if [ -d sdks/cpp/generated ]; then
            mkdir -p "out/${PKG}/include/generated"
            cp -R sdks/cpp/generated/* "out/${PKG}/include/generated/"
          fi
          # Find built lib (platform-specific name; handle libcroupier-sdk.a or libcroupier-sdk-static.a)
          libfile="$(find build -type f \( -name 'libcroupier-sdk-static.*' -o -name 'libcroupier-sdk.*' -o -name 'croupier-sdk-static.lib' -o -name 'croupier-sdk.lib' \) | head -n1 || true)"
          if [ -z "${libfile}" ]; then
            echo "Static library not found"
            ls -R build || true
            echo "Debug: listing candidate archives"
            find build -type f \( -name '*.a' -o -name '*.lib' \) -maxdepth 5 -print || true
            exit 1
          fi
          cp "${libfile}" "out/${PKG}/lib/"
          LIBNAME="$(basename "${libfile}")"
          # Generate a minimal CMake package config for find_package(croupier-sdk)
          cat > "out/${PKG}/cmake/croupier-sdk-config.cmake" <<EOF
          # Auto-generated config for croupier-sdk (nightly)
          set(_CROUPIER_SDK_PREFIX "\${CMAKE_CURRENT_LIST_DIR}/..")
          if (NOT TARGET croupier-sdk-static)
            add_library(croupier-sdk-static STATIC IMPORTED)
            set_target_properties(croupier-sdk-static PROPERTIES
              IMPORTED_LOCATION "\${_CROUPIER_SDK_PREFIX}/lib/${LIBNAME}"
              INTERFACE_INCLUDE_DIRECTORIES "\${_CROUPIER_SDK_PREFIX}/include"
            )
          endif()
          if (NOT TARGET croupier::sdk-static)
            add_library(croupier::sdk-static ALIAS croupier-sdk-static)
          endif()
          if (NOT TARGET croupier::sdk)
            add_library(croupier::sdk ALIAS croupier-sdk-static)
          endif()
          EOF
          cp sdks/cpp/README.md "out/${PKG}/" || true
          cp sdks/cpp/LICENSE "out/${PKG}/" 2>/dev/null || true
          # Create tar.gz with verification
          (cd out && tar czf "${PKG}.tar.gz" "${PKG}")
          # Verify tar integrity
          if ! tar -tzf "out/${PKG}.tar.gz" >/dev/null 2>&1; then
            echo "ERROR: Created tar file is corrupted"
            ls -la "out/${PKG}.tar.gz" || true
            exit 1
          fi
          # Get file checksum for verification
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "out/${PKG}.tar.gz" > "out/${PKG}.tar.gz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "out/${PKG}.tar.gz" > "out/${PKG}.tar.gz.sha256"
          fi
          echo "PACKAGE_NAME=${PKG}" >> "$GITHUB_ENV"
          echo "Tar file created and verified successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ matrix.name }}-sdk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            out/${{ env.PACKAGE_NAME }}.tar.gz
            out/${{ env.PACKAGE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # --------------- Java SDK (Jar) ---------------
  java:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build JAR (Gradle)
        working-directory: sdks/java
        run: |
          ./gradlew --no-daemon clean build -x test
      - name: Collect and upload
        run: |
          mkdir -p out
          # Copy the built jar to a stable filename
          set -euo pipefail
          JAR=""
          if ls sdks/java/build/libs/croupier-java-sdk-*.jar >/dev/null 2>&1; then
            JAR=$(ls -1 sdks/java/build/libs/croupier-java-sdk-*.jar | head -n1)
          elif ls sdks/java/build/libs/*.jar >/dev/null 2>&1; then
            JAR=$(ls -1 sdks/java/build/libs/*.jar | head -n1)
          fi
          if [ -z "${JAR}" ]; then
            echo "No jar found under sdks/java/build/libs"
            ls -R sdks/java/build || true
            exit 1
          fi
          cp "${JAR}" "out/croupier-java-sdk.jar"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: java-sdk-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/croupier-java-sdk.jar
          if-no-files-found: error
          retention-days: 7

  # --------------- Python SDK (wheel + sdist) ---------------
  python:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          # Build wheel only to avoid sdist requiring requirements.txt in setup.py
          python -m build --wheel sdks/python
          # Add stable aliases for convenience downloads
          mkdir -p sdks/python/out
          WHL=$(ls sdks/python/dist/*.whl | head -n1 || true)
          if [ -n "${WHL}" ]; then
            cp "${WHL}" sdks/python/out/croupier-python-sdk.whl
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            sdks/python/dist/*.whl
            sdks/python/out/croupier-python-sdk.whl
          if-no-files-found: error
          retention-days: 7

  # --------------- JavaScript SDK (npm package) ---------------
  js:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: sdks/js/pnpm-lock.yaml
      - name: Install dependencies and pack
        working-directory: sdks/js
        run: |
          pnpm install --frozen-lockfile
          pnpm pack
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: js-sdk-${{ github.run_number }}-${{ github.run_attempt }}
          path: sdks/js/*.tgz
          if-no-files-found: error
          retention-days: 7

  # --------------- Go SDK (source tarball) ---------------
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarball Go SDK source
        run: |
          mkdir -p out
          tar czf "out/croupier-go-sdk.tar.gz" -C sdks go
      - uses: actions/upload-artifact@v4
        with:
          name: go-sdk-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/croupier-go-sdk.tar.gz
          if-no-files-found: error
          retention-days: 7

  # --------------- Aggregate release ---------------
  release:
    name: Publish Nightly Release
    needs: [cpp, java, python, js, go]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cuihairu'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify downloaded artifacts
        run: |
          set -euo pipefail
          echo "Verifying artifact integrity..."
          # Find and verify all tar.gz files with checksums
          find artifacts -name "*.tar.gz.sha256" | while read checksum_file; do
            tar_file="${checksum_file%.sha256}"
            if [ -f "$tar_file" ]; then
              echo "Verifying $tar_file..."
              # Update checksum file to handle nested paths
              sed "s|out/||g" "$checksum_file" > /tmp/checksum.tmp
              if command -v sha256sum >/dev/null 2>&1; then
                (cd "$(dirname "$tar_file")" && sha256sum -c /tmp/checksum.tmp)
              elif command -v shasum >/dev/null 2>&1; then
                (cd "$(dirname "$tar_file")" && shasum -a 256 -c /tmp/checksum.tmp)
              else
                echo "Checksum verification not available, skipping..."
              fi
              # Test tar integrity
              if ! tar -tzf "$tar_file" >/dev/null 2>&1; then
                echo "ERROR: Tar file $tar_file is corrupted"
                exit 1
              fi
              echo "✓ $tar_file verified successfully"
            else
              echo "WARNING: Checksum file found but tar file missing: $tar_file"
            fi
          done
      - name: Verify expected artifacts
        run: |
          set -euo pipefail
          missing=0
          # Check for nested tar.gz files in artifact directories using find
          echo "Checking for C++ SDK artifacts..."

          if find artifacts -name "*.tar.gz" | grep "croupier-cpp-sdk-linux-x86_64-static" | grep -q .; then
            echo "✓ Found Linux x86_64 static SDK"
          else
            echo "::error::Missing Linux x86_64 static SDK"
            missing=1
          fi

          if find artifacts -name "*.tar.gz" | grep "croupier-cpp-sdk-macos-x64-x86_64-static" | grep -q .; then
            echo "✓ Found macOS x64 static SDK"
          else
            echo "::error::Missing macOS x64 static SDK"
            missing=1
          fi

          if find artifacts -name "*.tar.gz" | grep "croupier-cpp-sdk-macos-arm64-arm64-static" | grep -q .; then
            echo "✓ Found macOS ARM64 static SDK"
          else
            echo "::error::Missing macOS ARM64 static SDK"
            missing=1
          fi

          if find artifacts -name "*.tar.gz" | grep "croupier-cpp-sdk-windows-x86_64-static" | grep -q .; then
            echo "✓ Found Windows x86_64 static SDK"
          else
            echo "::error::Missing Windows x86_64 static SDK"
            missing=1
          fi

          # Check for other SDK artifacts
          echo "Checking for other SDK artifacts..."
          if find artifacts -name "croupier-java-sdk.jar" -type f | grep -q .; then
            echo "✓ Found Java SDK"
          else
            echo "::error::Missing Java SDK"
            missing=1
          fi

          if find artifacts -name "croupier-go-sdk.tar.gz" -type f | grep -q .; then
            echo "✓ Found Go SDK"
          else
            echo "::error::Missing Go SDK"
            missing=1
          fi

          if find artifacts -name "croupier-js-sdk-*.tgz" -type f | grep -q .; then
            echo "✓ Found JavaScript SDK"
          else
            echo "::error::Missing JavaScript SDK"
            missing=1
          fi

          if find artifacts -name "*.whl" | grep -q .; then
            echo "✓ Found Python SDK"
          else
            echo "::error::Missing Python SDK"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "One or more artifacts missing; aborting release upload."
            exit 1
          fi
      - name: List artifacts
        run: ls -R artifacts
      - name: Ensure release exists (sdk-nightly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "${NIGHTLY_TAG}" >/dev/null 2>&1; then
            echo "Release ${NIGHTLY_TAG} exists"
          else
            gh release create "${NIGHTLY_TAG}" -t "SDK Nightly" -n "Auto-updated nightly build. Assets are replaced on each run." -p
          fi
      - name: Upload assets (overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found"
            exit 1
          fi
          gh release upload "${NIGHTLY_TAG}" "${files[@]}" --clobber
