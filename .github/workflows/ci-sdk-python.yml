name: CI - Python SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sdks/python/**'
      - '.github/workflows/ci-sdk-python.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/python/**'
      - '.github/workflows/ci-sdk-python.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/python
        run: |
          pip install -e '.[dev]'
      - name: Run ruff
        timeout-minutes: 5
        working-directory: sdks/python
        run: ruff check .
      - name: Run mypy
        timeout-minutes: 5
        working-directory: sdks/python
        run: mypy .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/python
        run: |
          pip install -e '.[dev]'
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/python
        run: pytest --cov=. --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      - name: Install build dependencies
        timeout-minutes: 5
        working-directory: sdks/python
        run: |
          pip install build wheel
      - name: Build package
        timeout-minutes: 10
        working-directory: sdks/python
        run: python -m build
