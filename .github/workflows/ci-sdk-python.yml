name: CI - Python SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdks/python/**"]
  pull_request:
    branches: [main]
    paths: ["sdks/python/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'zoomies-pool' }}
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "sdks/python/requirements*.txt"
      - run: pip install -e '.[dev]'
        working-directory: sdks/python
      - run: pytest --cov=croupier --cov-report=xml --cov-report=term
        working-directory: sdks/python
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/python/coverage.xml
          flags: python-sdk
          disable_search: true
