name: CI - Python SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'sdks/python/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'sdks/python/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      # Regenerate protobuf stubs from the root proto/ so the handwritten layer
      # (which references canonical Task/ProviderConnect names) resolves against
      # current schemas. The committed generated/ tree can lag behind proto/.
      # sdks/python/buf.gen.yaml declares the proto input + sdks/python/generated
      # output; run from the repo root where proto/ lives.
      - uses: bufbuild/buf-setup-action@v1
      - run: buf generate sdks/python/buf.gen.yaml
      - run: pip install -e '.[dev]'
        working-directory: sdks/python
      - run: pytest --cov=. --cov-report=xml --cov-report=term
        working-directory: sdks/python
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/python/coverage.xml
          flags: python-sdk
