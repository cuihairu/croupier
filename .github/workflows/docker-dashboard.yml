name: Docker - Dashboard

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/docker-dashboard.yml"
      - "web/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      - name: Login to GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/croupier-dashboard
      - name: Build and push Docker image
        timeout-minutes: 15
        run: |
          docker builder prune -af
          docker buildx build \
            --push \
            --file ./web/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/croupier-dashboard:latest \
            --tag ghcr.io/${{ github.repository_owner }}/croupier-dashboard:${{ github.sha }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --no-cache \
            --progress=plain \
            ./web
