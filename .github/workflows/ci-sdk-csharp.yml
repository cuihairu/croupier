name: Build and Release C# SDK

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/ci-sdk-csharp.yml"
      - "proto/**"
      - "sdks/csharp/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-sdk-csharp.yml"
      - "proto/**"
      - "sdks/csharp/**"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/csharp

    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        timeout-minutes: 5
        run: dotnet restore

      - name: Start croupier-agent
        timeout-minutes: 10
        run: |
          cd "${{ github.workspace }}"
          docker pull ghcr.io/cuihairu/croupier-agent:latest || docker compose -f docker/docker-compose.ci.yml build
          docker compose -f docker/docker-compose.ci.yml up -d

          for i in {1..60}; do
            if nc -z localhost 19090 2>/dev/null; then
              echo "Agent is ready"
              # Additional wait to ensure agent is fully initialized
              sleep 3
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Agent failed to start"
              docker compose -f docker/docker-compose.ci.yml logs
              exit 1
            fi
            sleep 1
          done

      - name: Build SDK
        timeout-minutes: 15
        run: dotnet build src/Croupier.Sdk/Croupier.Sdk.csproj --configuration Release --no-restore

      - name: Build examples
        timeout-minutes: 15
        run: dotnet build examples/SimpleService/SimpleService.csproj --configuration Release --no-restore

      - name: Run tests (if any)
        timeout-minutes: 10
        run: |
          # Find and run test projects
          if [ -n "$(find . -name '*.Tests.csproj')" ]; then
            dotnet test --configuration Release --verbosity normal
          else
            echo "No test projects found, skipping tests"
          fi

        env:
          CROUPIER_RUN_INTEGRATION_TESTS: 1

      - name: Show agent logs (if test failed)
        if: failure()
        run: cd "${{ github.workspace }}" && docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop agent
        if: always()
        run: cd "${{ github.workspace }}" && docker compose -f docker/docker-compose.ci.yml down -v

      - name: Upload artifacts
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-csharp-sdk
          path: |
            src/Croupier.Sdk/bin/Release/
            examples/SimpleService/bin/Release/

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/csharp
    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install coverlet global tool
        timeout-minutes: 5
        run: dotnet tool install --global coverlet.console

      - name: Restore dependencies
        timeout-minutes: 5
        run: dotnet restore

      - name: Run tests with coverage (if any)
        timeout-minutes: 10
        run: |
          if [ -n "$(find . -name '*.Tests.csproj')" ]; then
            # Run tests with XPlat Code Coverage
            dotnet test --configuration Release \
              --collect:"XPlat Code Coverage" \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

            # Find and copy coverage file to expected location
            COVERAGE_FILE=$(find . -path "*/TestResults/*/coverage.opencover.xml" | head -1)
            if [ -n "$COVERAGE_FILE" ]; then
              mkdir -p coverage
              cp "$COVERAGE_FILE" coverage/coverage.opencover.xml
              echo "Coverage file: $COVERAGE_FILE -> coverage/coverage.opencover.xml"
            else
              echo "Warning: No coverage file found"
              mkdir -p coverage
              echo '<?xml version="1.0"?><coverage></coverage>' > coverage/coverage.xml
            fi
          else
            echo "No test projects found, creating empty coverage report"
            mkdir -p coverage
            echo '<?xml version="1.0"?><coverage></coverage>' > coverage/coverage.xml
          fi

      - name: Upload coverage to Codecov
        if: success()
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            sdks/csharp/coverage/coverage.opencover.xml
            sdks/csharp/coverage/coverage.xml
          flags: csharp-sdk
          fail_ci_if_error: false
