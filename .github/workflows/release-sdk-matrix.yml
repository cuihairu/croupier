name: Release SDK Matrix

# 六注册中心 SDK 矩阵发布（CR-FIX-13）：npm / PyPI / GitHub Packages(Maven) /
# NuGet / Go proxy / vcpkg·预编译源码包，统一由本 reusable workflow 编排。
#
# 唯一正式入口：release.yml 的 sdk-matrix job（tag push v* 触发，且须过
# quality-gate）。正式 Release 的公开（--draft=false）被 release.yml 的
# publish-release job 门禁在矩阵全绿之后——任一车道失败，release 保持或
# 转回 draft 并告警，绝不带伤发布。
#
# 本文件自身不挂 push/tag 触发（避免与 release.yml 平行竞速、抢在门禁
# 之外发布）。手动 workflow_dispatch 仅用于两种受控场景：
# - dry_run：演练（AUD-079）——六车道执行与正式发布一致的构建打包检查，
#   产物留档 workflow artifact；无凭据（车道 publish job 全部被跳过），
#   零外部写（不推 tag、不发 release、纯演练也不回拨 draft 状态）；
# - fail_inject：验收——注入假失败（车道自动强制 dry_run），验证 draft
#   门禁与告警路径。注意：它验收的对象正是「回拨真实 release 到 draft」
#   这一步，因此 enforce-draft 在 fail_inject 下仍会真实执行。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（如 v0.2.0）"
        required: true
        type: string
      dry_run:
        description: "演练模式：六车道只构建不发版"
        required: false
        type: boolean
        default: false
      fail_inject:
        description: "注入假失败（验收 draft 门禁；自动强制 dry_run）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "发布版本（如 v0.2.0）"
        required: true
        type: string
      dry_run:
        description: "演练模式：六车道只构建不发版"
        required: false
        type: boolean
        default: false
      fail_inject:
        description: "注入假失败（验收 draft 门禁；自动强制 dry_run）"
        required: false
        type: boolean
        default: false

jobs:
  # AUD-078：整矩阵只解析一次源提交，六车道共享同一 tag→commit。此前各车道
  # 各自 checkout 触发 ref（或各自解析 tag），触发分支领先 tag 时发布物
  # 会各打各的源码。lane 侧继续调用 release-sdk-resolve.yml 做二次校验：
  # 传入的 sha 与 version 对应 tag 不一致即 fail-closed。
  resolve:
    name: Resolve version & pin source commit
    uses: ./.github/workflows/release-sdk-resolve.yml
    with:
      version: ${{ inputs.version }}
    # 解析只在 version 为空时需要只读 GITHUB_TOKEN（矩阵入口 version 必填，
    # 全程零令牌消费）；不 inherit 仓库 secret。

  js:
    name: npm
    needs: resolve
    uses: ./.github/workflows/release-sdk-js.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  python:
    name: PyPI
    needs: resolve
    uses: ./.github/workflows/release-sdk-python.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  java:
    name: Maven (GitHub Packages)
    needs: resolve
    uses: ./.github/workflows/release-sdk-java.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  csharp:
    name: NuGet
    needs: resolve
    uses: ./.github/workflows/release-sdk-csharp.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  go:
    name: Go proxy (submodule tag)
    needs: resolve
    uses: ./.github/workflows/release-sdk-go.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  cpp:
    name: vcpkg / prebuilt (GitHub Release)
    needs: resolve
    uses: ./.github/workflows/release-sdk-cpp.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.fail_inject || inputs.dry_run }}
    secrets: inherit

  injection-canary:
    name: Failure injection canary
    runs-on: ubuntu-latest
    steps:
      - name: Injected lane failure
        if: ${{ inputs.fail_inject }}
        run: |
          echo "::error::injected lane failure (fail_inject acceptance run)"
          exit 1
      - name: Canary pass
        if: ${{ ! inputs.fail_inject }}
        run: echo "no injection configured; canary green"

  finalize:
    # 门禁判定与告警：零权限、零凭据、零外部写（AUD-079）。写路径（回拨
    # draft + 评论）拆到 enforce-draft，纯演练（dry_run 且非 fail_inject）
    # 下完全不执行。
    name: Draft gate & alert
    needs: [js, python, java, csharp, go, cpp, injection-canary]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      failed: ${{ steps.gate.outputs.failed }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Gate & alert on any failed lane
        id: gate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RES_JS: ${{ needs.js.result }}
          RES_PYTHON: ${{ needs.python.result }}
          RES_JAVA: ${{ needs.java.result }}
          RES_CSHARP: ${{ needs.csharp.result }}
          RES_GO: ${{ needs.go.result }}
          RES_CPP: ${{ needs.cpp.result }}
          RES_CANARY: ${{ needs.injection-canary.result }}
        run: |
          set -euo pipefail
          V="$INPUT_VERSION"
          case "$V" in
            v*) TAG="$V" ;;
            *)  TAG="v$V" ;;
          esac

          result_of() {
            case "$1" in
              js) echo "$RES_JS" ;;
              python) echo "$RES_PYTHON" ;;
              java) echo "$RES_JAVA" ;;
              csharp) echo "$RES_CSHARP" ;;
              go) echo "$RES_GO" ;;
              cpp) echo "$RES_CPP" ;;
              injection-canary) echo "$RES_CANARY" ;;
            esac
          }

          FAILED=""
          for lane in js python java csharp go cpp injection-canary; do
            R=$(result_of "$lane")
            if [ "$R" != "success" ]; then
              FAILED="$FAILED $lane=$R"
            fi
          done

          {
            echo "failed=$FAILED"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$FAILED" ]; then
            echo "All registry lanes green for $TAG; publish gate may proceed."
            exit 0
          fi

          echo "::error::SDK matrix failed lanes:$FAILED — release $TAG stays draft"
          {
            echo "## SDK matrix failed for $TAG"
            echo ""
            echo "Failed lanes:$FAILED"
            echo ""
            echo "Release \`$TAG\` stays draft; do not publish until all lanes are green."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  enforce-draft:
    # 写路径唯一所在 job：把失败矩阵对应的 release 按回 draft 并评论。
    # 携带 contents:write，仅在「非演练」或「fail_inject 验收」且确有失败
    # 时运行——纯 dry_run 演练零外部写（AUD-079）。release 不存在时（本
    # workflow 独立 dispatch 演练，或 release.yml 的 release job 尚未建草稿）
    # 编辑会失败——按告警处理即可，release.yml 的 publish-release 门禁同样
    # 会把它按在 draft 上，两层保护互为冗余。
    name: Revert release to draft
    needs: [finalize]
    # finalize 自身失败（gate step 在写出 outputs 前就挂）也算需要回拨：
    # 此时 failed 输出为空，用 tag 输出兜底。任一情况都必须把 release 按
    # 回 draft——绝不能因为门禁判定 job 自己崩了而放任发布出去。
    if: >-
      ${{ always() && ((! inputs.dry_run) || inputs.fail_inject) && (needs.finalize.result == 'failure' || needs.finalize.result == 'cancelled' || needs.finalize.outputs.failed != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Revert release to draft & comment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.finalize.outputs.tag }}
          FAILED: ${{ needs.finalize.outputs.failed }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::finalize did not produce a tag; cannot enforce draft"
            exit 1
          fi
          if gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG converted back to draft"
            gh release comment "$TAG" --repo "$GITHUB_REPOSITORY" \
              --body "SDK matrix failure detected:${FAILED:-unknown} — this release was reverted to draft." \
              >/dev/null 2>&1 || true
          else
            echo "::warning::release $TAG not found yet; publish-release gate keeps it draft"
          fi
