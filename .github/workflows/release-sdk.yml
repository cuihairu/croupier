name: Release SDK Packages

# 每语言 SDK 发布到官方包仓库（手动执行）：
#   python → PyPI        （secret: PYPI_API_TOKEN）
#   js     → npm         （secret: NPM_TOKEN）
#   go     → Go module   （tag sdks/go/vX.Y.Z，无需 secret）
#   java   → GitHub Packages / Maven Central（secret: MAVEN_CENTRAL_* 或 GITHUB_TOKEN）
#   csharp → NuGet       （secret: NUGET_API_KEY）
#   cpp    → GitHub Release 附源码包（无需 secret）
# 版本：默认取最新 release tag（如 v0.1.1），可用 version 输入覆盖。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag；如 v0.2.0 或 0.2.0）"
        required: false
        default: ""
      publish_python:
        description: "发布 Python → PyPI"
        type: boolean
        default: false
      publish_js:
        description: "发布 JS → npm"
        type: boolean
        default: false
      publish_go:
        description: "发布 Go → module tag"
        type: boolean
        default: false
      publish_java:
        description: "发布 Java → GitHub Packages"
        type: boolean
        default: false
      publish_csharp:
        description: "发布 C# → NuGet"
        type: boolean
        default: false
      publish_cpp:
        description: "发布 C++ → GitHub Release 源码包"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve version (input or latest release)
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          # 归一化：允许 v0.2.0 或 0.2.0 两种写法
          case "$V" in
            v*) TAG="$V"; NUM="${V#v}" ;;
            *)   TAG="v$V"; NUM="$V" ;;
          esac
          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$NUM"
        env:
          GH_TOKEN: ${{ github.token }}

  python-pypi:
    if: ${{ inputs.publish_python }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require PYPI_API_TOKEN
        run: test -n "$PYPI_API_TOKEN" || { echo "::error::缺少 secret PYPI_API_TOKEN（PyPI 发布凭据）"; exit 1; }
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: Set version & build
        run: |
          cd sdks/python
          sed -i "s/^version = .*/version = \"${{ needs.resolve-version.outputs.version }}\"/" pyproject.toml
          pipx run build
      - name: Publish to PyPI
        run: twine upload -u __token__ -p "$PYPI_API_TOKEN" sdks/python/dist/*
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  js-npm:
    if: ${{ inputs.publish_js }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Require NPM_TOKEN
        run: test -n "$NPM_TOKEN" || { echo "::error::缺少 secret NPM_TOKEN（npm 发布凭据）"; exit 1; }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set version, build & publish
        run: |
          cd sdks/js
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version
          npm ci || npm install
          npm run build --if-present
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go-module:
    if: ${{ inputs.publish_go }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Go 模块的“发布”约定：子模块 tag sdks/go/vX.Y.Z（goproxy 按 tag 拉取）
      - name: Tag Go submodule
        run: |
          TAG="sdks/go/${{ needs.resolve-version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在，跳过"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  java-packages:
    if: ${{ inputs.publish_java }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # 版本经 -PoverrideVersion 注入；凭据走 env（build.gradle 读取）
      # 未配置 Maven Central secrets 时仅发 GitHub Packages（GITHUB_TOKEN 即可）；
      # 配置 MAVEN_CENTRAL_USERNAME/PASSWORD + GPG_* 后 -PforceRelease 同步发 Central。
      - name: Publish (GitHub Packages；可选同步 Maven Central)
        run: |
          cd sdks/java
          EXTRA=""
          if [ -n "$MC_USER" ]; then
            EXTRA="-PforceRelease"
            echo "已配置 Maven Central 凭据，同步发布 Central"
          fi
          # shellcheck disable=SC2086
          ./gradlew publish -PoverrideVersion=${{ needs.resolve-version.outputs.version }} $EXTRA
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
          MC_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}

  csharp-nuget:
    if: ${{ inputs.publish_csharp }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Require NUGET_API_KEY
        run: test -n "$NUGET_API_KEY" || { echo "::error::缺少 secret NUGET_API_KEY（nuget.org 发布凭据）"; exit 1; }
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: Pack & push to NuGet
        run: |
          cd sdks/csharp
          dotnet pack src/Croupier.Sdk/Croupier.Sdk.csproj \
            -c Release -p:Version=${{ needs.resolve-version.outputs.version }} \
            -o ./artifacts
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  cpp-release:
    if: ${{ inputs.publish_cpp }}
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # C++ 无中心包仓库：发布=GitHub Release 附加源码包
      - name: Attach C++ SDK source to release
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          mkdir -p /tmp/pkg
          tar --exclude='sdks/cpp/build' -czf "/tmp/pkg/croupier-cpp-sdk-${{ needs.resolve-version.outputs.version }}.tar.gz" -C sdks cpp
          # release 不存在则创建（draft）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG"
          gh release upload "$TAG" "/tmp/pkg/croupier-cpp-sdk-${{ needs.resolve-version.outputs.version }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    if: ${{ always() }}
    needs:
      [
        resolve-version,
        python-pypi,
        js-npm,
        go-module,
        java-packages,
        csharp-nuget,
        cpp-release,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          echo "## SDK 发布结果（版本 ${TAG}）" >> "$GITHUB_STEP_SUMMARY"
          for j in python-pypi js-npm go-module java-packages csharp-nuget cpp-release; do
            R=$(printf '%s' "$NEEDS" | jq -r --arg j "$j" '.[$j].result // "skipped"')
            echo "- $j: ${R}" >> "$GITHUB_STEP_SUMMARY"
          done
