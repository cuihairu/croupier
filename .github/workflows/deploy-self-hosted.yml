name: Deploy Self Hosted

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: "GHCR owner/namespace"
        required: true
        default: "cuihairu"
      server_tag:
        description: "croupier-server image tag"
        required: true
        default: "main"
      agent_tag:
        description: "croupier-agent image tag"
        required: true
        default: "main"
      dashboard_tag:
        description: "croupier-dashboard image tag"
        required: true
        default: "main"
      sdk_example_tag:
        description: "croupier-sdk-go game demo image tag"
        required: true
        default: "main"
      enable_sdk_examples:
        description: "Deploy croupier-sdk-go game demo container"
        required: true
        default: "true"
      deploy_dir:
        description: "Absolute deploy directory on runner host"
        required: true
        default: "/data/deploy/croupier"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure deploy directory
        run: mkdir -p "${{ inputs.deploy_dir }}"

      - name: Prepare compose and env
        run: |
          cp docker/docker-compose.deploy.yml "${{ inputs.deploy_dir }}/docker-compose.yml"
          cat > "${{ inputs.deploy_dir }}/.env" <<EOF
          GHCR_OWNER=${{ inputs.ghcr_owner }}
          CROUPIER_SERVER_TAG=${{ inputs.server_tag }}
          CROUPIER_AGENT_TAG=${{ inputs.agent_tag }}
          CROUPIER_DASHBOARD_TAG=${{ inputs.dashboard_tag }}
          CROUPIER_SDK_EXAMPLE_TAG=${{ inputs.sdk_example_tag }}
          ENABLE_SDK_EXAMPLES=${{ inputs.enable_sdk_examples }}
          EOF

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest images
        run: |
          COMPOSE_ARGS='--env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml"'
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            eval docker compose $COMPOSE_ARGS --profile sdk-examples pull
          else
            eval docker compose $COMPOSE_ARGS pull
          fi

      - name: Deploy containers
        run: |
          COMPOSE_ARGS='--env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml"'
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            eval docker compose $COMPOSE_ARGS --profile sdk-examples up -d --remove-orphans
          else
            eval docker compose $COMPOSE_ARGS up -d --remove-orphans
          fi

      - name: Show running services
        run: |
          COMPOSE_ARGS='--env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml"'
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            eval docker compose $COMPOSE_ARGS --profile sdk-examples ps
          else
            eval docker compose $COMPOSE_ARGS ps
          fi

      - name: Cleanup dangling images
        run: docker image prune -f
