name: Deploy Self Hosted

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: "GHCR owner/namespace"
        required: true
        default: "cuihairu"
      server_tag:
        description: "croupier-server image tag"
        required: true
        default: "main"
      agent_tag:
        description: "croupier-agent image tag"
        required: true
        default: "main"
      dashboard_tag:
        description: "croupier-dashboard image tag"
        required: true
        default: "main"
      sdk_example_tag:
        description: "SDK example demo images tag (go/python/java/js/cpp/csharp 共用)"
        required: true
        default: "main"
      enable_sdk_examples:
        description: "Deploy SDK example demo containers (六种语言全量)"
        required: true
        default: "true"
      deploy_dir:
        description: "Absolute deploy directory on runner host"
        required: true
        default: "/data/deploy/croupier"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Keep the historical project name used by the first self-hosted deployment.
  # The existing persistent volumes are docker_* and fixed container_name values
  # conflict if Compose silently derives a new project name from deploy_dir.
  CROUPIER_COMPOSE_PROJECT: croupier

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7

      - name: Ensure deploy directory
        timeout-minutes: 1
        run: mkdir -p "${{ inputs.deploy_dir }}"

      - name: Prepare compose, configs and env
        timeout-minutes: 2
        run: |
          cp docker/docker-compose.deploy.yml "${{ inputs.deploy_dir }}/docker-compose.yml"
          cp docker/docker-compose.telemetry.yaml "${{ inputs.deploy_dir }}/docker-compose.telemetry.yaml"
          # 备份线上 agent 配置（scope 是环境事实，rm -rf configs 前抢救）
          PREV_DIR="$(mktemp -d)"
          for cfg in agent.yaml agent2.yaml; do
            if [ -f "${{ inputs.deploy_dir }}/configs/${cfg}" ]; then
              cp "${{ inputs.deploy_dir }}/configs/${cfg}" "${PREV_DIR}/${cfg}"
            fi
          done
          # Server/agent bind-mount ./configs/{server,agent,agent2}.yaml read-only
          # (see docker-compose.deploy.yml). Recreate the dir each run: a prior
          # failed `up` leaves Docker auto-created empty same-name *directories*
          # in place of the missing files, which then fail with "not a directory".
          rm -rf "${{ inputs.deploy_dir }}/configs"
          mkdir -p "${{ inputs.deploy_dir }}/configs"
          cp docker/configs/server.yaml docker/configs/agent.yaml docker/configs/agent2.yaml docker/configs/haproxy.cfg "${{ inputs.deploy_dir }}/configs/"
          # telemetry 栈（prometheus/grafana/jaeger/otel）配置随部署分发——
          # prometheus.yml 含 haproxy exporter 抓取目标（LB 监控管道）
          cp configs/prometheus.yml "${{ inputs.deploy_dir }}/configs/prometheus.yml"
          # agent*.yaml 的 game/env scope 是环境事实（生产 demo-game/development，
          # 全新安装 bootstrap 为 default/dev），部署覆盖会静默改写 scope 导致
          # 函数注册进不可见的游戏。策略：线上已有文件原样保留（scope 不动），
          # 但 server.addr 强制收敛到 HAProxy L4 LB 入口——HA 拓扑下 agent 不允许
          # 直连单个 server 实例（旧直连/旧 nginx stream 入口地址均不保留）。
          for cfg in agent.yaml agent2.yaml; do
            if [ -f "${PREV_DIR}/${cfg}" ]; then
              cp "${PREV_DIR}/${cfg}" "${{ inputs.deploy_dir }}/configs/${cfg}"
            fi
            sed -i 's|^  addr: "[^"]*"$|  addr: "haproxy:19090"|' \
              "${{ inputs.deploy_dir }}/configs/${cfg}"
          done
          # agent2 是同一环境的第二个接入实例：gameId/env 必须与 agent1
          # 一致（否则注册进另一 scope，在 demo-game 视角下"消失"）。
          # 以线上 agent.yaml 的 scope 为准同步给 agent2。
          AGENT1_GAME="$(grep -oP '^  gameId: "\K[^"]*' "${{ inputs.deploy_dir }}/configs/agent.yaml" || true)"
          AGENT1_ENV="$(grep -oP '^  env: "\K[^"]*' "${{ inputs.deploy_dir }}/configs/agent.yaml" || true)"
          if [ -n "${AGENT1_GAME}" ]; then
            sed -i "s|^  gameId: \"[^\"]*\"|  gameId: \"${AGENT1_GAME}\"|" \
              "${{ inputs.deploy_dir }}/configs/agent2.yaml"
          fi
          if [ -n "${AGENT1_ENV}" ]; then
            sed -i "s|^  env: \"[^\"]*\"|  env: \"${AGENT1_ENV}\"|" \
              "${{ inputs.deploy_dir }}/configs/agent2.yaml"
          fi
          rm -rf "${PREV_DIR}"
          # OTel collector 配置随部署分发（trace 栈由 deploy compose 固化）
          cp configs/otel-collector-config.yaml "${{ inputs.deploy_dir }}/configs/otel-collector.yaml"
          # ClickHouse bootstrap DDL for the analytics profile (fresh volumes
          # get the worker-compatible schema automatically).
          mkdir -p "${{ inputs.deploy_dir }}/configs/clickhouse/initdb"
          cp configs/clickhouse/initdb/*.sql "${{ inputs.deploy_dir }}/configs/clickhouse/initdb/"
          # SDK demo 的 game/env scope 与 agent.yaml 一样是环境事实；.env 每次
          # 重建会回落 default/dev，把 demo 注册进不可见 scope。
          PREV_GAME="${CROUPIER_SDK_EXAMPLE_GAME_ID_PERSIST:-}"
          PREV_ENVV="${CROUPIER_SDK_EXAMPLE_ENV_PERSIST:-}"
          if [ -f "${{ inputs.deploy_dir }}/.env" ]; then
            PREV_GAME="$(grep -oP '^CROUPIER_SDK_EXAMPLE_GAME_ID=\K.*' "${{ inputs.deploy_dir }}/.env" || true)"
            PREV_ENVV="$(grep -oP '^CROUPIER_SDK_EXAMPLE_ENV=\K.*' "${{ inputs.deploy_dir }}/.env" || true)"
          fi
          cat > "${{ inputs.deploy_dir }}/.env" <<EOF
          GHCR_OWNER=${{ inputs.ghcr_owner }}
          CROUPIER_SERVER_TAG=${{ inputs.server_tag }}
          CROUPIER_AGENT_TAG=${{ inputs.agent_tag }}
          CROUPIER_DASHBOARD_TAG=${{ inputs.dashboard_tag }}
          CROUPIER_SDK_EXAMPLE_TAG=${{ inputs.sdk_example_tag }}
          ENABLE_SDK_EXAMPLES=${{ inputs.enable_sdk_examples }}
          EOF
          if [ -n "${PREV_GAME}" ]; then
            echo "CROUPIER_SDK_EXAMPLE_GAME_ID=${PREV_GAME}" >> "${{ inputs.deploy_dir }}/.env"
          fi
          if [ -n "${PREV_ENVV}" ]; then
            echo "CROUPIER_SDK_EXAMPLE_ENV=${PREV_ENVV}" >> "${{ inputs.deploy_dir }}/.env"
          fi

      - name: Login GHCR
        timeout-minutes: 2
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest images
        timeout-minutes: 40
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml")
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            PULL_ARGS=(--profile sdk-examples)
          else
            PULL_ARGS=()
          fi
          # 镜像源/外网抖动重试（3 次，间隔递增）；观测栈等非关键镜像
          # 拉取失败时降级为 warning——本地已有镜像即可继续部署，
          # 主服务（server/agent/dashboard）拉取失败才是硬失败。
          for i in 1 2 3; do
            if docker compose "${COMPOSE_ARGS[@]}" "${PULL_ARGS[@]}" pull; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "::warn::全量 pull 失败，尝试只拉核心镜像（观测栈沿用本地已有版本）"
              docker compose "${COMPOSE_ARGS[@]}" pull server server2 agent agent2 haproxy dashboard || {
                echo "::error::核心镜像（server/agent/dashboard）拉取失败"
                exit 1
              }
            fi
            sleep $((i * 15))
          done

      - name: Validate compose ownership
        timeout-minutes: 1
        run: |
          for name in \
            croupier-postgres \
            croupier-redis \
            croupier-clickhouse \
            croupier-server \
            croupier-server2 \
            croupier-agent \
            croupier-agent-2 \
            croupier-haproxy \
            croupier-dashboard \
            croupier-sdk-demo-go
          do
            if ! docker container inspect "${name}" >/dev/null 2>&1; then
              continue
            fi

            project="$(docker container inspect "${name}" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            service="$(docker container inspect "${name}" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            if [ "${project}" != "${CROUPIER_COMPOSE_PROJECT}" ]; then
              echo "::error::Container ${name} belongs to Compose project '${project}', expected '${CROUPIER_COMPOSE_PROJECT}'. Resolve the ownership mismatch before deploying."
              exit 1
            fi
            echo "Container ${name}: project=${project}, service=${service}"
          done

      - name: Deploy containers
        timeout-minutes: 10
        id: deploy
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml")
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            docker compose "${COMPOSE_ARGS[@]}" --profile sdk-examples up -d --wait --remove-orphans
          else
            docker compose "${COMPOSE_ARGS[@]}" up -d --wait --remove-orphans
          fi

          # 核心服务强制重建：自建 runner 上 compose 对同 tag 镜像更新的
          # 检测曾失灵（pull 到新 digest 但 up 判定 Running 不重建），
          # 发布语义要求核心服务必须运行最新镜像——每次部署强制重建，
          # 基础设施（db/redis 等）仍按需重建。
          echo "===== 镜像 digest 诊断（服务 -> 镜像 ID） ====="
          docker compose "${COMPOSE_ARGS[@]}" images server server2 agent agent2 haproxy dashboard
          docker compose "${COMPOSE_ARGS[@]}" up -d --force-recreate --wait server server2 agent agent2 haproxy dashboard

          # telemetry 栈（独立 project：croupier-telemetry）：prometheus/
          # grafana/jaeger/otel。宿主映射端口供 deploy 栈跨网络访问
          #（LB 监控 19092）。telemetry 失败不阻塞主服务部署。
          TELEMETRY_ARGS=(--project-name croupier-telemetry -f "${{ inputs.deploy_dir }}/docker-compose.telemetry.yaml")
          sed -i 's|\.\./configs/|${{ inputs.deploy_dir }}/configs/|g' "${{ inputs.deploy_dir }}/docker-compose.telemetry.yaml"
          if ! docker compose "${TELEMETRY_ARGS[@]}" up -d --wait; then
            echo "::warn::telemetry 栈启动失败（主服务不受影响；LB 监控/trace 不可用）"
          fi

      - name: Dump agent registration evidence
        timeout-minutes: 2
        run: |
          for c in croupier-server croupier-server2; do
            echo "===== ${c}: register/heartbeat/cluster tail ====="
            docker logs --tail 200 "${c}" 2>&1 | grep -Ei "registered|heartbeat|cluster|owner" | tail -12 || true
          done

      - name: Dump dashboard logs (on failure)
        if: failure()
        timeout-minutes: 2
        run: |
          echo "===== croupier-dashboard logs ====="
          docker logs --tail 50 croupier-dashboard 2>&1 || true
          echo "===== croupier-dashboard inspect (health) ====="
          docker inspect --format '{{json .State.Health}}' croupier-dashboard 2>&1 || true

      - name: Show running services
        timeout-minutes: 2
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml")
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            docker compose "${COMPOSE_ARGS[@]}" --profile sdk-examples ps
          else
            docker compose "${COMPOSE_ARGS[@]}" ps
          fi

      - name: Cleanup dangling images
        timeout-minutes: 2
        run: docker image prune -f
