name: Deploy Self Hosted

on:
  workflow_dispatch:
    inputs:
      ghcr_owner:
        description: "GHCR owner/namespace"
        required: true
        default: "cuihairu"
      server_tag:
        description: "croupier-server image tag"
        required: true
        default: "main"
      agent_tag:
        description: "croupier-agent image tag"
        required: true
        default: "main"
      dashboard_tag:
        description: "croupier-dashboard image tag"
        required: true
        default: "main"
      sdk_example_tag:
        description: "SDK example demo images tag (go/python/java/js/cpp/csharp 共用)"
        required: true
        default: "main"
      enable_sdk_examples:
        description: "Deploy SDK example demo containers (六种语言全量)"
        required: true
        default: "true"
      deploy_dir:
        description: "Absolute deploy directory on runner host"
        required: true
        default: "/data/deploy/croupier"
      analytics_bridge:
        description: "Enable OTel→analytics bridge on servers (events land in ClickHouse)"
        required: false
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Keep the historical project name used by the first self-hosted deployment.
  # The existing persistent volumes are docker_* and fixed container_name values
  # conflict if Compose silently derives a new project name from deploy_dir.
  CROUPIER_COMPOSE_PROJECT: croupier

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      - name: Ensure deploy directory
        timeout-minutes: 1
        run: mkdir -p "${{ inputs.deploy_dir }}"

      # AUD-096: 现场 compose/配置目录不再被直接覆写。本步骤只把「这次部署应该
      # 长什么样」写进独立候选目录（${RUNNER_TEMP}，与 deploy_dir 隔离），现场
      # 的 agent*.yaml / .env 环境事实仅以只读方式读取，现场目录在整个候选期
      # （staging → 校验 → 镜像准备）保持字节级不变。
      - name: Stage candidate compose, configs and env
        timeout-minutes: 3
        run: |
          CANDIDATE_DIR="${RUNNER_TEMP}/croupier-deploy-candidate"
          echo "CANDIDATE_DIR=${CANDIDATE_DIR}" >> "${GITHUB_ENV}"
          rm -rf "${CANDIDATE_DIR}"
          mkdir -p "${CANDIDATE_DIR}/configs/clickhouse/initdb"
          cp docker/docker-compose.deploy.yml "${CANDIDATE_DIR}/docker-compose.yml"
          cp docker/docker-compose.telemetry.yaml "${CANDIDATE_DIR}/docker-compose.telemetry.yaml"
          cp docker/configs/server.yaml docker/configs/agent.yaml docker/configs/agent2.yaml docker/configs/haproxy.cfg "${CANDIDATE_DIR}/configs/"
          cp configs/prometheus.yml "${CANDIDATE_DIR}/configs/prometheus.yml"
          cp configs/otel-collector-config.yaml "${CANDIDATE_DIR}/configs/otel-collector.yaml"
          cp configs/clickhouse/initdb/*.sql "${CANDIDATE_DIR}/configs/clickhouse/initdb/"
          # 备份线上 agent 配置（scope 是环境事实；只读读取现场，改写落在候选副本）
          PREV_DIR="$(mktemp -d)"
          for cfg in agent.yaml agent2.yaml; do
            if [ -f "${{ inputs.deploy_dir }}/configs/${cfg}" ]; then
              cp "${{ inputs.deploy_dir }}/configs/${cfg}" "${PREV_DIR}/${cfg}"
            fi
          done
          # agent*.yaml 的 game/env scope 是环境事实（生产 demo-game/development，
          # 全新安装 bootstrap 为 default/dev），部署覆盖会静默改写 scope 导致
          # 函数注册进不可见的游戏。策略：线上已有文件原样保留（scope 不动），
          # 但 server.addr 强制收敛到 HAProxy L4 LB 入口——HA 拓扑下 agent 不允许
          # 直连单个 server 实例（旧直连/旧 nginx stream 入口地址均不保留）。
          for cfg in agent.yaml agent2.yaml; do
            if [ -f "${PREV_DIR}/${cfg}" ]; then
              cp "${PREV_DIR}/${cfg}" "${CANDIDATE_DIR}/configs/${cfg}"
            fi
            sed -i 's|^  addr: "[^"]*"$|  addr: "haproxy:19090"|' \
              "${CANDIDATE_DIR}/configs/${cfg}"
          done
          # agent2 是同一环境的第二个接入实例：gameId/env 必须与 agent1
          # 一致（否则注册进另一 scope，在 demo-game 视角下"消失"）。
          # 以线上 agent.yaml 的 scope 为准同步给 agent2。
          AGENT1_GAME="$(grep -oP '^  gameId: "\K[^"]*' "${CANDIDATE_DIR}/configs/agent.yaml" || true)"
          AGENT1_ENV="$(grep -oP '^  env: "\K[^"]*' "${CANDIDATE_DIR}/configs/agent.yaml" || true)"
          if [ -n "${AGENT1_GAME}" ]; then
            sed -i "s|^  gameId: \"[^\"]*\"|  gameId: \"${AGENT1_GAME}\"|" \
              "${CANDIDATE_DIR}/configs/agent2.yaml"
          fi
          if [ -n "${AGENT1_ENV}" ]; then
            sed -i "s|^  env: \"[^\"]*\"|  env: \"${AGENT1_ENV}\"|" \
              "${CANDIDATE_DIR}/configs/agent2.yaml"
          fi
          rm -rf "${PREV_DIR}"
          # OTel collector 配置随部署分发（trace 栈由 deploy compose 固化）；
          # AUD-096：落候选目录（部署前现场目录只读，除 agent*.yaml 环境事实外）。
          cp configs/otel-collector-config.yaml "${CANDIDATE_DIR}/configs/otel-collector.yaml"
          # ClickHouse bootstrap DDL for the analytics profile (fresh volumes
          # get the worker-compatible schema automatically).
          mkdir -p "${CANDIDATE_DIR}/configs/clickhouse/initdb"
          cp configs/clickhouse/initdb/*.sql "${CANDIDATE_DIR}/configs/clickhouse/initdb/"
          # AUD-095: .env has two explicit owners.
          # MANAGED_KEYS are rebuilt from workflow inputs on every deploy
          # (image tags, registry, feature switches). Every other key is
          # instance-owned (host ports, ClickHouse/collection config and
          # credentials, demo game/env scope, image overrides, external
          # endpoints and secrets) and must survive redeploys. INSTANCE_KEYS
          # gives the known keys a stable emission order; the catch-all below
          # preserves any future instance key without a workflow edit. Managed
          # keys always win (they are skipped during the snapshot).
          # BEGIN deploy env merge (AUD-095)
          DEPLOY_DIR="${{ inputs.deploy_dir }}"
          MANAGED_KEYS=(
            GHCR_OWNER
            CROUPIER_SERVER_TAG CROUPIER_AGENT_TAG CROUPIER_DASHBOARD_TAG
            CROUPIER_SDK_EXAMPLE_TAG ENABLE_SDK_EXAMPLES ANALYTICS_BRIDGE_ENABLED
          )
          INSTANCE_KEYS=(
            CROUPIER_SDK_EXAMPLE_GAME_ID CROUPIER_SDK_EXAMPLE_ENV
            POSTGRES_PORT REDIS_PORT CLICKHOUSE_HTTP_PORT CLICKHOUSE_NATIVE_PORT
            JAEGER_UI_PORT SERVER_TRANSPORT_PORT SERVER_HTTP_PORT AGENT_HTTP_PORT
            DASHBOARD_PORT HAPROXY_STATS_PORT INGEST_PORT
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
            CLICKHOUSE_USER CLICKHOUSE_PASSWORD CLICKHOUSE_DB CLICKHOUSE_DSN
            ANALYTICS_INGEST_SECRET ANALYTICS_MQ_TYPE ANALYTICS_REDIS_ADDR
            ANALYTICS_REDIS_STREAM_EVENTS ANALYTICS_REDIS_STREAM_PAYMENTS
            ANALYTICS_INGEST_SKEW WORKER_GROUP
            DATABASE_URL REDIS_URL GEOIP_TIMEOUT_MS OTEL_EXPORTER_OTLP_ENDPOINT
            CROUPIER_JAEGER_URL CROUPIER_GRAFANA_EXPLORE_URL CROUPIER_LB_PROMETHEUS_URL
            CROUPIER_AUTH_LDAP_BIND_PASSWORD CROUPIER_AUTH_OIDC_CLIENT_SECRET
            CROUPIER_INGEST_TAG CROUPIER_ANALYTICS_WORKER_TAG
            POSTGRES_IMAGE REDIS_IMAGE CLICKHOUSE_IMAGE OTEL_IMAGE JAEGER_IMAGE
            HAPROXY_IMAGE
          )
          # AUD-096: 现场 .env 是环境事实来源（只读）；合并结果落候选 .env。
          LIVE_ENV_FILE="${DEPLOY_DIR}/.env"
          ENV_FILE="${CANDIDATE_DIR}/.env"
          # Snapshot before writing: the old flow truncated .env, then tried
          # to grep the previous ports from the newly written file.
          declare -A PRESERVED=()
          if [ -f "${LIVE_ENV_FILE}" ]; then
            while IFS= read -r line || [ -n "${line}" ]; do
              case "${line}" in ''|'#'*) continue ;; esac
              key="${line%%=*}"
              case "${key}" in *=|*[!A-Z0-9_]*) continue ;; esac
              for managed in "${MANAGED_KEYS[@]}"; do
                if [ "${key}" = "${managed}" ]; then continue 2; fi
              done
              for owned in "${INSTANCE_KEYS[@]}"; do
                if [ "${key}" = "${owned}" ]; then
                  PRESERVED["${key}"]="${line}"
                  continue 2
                fi
              done
              # Catch-all: anything not workflow-managed belongs to the instance.
              # This covers future *_PORT / *_IMAGE / collection config keys
              # that are not yet in the explicit INSTANCE_KEYS list.
              PRESERVED["${key}"]="${line}"
            done < "${LIVE_ENV_FILE}"
          fi
          # Older installers set these on the runner before .env existed.
          for pair in \
            "CROUPIER_SDK_EXAMPLE_GAME_ID:${CROUPIER_SDK_EXAMPLE_GAME_ID_PERSIST:-}" \
            "CROUPIER_SDK_EXAMPLE_ENV:${CROUPIER_SDK_EXAMPLE_ENV_PERSIST:-}"
          do
            key="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "${value}" ] && [ -z "${PRESERVED[${key}]:-}" ]; then
              PRESERVED["${key}"]="${key}=${value}"
            fi
          done
          # Build beside the target, then publish with a single rename; compose
          # never observes a half-written .env. Scoped subshell owns cleanup.
          (
            set -e
            TMP_ENV="$(mktemp "${CANDIDATE_DIR}/.env.XXXXXX")"
            trap 'rm -f "${TMP_ENV}"' EXIT
            {
              printf 'GHCR_OWNER=%s\n' "${{ inputs.ghcr_owner }}"
              printf 'CROUPIER_SERVER_TAG=%s\n' "${{ inputs.server_tag }}"
              printf 'CROUPIER_AGENT_TAG=%s\n' "${{ inputs.agent_tag }}"
              printf 'CROUPIER_DASHBOARD_TAG=%s\n' "${{ inputs.dashboard_tag }}"
              printf 'CROUPIER_SDK_EXAMPLE_TAG=%s\n' "${{ inputs.sdk_example_tag }}"
              printf 'ENABLE_SDK_EXAMPLES=%s\n' "${{ inputs.enable_sdk_examples }}"
              printf 'ANALYTICS_BRIDGE_ENABLED=%s\n' "${{ inputs.analytics_bridge }}"
            } > "${TMP_ENV}"
            declare -A EMITTED=()
            for key in "${INSTANCE_KEYS[@]}"; do
              if [ -n "${PRESERVED[${key}]:-}" ]; then
                printf '%s\n' "${PRESERVED[${key}]}" >> "${TMP_ENV}"
                EMITTED["${key}"]=1
              fi
            done
            if [ "${#PRESERVED[@]}" -gt 0 ]; then
              for key in "${!PRESERVED[@]}"; do
                if [ -z "${EMITTED[${key}]:-}" ]; then
                  printf '%s\n' "${PRESERVED[${key}]}" >> "${TMP_ENV}"
                fi
              done
            fi
            chmod 600 "${TMP_ENV}"
            mv -f "${TMP_ENV}" "${ENV_FILE}"
          )
          unset PRESERVED
          # END deploy env merge (AUD-095)

      - name: Login GHCR
        timeout-minutes: 3
        run: |
          # runner 到 ghcr.io 偶发 EOF（网络抖动），失败重试避免部署静默失败留旧容器
          for i in 1 2 3; do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            echo "ghcr login failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          exit 1

      # AUD-096: 镜像准备改指向候选目录——pull 在候选 compose/.env 上执行，
      # 现场目录在 pull 失败时保持原样（镜像准备失败不再破坏现场）。
      - name: Pull latest images (candidate)
        timeout-minutes: 40
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${CANDIDATE_DIR}/.env" -f "${CANDIDATE_DIR}/docker-compose.yml")
          # analytics profile（ingestion/analytics-worker）随每次部署一起拉新；
          # 不带 profile 时 compose up 不会碰这些服务，镜像会滞留旧版本。
          PULL_ARGS=(--profile analytics)
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            PULL_ARGS+=(--profile sdk-examples)
          fi
          # 镜像源/外网抖动重试（3 次，间隔递增）；观测栈等非关键镜像
          # 拉取失败时降级为 warning——本地已有镜像即可继续部署，
          # 主服务（server/agent/dashboard）拉取失败才是硬失败。
          for i in 1 2 3; do
            if docker compose "${COMPOSE_ARGS[@]}" "${PULL_ARGS[@]}" pull; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "::warn::全量 pull 失败，尝试只拉核心镜像（观测栈沿用本地已有版本）"
              docker compose "${COMPOSE_ARGS[@]}" pull server server2 agent agent2 haproxy dashboard || {
                echo "::error::核心镜像（server/agent/dashboard）拉取失败"
                exit 1
              }
            fi
            sleep $((i * 15))
          done

      # AUD-096 校验门：候选 compose 解析、变量插值、bind-mount 源文件、YAML 语法
      # 与 .env 必需键全部通过后才允许进入切换。此步骤失败时现场目录未被触碰，
      # 上一个可用版本（现场现物 + 本地镜像）继续服务。
      - name: Validate candidate config tree
        timeout-minutes: 3
        run: |
          set -euo pipefail
          fail() { echo "::error::${1}"; exit 1; }
          DEPLOY_COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${CANDIDATE_DIR}/.env" -f "${CANDIDATE_DIR}/docker-compose.yml")
          # 1) deploy 栈 compose 解析 + 变量插值 + schema 校验
          docker compose "${DEPLOY_COMPOSE_ARGS[@]}" config -q || fail "候选 docker-compose.yml 校验失败（解析/插值/schema）"
          # 2) telemetry 栈（同一候选目录：../configs/ 相对候选根目录解析）
          docker compose --project-name croupier-telemetry -f "${CANDIDATE_DIR}/docker-compose.telemetry.yaml" config -q \
            || fail "候选 docker-compose.telemetry.yaml 校验失败"
          # 3) bind-mount 源文件齐备且非空（compose config 不校验源文件存在性；
          #    docker auto-create 同名目录会伪装成文件，2026-09 已踩过"not a directory"）
          for f in \
            configs/server.yaml configs/agent.yaml configs/agent2.yaml \
            configs/haproxy.cfg configs/prometheus.yml configs/otel-collector.yaml \
          ; do
            [ -s "${CANDIDATE_DIR}/${f}" ] || fail "候选配置缺失或为空: ${f}"
          done
          for sql in "${CANDIDATE_DIR}"/configs/clickhouse/initdb/*.sql; do
            [ -s "${sql}" ] || fail "候选 clickhouse initdb 脚本缺失或为空: ${sql}"
          done
          # 4) 应用配置 YAML 语法（python3 是 runner 预装；PyYAML 不可用时仅告警跳过）
          if command -v python3 >/dev/null 2>&1 && python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' \
              "${CANDIDATE_DIR}/configs/server.yaml" \
              || fail "候选 server.yaml 语法错误"
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' \
              "${CANDIDATE_DIR}/configs/agent.yaml" \
              || fail "候选 agent.yaml 语法错误"
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' \
              "${CANDIDATE_DIR}/configs/agent2.yaml" \
              || fail "候选 agent2.yaml 语法错误"
          else
            echo "::warn::python3/PyYAML 不可用，跳过应用配置 YAML 语法校验"
          fi
          # 5) .env 必需键（本次部署管理的键）
          for key in GHCR_OWNER CROUPIER_SERVER_TAG CROUPIER_AGENT_TAG CROUPIER_DASHBOARD_TAG \
                     CROUPIER_SDK_EXAMPLE_TAG ENABLE_SDK_EXAMPLES ANALYTICS_BRIDGE_ENABLED; do
            grep -q "^${key}=" "${CANDIDATE_DIR}/.env" || fail "候选 .env 缺少必需键: ${key}"
          done
          echo "候选配置树校验通过: ${CANDIDATE_DIR}"

      - name: Validate compose ownership
        timeout-minutes: 1
        run: |
          for name in \
            croupier-postgres \
            croupier-redis \
            croupier-clickhouse \
            croupier-server \
            croupier-server2 \
            croupier-agent \
            croupier-agent-2 \
            croupier-haproxy \
            croupier-dashboard \
            croupier-ingestion \
            croupier-analytics-worker \
            croupier-sdk-demo-go
          do
            if ! docker container inspect "${name}" >/dev/null 2>&1; then
              continue
            fi

            project="$(docker container inspect "${name}" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            service="$(docker container inspect "${name}" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            if [ "${project}" != "${CROUPIER_COMPOSE_PROJECT}" ]; then
              echo "::error::Container ${name} belongs to Compose project '${project}', expected '${CROUPIER_COMPOSE_PROJECT}'. Resolve the ownership mismatch before deploying."
              exit 1
            fi
            echo "Container ${name}: project=${project}, service=${service}"
          done

      - name: Dump server panic evidence (always)
        if: always()
        timeout-minutes: 2
        run: |
          for c in croupier-server croupier-server2; do
            echo "===== ${c}: panic tail ====="
            docker logs --tail 2000 "${c}" 2>&1 | grep -B 5 -A 40 -E "panic:|CreateCompositeProposal panic|recovered" | tail -60 || echo "(no panic evidence)"
          done

      # AUD-096 切换：先整目录备份现场（compose+配置+.env），再逐件候选→现场。
      # 任何一件复制失败即 trap 回滚：从备份逐件还原现场，保证「上一个可用版本
      # 可继续使用」——切换失败后现场目录与切换前逐字节一致。
      - name: Switch candidate into deploy dir (backup + rollback)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          DEPLOY_DIR="${{ inputs.deploy_dir }}"
          BACKUP_DIR="${DEPLOY_DIR}/.deploy-backup-$(date +%Y%m%d%H%M%S)"
          MANAGED_ITEMS=(docker-compose.yml docker-compose.telemetry.yaml .env configs)
          mkdir -p "${BACKUP_DIR}"
          for item in "${MANAGED_ITEMS[@]}"; do
            if [ -e "${DEPLOY_DIR}/${item}" ]; then
              cp -a "${DEPLOY_DIR}/${item}" "${BACKUP_DIR}/"
            fi
          done
          rollback() {
            echo "::warning::切换失败，从 ${BACKUP_DIR} 回滚现场目录"
            for item in "${MANAGED_ITEMS[@]}"; do
              rm -rf "${DEPLOY_DIR}/${item}"
              if [ -e "${BACKUP_DIR}/${item}" ]; then
                cp -a "${BACKUP_DIR}/${item}" "${DEPLOY_DIR}/"
              fi
            done
            echo "::error::部署已中止，现场目录已恢复为上一个可用版本"
            exit 1
          }
          trap rollback ERR
          for item in "${MANAGED_ITEMS[@]}"; do
            if [ -e "${CANDIDATE_DIR}/${item}" ]; then
              # 现场若残留 Docker 自动创建的同名目录（历史踩坑），先清掉再落文件
              rm -rf "${DEPLOY_DIR}/${item}"
              cp -a "${CANDIDATE_DIR}/${item}" "${DEPLOY_DIR}/"
            fi
          done
          trap - ERR
          echo "切换完成（备份: ${BACKUP_DIR}）"

      - name: Deploy containers
        timeout-minutes: 10
        id: deploy
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml")
          # analytics profile（ingestion/analytics-worker）与应用服务同批启用；
          # 二者依赖的 redis/clickhouse 在默认 profile，由 compose 自动补齐健康等待。
          DEPLOY_ARGS=(--profile analytics)
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            DEPLOY_ARGS+=(--profile sdk-examples)
          fi
          docker compose "${COMPOSE_ARGS[@]}" "${DEPLOY_ARGS[@]}" up -d --wait --remove-orphans

          # 应用服务强制重建：自建 runner 上 compose 对同 tag 镜像更新的
          # 检测曾失灵（pull 到新 digest 但 up 判定 Running 不重建），
          # 发布语义要求应用服务必须运行最新镜像——每次部署强制重建
          # （含 ingestion/analytics-worker，无状态，重启由 Redis 流缓冲兜底），
          # 基础设施（db/redis 等）仍按需重建。
          echo "===== 镜像 digest 诊断（服务 -> 镜像 ID） ====="
          docker compose "${COMPOSE_ARGS[@]}" "${DEPLOY_ARGS[@]}" images server server2 agent agent2 haproxy dashboard ingestion analytics-worker
          docker compose "${COMPOSE_ARGS[@]}" "${DEPLOY_ARGS[@]}" up -d --force-recreate --wait server server2 agent agent2 haproxy dashboard ingestion analytics-worker

          # telemetry 栈（独立 project：croupier-telemetry）：prometheus/
          # grafana/jaeger/otel。宿主映射端口供 deploy 栈跨网络访问
          #（LB 监控 19092）。telemetry 失败不阻塞主服务部署。
          TELEMETRY_ARGS=(--project-name croupier-telemetry -f "${{ inputs.deploy_dir }}/docker-compose.telemetry.yaml")
          sed -i 's|\.\./configs/|${{ inputs.deploy_dir }}/configs/|g' "${{ inputs.deploy_dir }}/docker-compose.telemetry.yaml"
          if ! docker compose "${TELEMETRY_ARGS[@]}" up -d --wait; then
            echo "::warn::telemetry 栈启动失败（主服务不受影响；LB 监控/trace 不可用）"
          fi

      - name: Dump agent registration evidence
        timeout-minutes: 2
        run: |
          for c in croupier-server croupier-server2; do
            echo "===== ${c}: register/heartbeat/cluster tail ====="
            docker logs --tail 200 "${c}" 2>&1 | grep -Ei "registered|heartbeat|cluster|owner" | tail -12 || true
          done

      - name: Dump dashboard logs (on failure)
        if: failure()
        timeout-minutes: 2
        run: |
          echo "===== croupier-dashboard logs ====="
          docker logs --tail 50 croupier-dashboard 2>&1 || true
          echo "===== croupier-dashboard inspect (health) ====="
          docker inspect --format '{{json .State.Health}}' croupier-dashboard 2>&1 || true

      - name: Show running services
        timeout-minutes: 2
        run: |
          COMPOSE_ARGS=(--project-name "${CROUPIER_COMPOSE_PROJECT}" --env-file "${{ inputs.deploy_dir }}/.env" -f "${{ inputs.deploy_dir }}/docker-compose.yml")
          PS_ARGS=(--profile analytics)
          if [ "${{ inputs.enable_sdk_examples }}" = "true" ]; then
            PS_ARGS+=(--profile sdk-examples)
          fi
          docker compose "${COMPOSE_ARGS[@]}" "${PS_ARGS[@]}" ps

      # AUD-096: 候选目录是临时物，部署结束后（无论成败）清理；现场切换
      # 已完成或已回滚，清理候选不影响现场。
      - name: Cleanup candidate directory (always)
        if: always()
        timeout-minutes: 1
        run: |
          if [ -n "${CANDIDATE_DIR:-}" ] && [ -d "${CANDIDATE_DIR}" ]; then
            rm -rf "${CANDIDATE_DIR}"
            echo "候选目录已清理: ${CANDIDATE_DIR}"
          fi

      - name: Cleanup dangling images
        timeout-minutes: 2
        run: docker image prune -f
