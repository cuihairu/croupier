name: Release SDK — C#

# C# SDK 发布到 NuGet。入口：release-sdk-matrix.yml（workflow_call，正式 tag
# 发布链）或手动 dispatch；本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# dry_run：演练模式——照常 pack，但绝不 nuget push。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$V" in
            v*) TAG="$V"; NUM="${V#v}" ;;
            *)   TAG="v$V"; NUM="$V" ;;
          esac
          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$NUM"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require NUGET_API_KEY
        run: test -n "$NUGET_API_KEY" || { echo "::error::缺少 secret NUGET_API_KEY"; exit 1; }
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: Pack
        run: |
          cd sdks/csharp
          dotnet pack src/Croupier.Sdk/Croupier.Sdk.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts
      - name: Push to NuGet
        if: ${{ ! inputs.dry_run }}
        run: |
          cd sdks/csharp
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
