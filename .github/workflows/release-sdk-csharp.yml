name: Release SDK — C#

# C# SDK 发布到 NuGet。入口：release-sdk-matrix.yml（workflow_call，正式 tag
# 发布链）或手动 dispatch；本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# 源提交（AUD-078）：统一 checkout release-sdk-resolve.yml 解析出的 commit，
# 不再取触发 ref——触发分支领先 tag 时构建产物也只来自 tag 的源码。
# dry_run（AUD-079）：演练执行与正式发布一致的构建打包检查（dotnet pack 出
# .nupkg，与正式发布同一命令），产物以 workflow artifact 留档；不要求任何
# 发布凭据，绝不 nuget push。NUGET_API_KEY 只在真实 publish 步骤消费。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve version & pin source commit
    uses: ./.github/workflows/release-sdk-resolve.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
    # 解析只在 version 为空时需要只读 GITHUB_TOKEN；不 inherit 仓库 secret。

  release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: |
          cd sdks/csharp
          dotnet pack src/Croupier.Sdk/Croupier.Sdk.csproj -c Release -p:Version=${{ needs.resolve.outputs.version }} -o ./artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-csharp-${{ needs.resolve.outputs.version }}
          path: sdks/csharp/artifacts/*.nupkg
          if-no-files-found: error
      - name: Require NUGET_API_KEY (real publish only; drill needs no credentials)
        if: ${{ ! inputs.dry_run }}
        run: test -n "$NUGET_API_KEY" || { echo "::error::缺少 secret NUGET_API_KEY"; exit 1; }
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: Push to NuGet
        if: ${{ ! inputs.dry_run }}
        run: |
          cd sdks/csharp
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
