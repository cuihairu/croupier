name: CodeQL (SAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly at 03:00 UTC (Mon)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH

      - name: Initialize CodeQL
        timeout-minutes: 5
        uses: github/codeql-action/init@v4
        with:
          languages: go
          # 高级设置默认不跑 alert-suppression 查询，// codeql[...] 抑制注释要生效
          # 必须显式追加（附加在默认 suite 之上，+ 号保留默认安全查询）。
          # 本地查询包见 .github/codeql-custom/（registry pack:file 写法会被
          # 解析成非法 external repository 而报错，只能走本地目录）。
          queries: +./.github/codeql-custom

      - name: Build (for Go extractor)
        timeout-minutes: 15
        run: go build ./...

      - name: Perform CodeQL Analysis
        timeout-minutes: 10
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      # GitHub 不会自动按 SARIF suppressions[] 关闭告警，需要官方 dismiss-alerts
      # 把被 // codeql[...] 标记的结果 PATCH 为 dismissed（reason=won't fix）。
      # 仅 main（默认分支）上执行，避免分支上误改全局告警状态。
      - name: Dismiss suppressed alerts
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/go.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
