name: CodeQL (SAST)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codeql.yml"
      - "cmd/**"
      - "configs/**"
      - "database/**"
      - "descriptors/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "migrations/**"
      - "pkg/**"
      - "proto/**"
      - "scripts/**"
      - "tools/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codeql.yml"
      - "cmd/**"
      - "configs/**"
      - "database/**"
      - "descriptors/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "migrations/**"
      - "pkg/**"
      - "proto/**"
      - "scripts/**"
      - "tools/**"
  schedule:
    - cron: "0 3 * * 1" # weekly at 03:00 UTC (Mon)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH

      - name: Initialize CodeQL
        timeout-minutes: 5
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build (for Go extractor)
        timeout-minutes: 15
        run: go build ./...

      - name: Perform CodeQL Analysis
        timeout-minutes: 10
        uses: github/codeql-action/analyze@v3
