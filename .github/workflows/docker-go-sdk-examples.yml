name: Build and Push Go SDK Example Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-go-sdk-examples.yml"
      - "sdks/go/**"
      - "proto/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cuihairu/croupier-sdk-go-example-demo

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build game demo image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        timeout-minutes: 3
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: sdks/go
          file: sdks/go/examples/Dockerfile
          build-args: |
            EXAMPLE_DIR=examples/demo
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
