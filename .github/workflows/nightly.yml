name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version

      - name: Go mod download
        timeout-minutes: 5
        run: go mod download

      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: make build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $VERSION = "nightly-$(Get-Date -Format 'yyyyMMdd')"
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $LDFLAGS = "-X main.version=$VERSION -X main.buildTime=$BUILD_TIME -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./cmd/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./cmd/agent

      - name: Package binaries (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${TAR}" -C bin .

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = (go env GOOS)
          $GOARCH = (go env GOARCH)
          $ZIP = "release/croupier-bin-${GOOS}-${GOARCH}.zip"
          Compress-Archive -Path bin/* -DestinationPath $ZIP -Force

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: release/*
          retention-days: 7

  build-go-sdk:
    name: Build Go SDK (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runs-on: macos-latest
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "sdks/go/go.mod"

      - name: Build Go SDK
        timeout-minutes: 15
        shell: bash
        working-directory: ./sdks/go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go mod download
          go build -v ./pkg/...

      - name: Package Go SDK
        timeout-minutes: 5
        shell: bash
        working-directory: ./sdks/go
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          tar --exclude='*_test.go' \
            --exclude='examples/**/*.test' \
            -czf "${GITHUB_WORKSPACE}/release-artifacts/sdk-go-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            go.mod \
            go.sum \
            version.go \
            pkg \
            scripts \
            examples \
            LICENSE \
            README.md \
            SECURITY.md

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: go-sdk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-artifacts/sdk-go-*.tar.gz
          retention-days: 7

  build-other-sdks:
    name: Build Other SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: false

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@v6

      - name: Build JS SDK
        timeout-minutes: 15
        working-directory: ./sdks/js
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package JS SDK
        timeout-minutes: 5
        run: |
          cd sdks/js
          rm -rf ../../release-sdks/js
          mkdir -p ../../release-sdks/js
          pnpm pack --pack-destination ../../release-sdks/js
          cd ../../release-sdks/js
          tar -czf ../sdk-js.tar.gz *.tgz

      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python SDK
        timeout-minutes: 15
        working-directory: ./sdks/python
        run: |
          pip install build
          python -m build

      - name: Package Python SDK
        timeout-minutes: 5
        working-directory: ./sdks/python
        run: |
          mkdir -p ../../release-sdks/python
          cp dist/*.whl ../../release-sdks/python/ 2>/dev/null || true
          cp dist/*.tar.gz ../../release-sdks/python/ 2>/dev/null || true
          cd ../../release-sdks/python
          tar -czf ../sdk-python.tar.gz *

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build C# SDK
        timeout-minutes: 15
        working-directory: ./sdks/csharp
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Package C# SDK
        timeout-minutes: 5
        working-directory: ./sdks/csharp
        run: |
          mkdir -p ../../release-sdks/csharp
          find . -name "*.nupkg" -not -path "*/obj/*" -exec cp {} ../../release-sdks/csharp/ \; 2>/dev/null || true
          if [ -z "$(ls ../../release-sdks/csharp/)" ]; then
            echo "No nupkg files found, creating placeholder"
            echo "No C# SDK packages built" > ../../release-sdks/csharp/README.txt
          fi
          cd ../../release-sdks/csharp
          tar -czf ../sdk-csharp.tar.gz *

      - name: Create SDKs bundle
        timeout-minutes: 5
        run: |
          cd release-sdks
          tar -czf ../release-sdks.tar.gz *

      - name: Upload SDKs artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: other-sdks
          path: release-sdks.tar.gz
          retention-days: 7

  build-cpp-sdk:
    name: Build C++ SDK (${{ matrix.display_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - MD (动态 CRT)
          - os: windows-latest
            display_name: windows-x64-md
            vcpkg_triplet: x64-windows-static-md
            artifact_name: windows-x64-md
            build_type: Release

          # Linux
          - os: ubuntu-latest
            display_name: linux-x64
            vcpkg_triplet: x64-linux
            artifact_name: linux-x64
            build_type: Release

          # macOS Intel
          - os: macos-latest
            display_name: macos-x64
            vcpkg_triplet: x64-osx
            artifact_name: macos-x64
            build_type: Release

          # macOS ARM64
          - os: macos-latest
            display_name: macos-arm64
            vcpkg_triplet: arm64-osx
            artifact_name: macos-arm64
            build_type: Release
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Setup Windows Environment
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          $ninjaPath = (Get-Command ninja).Source
          $ninjaDir = Split-Path $ninjaPath -Parent
          echo "$ninjaDir" >> $env:GITHUB_PATH
          ninja --version

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsDevCmd = Join-Path $installPath "Common7/Tools/VsDevCmd.bat"
          $env:VSCMD_SKIP_SENDTELEMETRY = "1"
          # Export only MSVC-specific variables to GITHUB_ENV to avoid corrupting multi-line values
          cmd /c "`"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|DevEnvDir|VCIDEInstallDir|VSCMD_ARG_TGT_ARCH|VSCMD_VER)=') {
                Add-Content -Path $env:GITHUB_ENV -Value $_
              }
            }
          # Write the MSVC PATH separately, prepending to existing GITHUB_PATH
          $msvcPath = cmd /c "`"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 && echo %PATH%"
          Add-Content -Path $env:GITHUB_ENV -Value "MSVC_PATH=$msvcPath"

      - name: Setup Linux Environment
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Setup macOS Environment
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $scriptPath = Join-Path "${{ github.workspace }}" "sdks/cpp/scripts/bootstrap-vcpkg.ps1"
          $vcpkgRoot = Join-Path "${{ github.workspace }}" "sdks/cpp/vcpkg"
          & $scriptPath -VcpkgRoot $vcpkgRoot -VcpkgCommit "2025.04.09"

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          bash "${{ github.workspace }}/sdks/cpp/scripts/bootstrap-vcpkg.sh" \
            "${{ github.workspace }}/sdks/cpp/vcpkg" \
            "2025.04.09"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        working-directory: ./sdks/cpp
        run: |
          # Import MSVC environment from VsDevCmd
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsDevCmd = Join-Path $installPath "Common7/Tools/VsDevCmd.bat"
          $env:VSCMD_SKIP_SENDTELEMETRY = "1"
          $output = cmd /c "`"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 && set" 2>&1
          foreach ($line in $output) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], "Process")
            }
          }
          # Ensure ninja is in PATH
          $ninjaCmd = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $ninjaCmd) {
            Write-Error "Ninja not found in PATH"
            exit 1
          }
          Write-Host "Using ninja at: $($ninjaCmd.Source)"
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE="Release" `
            -DCMAKE_MAKE_PROGRAM="$($ninjaCmd.Source)" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" `
            -DVCPKG_HOST_TRIPLET="${{ matrix.vcpkg_triplet }}" `
            -DVCPKG_BUILD_TYPE="release" `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_STATIC_LIBS=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        shell: bash
        working-directory: ./sdks/cpp
        run: |
          CMAKE_ARCH_ARGS=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.artifact_name }}" == "macos-x64" ]]; then
              CMAKE_ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=x86_64"
            elif [[ "${{ matrix.artifact_name }}" == "macos-arm64" ]]; then
              CMAKE_ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DVCPKG_BUILD_TYPE=release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            ${CMAKE_ARCH_ARGS}

      - name: Build C++ SDK
        timeout-minutes: 30
        shell: bash
        working-directory: ./sdks/cpp
        run: |
          cmake --build build --config Release --parallel

      - name: Package C++ SDK (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        working-directory: ./sdks/cpp
        run: |
          mkdir -p package-static package-dynamic
          cmake --install build --prefix package-install

          cp -r package-install/include package-static/
          cp -r package-install/include package-dynamic/
          cp -r package-install/share package-static/
          cp -r package-install/share package-dynamic/
          cp -r package-install/bin package-dynamic/

          mkdir -p package-static/lib package-dynamic/lib
          Get-ChildItem -Path package-install -Recurse -Filter "*.lib" | Copy-Item -Destination package-static/lib
          Get-ChildItem -Path package-install -Recurse -Filter "*.dll" | Copy-Item -Destination package-dynamic/lib

          Compress-Archive -Path "package-static/*" -DestinationPath "sdk-cpp-static-${{ matrix.artifact_name }}.zip"
          Compress-Archive -Path "package-dynamic/*" -DestinationPath "sdk-cpp-dynamic-${{ matrix.artifact_name }}.zip"

      - name: Package C++ SDK (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        working-directory: ./sdks/cpp
        run: |
          mkdir -p package-static package-dynamic
          cmake --install build --prefix package-install

          cp -r package-install/include package-static/ 2>/dev/null || true
          cp -r package-install/include package-dynamic/ 2>/dev/null || true
          cp -r package-install/share package-static/ 2>/dev/null || true
          cp -r package-install/share package-dynamic/ 2>/dev/null || true
          cp -r package-install/bin package-dynamic/ 2>/dev/null || true

          mkdir -p package-static/lib package-dynamic/lib

          find package-install -name "*.a" -exec cp {} package-static/lib/ \; 2>/dev/null || true
          find package-install -name "*.so*" -exec cp {} package-dynamic/lib/ \; 2>/dev/null || true
          find package-install -name "*.dylib*" -exec cp {} package-dynamic/lib/ \; 2>/dev/null || true

          tar -czf "sdk-cpp-static-${{ matrix.artifact_name }}.tar.gz" -C package-static .
          tar -czf "sdk-cpp-dynamic-${{ matrix.artifact_name }}.tar.gz" -C package-dynamic .

      - name: Upload artifacts
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: cpp-sdk-${{ matrix.artifact_name }}
          path: |
            sdks/cpp/sdk-cpp-*.tar.gz
            sdks/cpp/sdk-cpp-*.zip
          retention-days: 7

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        timeout-minutes: 10
        working-directory: ./web
        run: pnpm run build

      - name: Package Dashboard
        timeout-minutes: 5
        run: |
          cd web
          tar -czf ../dashboard.tar.gz dist

      - name: Upload Dashboard artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: dashboard.tar.gz
          retention-days: 7

  release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [
        build-binaries,
        build-go-sdk,
        build-other-sdks,
        build-cpp-sdk,
        build-dashboard,
      ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        timeout-minutes: 10
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        timeout-minutes: 10
        run: |
          mkdir -p release-assets

          # Copy server/agent binaries
          find artifacts/binaries-* -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts/binaries-* -name "*.zip" -exec cp {} release-assets/ \;

          # Copy Go SDK
          find artifacts/go-sdk-* -name "sdk-go-*.tar.gz" -exec cp {} release-assets/ \;

          # Copy other SDKs
          cp artifacts/other-sdks/release-sdks.tar.gz release-assets/

          # Copy C++ SDK
          find artifacts/cpp-sdk-* -name "sdk-cpp-*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts/cpp-sdk-* -name "sdk-cpp-*.zip" -exec cp {} release-assets/ \;

          # Copy Dashboard
          cp artifacts/dashboard/dashboard.tar.gz release-assets/

          ls -la release-assets/

      - name: Generate release notes
        timeout-minutes: 2
        run: |
          cat > release-notes.md << 'EOF'
          # Nightly Build

          **Built**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: $(git rev-parse --short HEAD)
          **Branch**: main

          ## Contents

          ### Server/Agent Binaries
          - `croupier-bin-darwin-arm64.tar.gz` - macOS ARM64
          - `croupier-bin-darwin-amd64.tar.gz` - macOS Intel
          - `croupier-bin-linux-amd64.tar.gz` - Linux x64
          - `croupier-bin-windows-amd64.zip` - Windows x64

          ### Go SDK (Multi-platform)
          - `sdk-go-linux-amd64.tar.gz` - Linux x64
          - `sdk-go-linux-arm64.tar.gz` - Linux ARM64
          - `sdk-go-darwin-amd64.tar.gz` - macOS Intel
          - `sdk-go-darwin-arm64.tar.gz` - macOS ARM64
          - `sdk-go-windows-amd64.tar.gz` - Windows x64

          ### C++ SDK (Multi-platform, Static + Dynamic)
          - `sdk-cpp-static-linux-x64.tar.gz` - Linux x64 static
          - `sdk-cpp-dynamic-linux-x64.tar.gz` - Linux x64 dynamic
          - `sdk-cpp-static-macos-x64.tar.gz` - macOS Intel static
          - `sdk-cpp-dynamic-macos-x64.tar.gz` - macOS Intel dynamic
          - `sdk-cpp-static-macos-arm64.tar.gz` - macOS ARM64 static
          - `sdk-cpp-dynamic-macos-arm64.tar.gz` - macOS ARM64 dynamic
          - `sdk-cpp-static-windows-x64-md.zip` - Windows x64 static (MD)
          - `sdk-cpp-dynamic-windows-x64-md.zip` - Windows x64 dynamic (MD)

          ### Other SDKs
          - `sdk-js.tar.gz` - JavaScript/TypeScript npm package
          - `sdk-python.tar.gz` - Python wheel
          - `sdk-csharp.tar.gz` - C# NuGet packages
          - `release-sdks.tar.gz` - All other SDKs bundle

          ### Dashboard
          - `dashboard.tar.gz` - Web UI bundle

          ## Installation

          ### Server/Agent
          ```bash
          tar -xzf croupier-bin-linux-amd64.tar.gz
          ./croupier-server --help
          ```

          ### Go SDK
          ```bash
          tar -xzf sdk-go-linux-amd64.tar.gz
          ```

          ### C++ SDK
          ```bash
          # Static linking
          tar -xzf sdk-cpp-static-linux-x64.tar.gz

          # Dynamic linking
          tar -xzf sdk-cpp-dynamic-linux-x64.tar.gz
          ```

          ---
          **Note**: This is an automated nightly build. Use at your own risk.
          EOF

      - name: Update nightly tag
        timeout-minutes: 5
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Create/Update Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          body_path: release-notes.md
          files: release-assets/*
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
