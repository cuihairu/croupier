name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 02:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: false

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version

      - name: Go mod download
        timeout-minutes: 5
        run: go mod download

      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: make build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $VERSION = "nightly-$(Get-Date -Format 'yyyyMMdd')"
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $LDFLAGS = "-X main.version=$VERSION -X main.buildTime=$BUILD_TIME -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./cmd/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./cmd/agent

      - name: Package binaries (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${TAR}" -C bin .

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = (go env GOOS)
          $GOARCH = (go env GOARCH)
          $ZIP = "release/croupier-bin-${GOOS}-${GOARCH}.zip"
          Compress-Archive -Path bin/* -DestinationPath $ZIP -Force

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: release/*
          retention-days: 7

  build-sdks:
    name: Build SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "sdks/go/go.mod"
          cache: true
          cache-dependency-path: sdks/go/go.sum

      - name: Build Go SDK
        timeout-minutes: 10
        working-directory: ./sdks/go
        run: |
          go mod download
          go build -v ./...

      - name: Package Go SDK source
        timeout-minutes: 5
        run: |
          cd sdks/go
          mkdir -p ../release-sdks
          tar --exclude='*_test.go' \
            --exclude='examples/**/*.test' \
            -czf ../release-sdks/sdk-go-src.tar.gz \
            go.mod \
            go.sum \
            version.go \
            pkg \
            scripts \
            examples \
            LICENSE \
            README.md \
            SECURITY.md

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@v6

      - name: Build JS SDK
        timeout-minutes: 15
        working-directory: ./sdks/js
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package JS SDK
        timeout-minutes: 5
        working-directory: ./sdks/js
        run: |
          rm -rf ../../release-sdks/js
          mkdir -p ../../release-sdks/js
          pnpm pack --pack-destination ../../release-sdks/js
          cd ../../release-sdks/js
          tar -czf ../sdk-js.tar.gz *.tgz

      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python SDK
        timeout-minutes: 15
        working-directory: ./sdks/python
        run: |
          pip install build
          python -m build

      - name: Package Python SDK
        timeout-minutes: 5
        working-directory: ./sdks/python
        run: |
          mkdir -p ../../release-sdks/python
          cp dist/*.whl ../../release-sdks/python/ 2>/dev/null || true
          cp dist/*.tar.gz ../../release-sdks/python/ 2>/dev/null || true
          cd ../../release-sdks/python
          tar -czf ../sdk-python.tar.gz *

      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build C# SDK
        timeout-minutes: 15
        working-directory: ./sdks/csharp
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Package C# SDK
        timeout-minutes: 5
        working-directory: ./sdks/csharp
        run: |
          mkdir -p ../../release-sdks/csharp
          find . -name "*.nupkg" -not -path "*/obj/*" -exec cp {} ../../release-sdks/csharp/ \; 2>/dev/null || true
          cd ../../release-sdks/csharp
          tar -czf ../sdk-csharp.tar.gz *

      - name: Create SDKs bundle
        timeout-minutes: 5
        run: |
          cd release-sdks
          tar -czf ../release-sdks.tar.gz *

      - name: Upload SDKs artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: sdks
          path: release-sdks.tar.gz
          retention-days: 7

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        timeout-minutes: 10
        working-directory: ./web
        run: pnpm run build

      - name: Package Dashboard
        timeout-minutes: 5
        run: |
          cd web
          tar -czf ../dashboard.tar.gz dist

      - name: Upload Dashboard artifact
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: dashboard.tar.gz
          retention-days: 7

  release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-binaries, build-sdks, build-dashboard]
    permissions:
      contents: write
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        timeout-minutes: 5
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        timeout-minutes: 5
        run: |
          mkdir -p release-assets

          # Copy binaries
          find artifacts/binaries-* -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts/binaries-* -name "*.zip" -exec cp {} release-assets/ \;

          # Copy SDKs
          cp artifacts/sdks/release-sdks.tar.gz release-assets/

          # Copy Dashboard
          cp artifacts/dashboard/dashboard.tar.gz release-assets/

          # Generate source archive
          git archive --format=tar.gz --output=release-assets/croupier-nightly-src.tar.gz HEAD

          ls -la release-assets/

      - name: Generate release notes
        timeout-minutes: 2
        run: |
          cat > release-notes.md << EOF
          # Nightly Build

          **Built**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: $(git rev-parse --short HEAD)
          **Branch**: main

          ## Contents

          - **Server/Agent Binaries**: \`darwin-arm64\`, \`linux-amd64\`, \`windows-amd64\`
          - **SDKs**: Go, JavaScript, Python, C#
          - **Dashboard**: Web UI bundle

          ## Installation

          Download the binary for your platform and extract:

          \`\`\`bash
          tar -xzf croupier-bin-linux-amd64.tar.gz
          ./croupier-server --help
          \`\`\`

          ---
          **Note**: This is an automated nightly build. Use at your own risk.
          EOF

      - name: Update nightly tag
        timeout-minutes: 5
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Create/Update Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v4
        with:
          tag_name: nightly
          name: Nightly
          body_path: release-notes.md
          files: release-assets/*
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
