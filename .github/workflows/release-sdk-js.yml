name: Release - JavaScript SDK

on:
  push:
    tags:
      - "sdk-js-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/js
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Determine SDK Version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-js-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi
          echo "sdk_version=$VERSION" >> "$GITHUB_OUTPUT"
      - timeout-minutes: 5
        uses: pnpm/action-setup@v6
        # Use the pnpm version pinned via package.json#packageManager.
      - timeout-minutes: 5
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('sdks/js/pnpm-lock.yaml') }}
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Build
        timeout-minutes: 15
        run: pnpm run build
      - name: Package
        timeout-minutes: 2
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          zip -r "artifacts/croupier-js-sdk-${{ steps.version.outputs.sdk_version }}.zip" dist package.json README.md LICENSE
      - name: Publish release assets
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          files: sdks/js/artifacts/*
          fail_on_unmatched_files: true
