name: Release SDK — JS

# JS SDK 发布到 npm。入口：release-sdk-matrix.yml（workflow_call，正式 tag
# 发布链）或手动 dispatch；本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# 源提交（AUD-078）：统一 checkout release-sdk-resolve.yml 解析出的 commit，
# 不再取触发 ref——触发分支领先 tag 时构建产物也只来自 tag 的源码。
# dry_run：演练模式——照常装依赖构建，但绝不执行 npm publish。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve version & pin source commit
    uses: ./.github/workflows/release-sdk-resolve.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
    secrets: inherit

  release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require NPM_TOKEN
        run: test -n "$NPM_TOKEN" || { echo "::error::缺少 secret NPM_TOKEN"; exit 1; }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set version & build
        run: |
          cd sdks/js
          npm version "${{ needs.resolve.outputs.version }}" --no-git-tag-version
          sed -i 's/^export const SDK_VERSION = ".*";/export const SDK_VERSION = "${{ needs.resolve.outputs.version }}";/' src/version.ts
          npm ci || npm install
          npm run build --if-present
      - name: Publish to npm
        if: ${{ ! inputs.dry_run }}
        run: npm publish --access public
        working-directory: sdks/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
