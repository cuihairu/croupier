name: Release SDK — JS

# JS SDK 发布到 npm。仅手动执行（workflow_dispatch），绝不自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""

permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$V" in
            v*) TAG="$V"; NUM="${V#v}" ;;
            *)   TAG="v$V"; NUM="$V" ;;
          esac
          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$NUM"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require NPM_TOKEN
        run: test -n "$NPM_TOKEN" || { echo "::error::缺少 secret NPM_TOKEN"; exit 1; }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set version, build & publish
        run: |
          cd sdks/js
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version
          sed -i 's/^export const SDK_VERSION = ".*";/export const SDK_VERSION = "${{ steps.ver.outputs.version }}";/' src/version.ts
          npm ci || npm install
          npm run build --if-present
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
