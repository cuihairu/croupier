name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto
        run: buf lint
      - name: Build protoc-gen-croupier
        run: make croupier-plugin
      - name: Generate proto
        run: buf generate
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          files=$(git ls-files -z '*.go' || true)
          if [[ -z "$files" ]]; then
            exit 0
          fi
          fmt_result=$(printf '%s' "$files" | xargs -0 gofmt -l)
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Lint Go code
        run: |
          go install golang.org/x/lint/golint@latest
          golint ./...
      - name: Vet Go code
        run: go vet ./...
