name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC (nightly)
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  build-go:
    name: Build Go Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          submodules: false
      - timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码无需本地生成
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: make build
      - name: Build (Windows, PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $VERSION = (git describe --tags --always --dirty)
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $LDFLAGS = "-X main.version=$VERSION -X main.buildTime=$BUILD_TIME -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./cmd/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./cmd/agent
      - name: Package binaries (Linux/Mac, tar.gz with OS/ARCH)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${TAR}" -C bin .
      - name: Package binaries (Windows, zip)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = (go env GOOS)
          $GOARCH = (go env GOARCH)
          $ZIP = "release/croupier-bin-$GOOS-$GOARCH.zip"
          Compress-Archive -Path bin/* -DestinationPath $ZIP -Force
      - name: Upload artifact (binaries)
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-binaries-${{ matrix.os }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  build-sdk-sources:
    name: Build SDK source packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
      # 六语言 SDK 是库而非二进制。发布中心（npm/PyPI/Maven/NuGet/Go module proxy）
      # 需要各自凭据与包名占位，超出默认 GITHUB_TOKEN 能力；Release 附件先提供
      # 确定性源码包：消费方解压后按各 SDK README 构建接入。
      - name: Pack SDK sources
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          tar --exclude='node_modules' --exclude='dist' --exclude='build' \
            --exclude='.gradle' --exclude='TestResults' --exclude='__pycache__' \
            --exclude='vcpkg' --exclude='vcpkg_installed' \
            -czf "release/croupier-sdk-go-${VERSION}.tar.gz" -C sdks/go .
          tar --exclude='node_modules' --exclude='dist' --exclude='coverage' \
            -czf "release/croupier-sdk-js-${VERSION}.tar.gz" -C sdks/js .
          tar --exclude='__pycache__' --exclude='*.egg-info' --exclude='dist' --exclude='build' \
            -czf "release/croupier-sdk-python-${VERSION}.tar.gz" -C sdks/python .
          tar --exclude='.gradle' --exclude='build' --exclude='TestResults' \
            -czf "release/croupier-sdk-java-${VERSION}.tar.gz" -C sdks/java .
          tar --exclude='TestResults' --exclude='bin' --exclude='obj' \
            -czf "release/croupier-sdk-csharp-${VERSION}.tar.gz" -C sdks/csharp .
          tar --exclude='vcpkg' --exclude='vcpkg_installed' --exclude='build' \
            -czf "release/croupier-sdk-cpp-${VERSION}.tar.gz" -C sdks/cpp .
          ls -lh release/
      - timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: croupier-sdk-sources-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go, build-sdk-sources]
    steps:
      - name: Download artifacts
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Nightly Release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'nightly')
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Tag Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
