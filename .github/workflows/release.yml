name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    # CR-FIX-04 (P0-4)：发布前强制质量门禁。CI 只在 push/PR 触发，tag push
    # 不重跑 ci.yml，故发布工作流须自行串跑全量测试 + e2e + 契约守卫；任一
    # 失败即拒绝出包（CI 红不出包）。
    name: Quality gate (tests + e2e + contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - timeout-minutes: 5
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
      - name: Install ripgrep
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          rg --version
      - name: Run release quality gate
        timeout-minutes: 50
        run: bash scripts/release-quality-gate.sh

  verify-version:
    name: Verify version consistency (refuse to publish on mismatch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: VERSION must equal the release tag and all SDK manifests
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 2
        run: bash scripts/check-version-sync.sh --expect-tag "${{ github.ref_name }}"
      - name: Check version consistency (dispatch run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        timeout-minutes: 2
        run: bash scripts/check-version-sync.sh

  build-go:
    name: Build Go Binaries (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - timeout-minutes: 5
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码无需本地生成
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: |
          # 版本注入以 VERSION 文件为唯一源（verify-version job 已校验 VERSION == tag == 6 SDK manifest）。
          # 曾用 git describe 重注绕过 VERSION 滞后（v0.1.5 实证 linux/darwin --version 恒 0.1.4），
          # 现守卫已在发布入口强制一致，重注补丁移除。
          make build
      - name: Build (Windows, PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          # 版本注入以 VERSION 文件为唯一源，与 Linux/Mac 的 make build 一致
          $VERSION = (Get-Content VERSION -Raw).Trim()
          if (-not $VERSION) { Write-Error "VERSION file empty"; exit 1 }
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $GIT_COMMIT = (git rev-parse --short HEAD)
          # 变量名须与 root.go 声明一致（Version/BuildTime/GitCommit 首字母大写）；
          # 小写形式 -X 静默 no-op，二进制恒 dev。
          $LDFLAGS = "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME -X main.GitCommit=$GIT_COMMIT -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./cmd/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./cmd/sidecar-agent
          foreach ($ROLE in @("devops", "capture", "synthetics")) {
            $ROLE_LDFLAGS = "$LDFLAGS -X github.com/cuihairu/croupier/agents/$ROLE/runner.Version=$VERSION -X github.com/cuihairu/croupier/agents/$ROLE/runner.GitCommit=$GIT_COMMIT -X github.com/cuihairu/croupier/agents/$ROLE/runner.BuildTime=$BUILD_TIME"
            go build -ldflags "$ROLE_LDFLAGS" -o "bin/$ROLE-agent.exe" "./cmd/$ROLE-agent"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package binaries (Linux/Mac, tar.gz with OS/ARCH)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          # 附带启动必需的默认配置与说明，用户解压即可 ./croupier-server server 起步
          STAGE="release/stage-${GOOS}-${GOARCH}"
          mkdir -p "${STAGE}"
          cp bin/* "${STAGE}/"
          mkdir -p "${STAGE}/configs"
          cp configs/server.yaml configs/agent.yaml "${STAGE}/configs/"
          # bootstrap 数据（管理员/游戏/RBAC 首启种子）
          cp configs/admins.json configs/games.json configs/permissions.json configs/rbac.json "${STAGE}/configs/" 2>/dev/null || true
          cp configs/default-policies.yaml "${STAGE}/configs/" 2>/dev/null || true
          cp README.md "${STAGE}/README.md" 2>/dev/null || true
          tar -czf "${TAR}" -C "${STAGE}" .
          rm -rf "${STAGE}"
      - name: Package binaries (Windows, zip)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = go env GOOS
          $GOARCH = go env GOARCH
          $ZIP = "release/croupier-bin-$GOOS-$GOARCH.zip"
          # 与 tar.gz 同构：二进制 + configs + README
          $STAGE = "release/stage-$GOOS-$GOARCH"
          New-Item -ItemType Directory -Force -Path $STAGE | Out-Null
          Copy-Item bin/* $STAGE/
          New-Item -ItemType Directory -Force -Path "$STAGE/configs" | Out-Null
          Copy-Item configs/server.yaml, configs/agent.yaml "$STAGE/configs/"
          foreach ($f in @("admins.json","games.json","permissions.json","rbac.json","default-policies.yaml")) {
            if (Test-Path "configs/$f") { Copy-Item "configs/$f" "$STAGE/configs/" }
          }
          if (Test-Path README.md) { Copy-Item README.md "$STAGE/README.md" }
          Compress-Archive -Path "$STAGE/*" -DestinationPath $ZIP -Force
          Remove-Item -Recurse -Force $STAGE
      - name: Setup Python for Agent packaging
        timeout-minutes: 3
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Package individual Agents
        timeout-minutes: 5
        shell: bash
        run: |
          python -m unittest discover -s scripts/tests -p 'test_package_agents.py'
          python scripts/package-agents.py --os "$(go env GOOS)" --arch "$(go env GOARCH)"
      - name: Upload artifact (binaries)
        timeout-minutes: 3
        uses: actions/upload-artifact@v7.0.2
        with:
          name: croupier-binaries-${{ matrix.os }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  build-sdk-sources:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-version]
    name: Build SDK source packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7.0.1
      # 六语言 SDK 是库而非二进制。发布中心（npm/PyPI/Maven/NuGet/Go module proxy）
      # 需要各自凭据与包名占位，超出默认 GITHUB_TOKEN 能力；Release 附件先提供
      # 确定性源码包：消费方解压后按各 SDK README 构建接入。
      - name: Pack SDK sources
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          tar --exclude='node_modules' --exclude='dist' --exclude='build' \
            --exclude='.gradle' --exclude='TestResults' --exclude='__pycache__' \
            --exclude='vcpkg' --exclude='vcpkg_installed' \
            -czf "release/croupier-sdk-go-${VERSION}.tar.gz" -C sdks/go .
          tar --exclude='node_modules' --exclude='dist' --exclude='coverage' \
            -czf "release/croupier-sdk-js-${VERSION}.tar.gz" -C sdks/js .
          tar --exclude='__pycache__' --exclude='*.egg-info' --exclude='dist' --exclude='build' \
            -czf "release/croupier-sdk-python-${VERSION}.tar.gz" -C sdks/python .
          tar --exclude='.gradle' --exclude='build' --exclude='TestResults' \
            -czf "release/croupier-sdk-java-${VERSION}.tar.gz" -C sdks/java .
          tar --exclude='TestResults' --exclude='bin' --exclude='obj' \
            -czf "release/croupier-sdk-csharp-${VERSION}.tar.gz" -C sdks/csharp .
          tar --exclude='vcpkg' --exclude='vcpkg_installed' --exclude='build' \
            -czf "release/croupier-sdk-cpp-${VERSION}.tar.gz" -C sdks/cpp .
          ls -lh release/
      - timeout-minutes: 5
        uses: actions/upload-artifact@v7.0.2
        with:
          name: croupier-sdk-sources-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go, build-sdk-sources, quality-gate]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        timeout-minutes: 3
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Generate SHA256SUMS for all artifacts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # 汇总所有发布产物摘要（CR-FIX-04）：下载物可校验，不再裸出包。
          # Release 附件按文件名平铺，清单也只保留 basename，保证用户下载后
          # 直接 `sha256sum -c SHA256SUMS` 即可校验（不能保留 artifacts/ 子目录）。
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.json' -o -name '*.sha256' \) \
            -print0 | xargs -0 sha256sum | awk '{ n = split($2, p, "/"); print $1 "  " p[n] }' > SHA256SUMS
          # 校验和清单本身也纳入签名，但清单不含自身（避免自引用）。
          ls -la SHA256SUMS
      - name: Create Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # 先建草稿：签名与清单上传成功后才公开，避免无签名产物先行可下载。
          draft: true
          files: |
            artifacts/**/*
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign release artifacts with cosign (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        uses: sigstore/cosign-installer@v4.1.2
      - name: cosign sign-blob SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # keyless OIDC：身份来自 job 的 id-token: write。签名 SHA256SUMS 清单
          # 即代表整批产物（每个文件摘要已列于清单内）。
          cosign sign-blob --yes SHA256SUMS > SHA256SUMS.sig
          echo "Signed:"
          ls -la SHA256SUMS.sig
          # 签名/清单上传失败必须让发布失败；成功后把草稿公开。
          gh release upload "${{ github.ref_name }}" SHA256SUMS SHA256SUMS.sig --clobber
      - name: Publish signed release
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
