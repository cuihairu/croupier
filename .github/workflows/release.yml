name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (nightly)
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - tag

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  build-go:
    name: Build Go Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install goctl
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Setup buf
        if: runner.os != 'Windows'
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf and grpc tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 使用固定版本的protoc (29.5) - 兼容 vcpkg protobuf 5.29.x
          PROTOC_VERSION="29.5"
          if [ "$RUNNER_OS" = "Linux" ]; then
            OS_ARCH="linux-x86_64"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # 检测Mac架构
            if [ "$(uname -m)" = "arm64" ]; then
              OS_ARCH="osx-aarch_64"
            else
              OS_ARCH="osx-x86_64"
            fi
          fi

          PROTOC_ZIP="protoc-${PROTOC_VERSION}-${OS_ARCH}.zip"
          wget "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          unzip -o "$PROTOC_ZIP" -d "$HOME/protoc"
          rm "$PROTOC_ZIP"
          echo "$HOME/protoc/bin" >> $GITHUB_PATH

          # 安装grpc插件
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y libgrpc++-dev protobuf-compiler-grpc
          elif command -v brew >/dev/null 2>&1; then
            brew update || true
            brew install grpc || true
          fi

          # 安装Go protoc插件（固定版本）
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

          # 安装Java gRPC插件
          GRPC_JAVA_VERSION="1.68.1"
          if [ "$RUNNER_OS" = "Linux" ]; then
            GRPC_JAVA_ARCH="linux-x86_64"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              GRPC_JAVA_ARCH="osx-aarch_64"
            else
              GRPC_JAVA_ARCH="osx-x86_64"
            fi
          fi
          wget "https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/${GRPC_JAVA_VERSION}/protoc-gen-grpc-java-${GRPC_JAVA_VERSION}-${GRPC_JAVA_ARCH}.exe" -O "$HOME/protoc/bin/protoc-gen-grpc-java"
          chmod +x "$HOME/protoc/bin/protoc-gen-grpc-java"

          # 安装 JS/TS protoc 插件
          npm install -g @bufbuild/protoc-gen-es @connectrpc/protoc-gen-connect-es

          # 验证版本
          "$HOME/protoc/bin/protoc" --version
      - name: Build protoc-gen-croupier
        if: runner.os != 'Windows'
        run: make croupier-plugin
      - name: Generate proto
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/go/bin:$PWD/bin:$PATH"
          buf generate
      - name: Go mod download
        run: go mod download
      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        run: make build
      - name: Build (Windows, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $VERSION = (git describe --tags --always --dirty)
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $LDFLAGS = "-X main.version=$VERSION -X main.buildTime=$BUILD_TIME -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./services/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./services/agent-stdlib
          go build -ldflags "$LDFLAGS" -o bin/croupier-edge.exe ./services/edge-stdlib
      - name: Package binaries (Linux/Mac, tar.gz with OS/ARCH)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${TAR}" -C bin .
      - name: Package binaries (Windows, zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = (go env GOOS)
          $GOARCH = (go env GOARCH)
          $ZIP = "release/croupier-bin-$GOOS-$GOARCH.zip"
          Compress-Archive -Path bin/* -DestinationPath $ZIP -Force
      - name: Upload artifact (binaries)
        uses: actions/upload-artifact@v4
        with:
          name: croupier-binaries-${{ matrix.os }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: 'pnpm'
            cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install deps
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build
      - name: Package dashboard (zip)
        run: |
          cd dashboard
          zip -r ../dashboard-dist.zip dist
      - name: Upload artifact (dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.run_number }}-${{ github.run_attempt }}
          path: dashboard-dist.zip
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-go, build-dashboard]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Nightly Release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'nightly')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Tag Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
