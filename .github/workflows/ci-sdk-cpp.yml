name: CI - C++ SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sdks/cpp/**'
      - '.github/workflows/ci-sdk-cpp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/cpp/**'
      - '.github/workflows/ci-sdk-cpp.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Clang
        timeout-minutes: 5
        uses:Kylelane/setup-clang@v1
        with:
          clang-version: '18'
      - name: Install clang-tidy
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
      - name: Run clang-tidy
        timeout-minutes: 10
        working-directory: sdks/cpp
        run: |
          find src -name '*.cpp' -o -name '*.cc' | xargs clang-tidy -- -Iinclude

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Configure CMake
        timeout-minutes: 5
        working-directory: sdks/cpp
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        timeout-minutes: 10
        working-directory: sdks/cpp/build
        run: make -j$(nproc)
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/cpp/build
        run: ctest --output-on-failure
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/build/coverage.info
          flags: cpp-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_generator: 'Unix Makefiles'
          - os: macos-latest
            cmake_generator: 'Unix Makefiles'
          - os: windows-latest
            cmake_generator: 'Visual Studio 17 2022'
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Install dependencies (Ubuntu)
        timeout-minutes: 5
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Install dependencies (macOS)
        timeout-minutes: 5
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake curl
      - name: Configure CMake
        timeout-minutes: 5
        working-directory: sdks/cpp
        run: |
          mkdir -p build
          cd build
          cmake .. -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=Release
        shell: bash
      - name: Build
        timeout-minutes: 10
        working-directory: sdks/cpp/build
        run: cmake --build . --config Release
        shell: bash
