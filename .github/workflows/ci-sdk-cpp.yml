name: CI - C++ SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - name: Clone vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git fetch --depth 1 origin "${{ env.VCPKG_COMMIT }}"
          git checkout "${{ env.VCPKG_COMMIT }}"
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: sdks/cpp/vcpkg_installed
          key: vcpkg-${{ env.VCPKG_COMMIT }}-x64-linux-${{ hashFiles('sdks/cpp/vcpkg.json') }}

      - name: Install vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: "${{ github.workspace }}/vcpkg/vcpkg" install --triplet x64-linux
        working-directory: sdks/cpp
        env:
          VCPKG_BINARY_SOURCES: "clear"

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCROUPIER_CI_BUILD=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL=OFF
        working-directory: sdks/cpp

      - name: Build and test
        run: make -j$(nproc) && ctest --output-on-failure
        working-directory: sdks/cpp/build

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/build/coverage.info
          flags: cpp-sdk
