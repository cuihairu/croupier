name: Build and Release C++ SDK

on:
  push:
    branches: [main, develop]
    tags:
      - "sdk-cpp-v*"
    paths:
      - ".github/workflows/ci-sdk-cpp.yml"
      - "proto/**"
      - "sdks/cpp/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-sdk-cpp.yml"
      - "proto/**"
      - "sdks/cpp/**"
  workflow_dispatch:
    inputs:
      tag:
        description: '指定 Tag 构建 (例如: sdk-cpp-v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: ./sdks/cpp
    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install clang tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17 clang-tidy-17
          sudo apt-get install -y build-essential ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-17 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-17 100

      - name: Check code formatting
        timeout-minutes: 10
        run: |
          echo "::group::Checking code formatting with clang-format"
          find src include examples tests -name '*.cpp' -o -name '*.h' | head -100 | while read file; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "Code formatting issues detected: $file"
            fi
          done
          echo "::endgroup::"

      - name: Run clang-format diff
        timeout-minutes: 10
        run: |
          echo "Files with formatting differences:"
          find src include examples tests -name '*.cpp' -o -name '*.h' | head -100 | xargs -I {} sh -c 'diff -u {} <(clang-format {}) || true' 2>/dev/null | head -200 || true

      - name: Run clang-tidy (basic checks)
        timeout-minutes: 10
        run: |
          echo "::group::Running clang-tidy static analysis"
          for file in src/*.cpp src/**/*.cpp; do
            # Skip optional bindings that require external dependencies
            if [[ "$file" == src/bindings/* ]]; then
              continue
            fi
            if [ -f "$file" ]; then
              echo "Checking: $file"
              clang-tidy "$file" \
                --quiet \
                -- -std=c++17 \
                   -I include \
                   -isystem generated \
                   2>/dev/null || echo "clang-tidy found issues: $file"
            fi
          done
          echo "::endgroup::"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build-type: [Release, Debug]
    defaults:
      run:
        working-directory: ./sdks/cpp

    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            sdks/cpp/vcpkg_installed
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('sdks/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        timeout-minutes: 5
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: x64-linux
        run: |
          bash "${{ github.workspace }}/sdks/cpp/scripts/bootstrap-vcpkg.sh" \
            "${{ github.workspace }}/sdks/cpp/vcpkg" \
            "2025.04.09"

      - name: Configure CMake
        timeout-minutes: 30
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Build
        timeout-minutes: 30
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        timeout-minutes: 10
        run: cd build && ctest --build-config ${{ matrix.build-type }} --output-on-failure --timeout 120

      - name: Upload artifacts
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-cpp-sdk-${{ matrix.build-type }}
          path: |
            build/bin/
            build/lib/

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./sdks/cpp
    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gcovr

      - name: Cache vcpkg binaries (coverage)
        uses: actions/cache@v4
        with:
          path: |
            sdks/cpp/vcpkg_installed
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-coverage-${{ hashFiles('sdks/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        timeout-minutes: 5
        shell: bash
        run: |
          bash "${{ github.workspace }}/sdks/cpp/scripts/bootstrap-vcpkg.sh" \
            "${{ github.workspace }}/sdks/cpp/vcpkg" \
            "2025.04.09"

      - name: Configure CMake (coverage)
        timeout-minutes: 30
        run: |
          cmake -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build (coverage)
        timeout-minutes: 30
        run: cmake --build build-coverage --config Debug --parallel

      - name: Test (coverage)
        timeout-minutes: 20
        run: cd build-coverage && ctest --build-config Debug --output-on-failure --parallel 2 --timeout 120

      - name: Generate coverage report
        timeout-minutes: 5
        run: |
          gcovr -r . \
            --xml-pretty -o coverage.xml \
            --filter '^(src|include)/' \
            --exclude 'build' \
            --exclude 'build-coverage' \
            --exclude 'vcpkg' \
            --exclude 'tests' \
            --gcov-ignore-parse-errors=negative_hits.warn

      - name: Upload coverage to Codecov
        if: success()
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/coverage.xml
          flags: cpp-sdk
          name: cpp-sdk-coverage
          fail_ci_if_error: false
          verbose: true

  # Release jobs - only run on tags
  version:
    if: |
      startsWith(github.ref, 'refs/tags/sdk-cpp-v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'sdk-cpp-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/cpp
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      is_tagged_release: ${{ steps.version.outputs.is_tagged_release }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate Version
        id: version
        timeout-minutes: 2
        run: |
          PACKAGE_VERSION=$(sed -n 's/^set(CROUPIER_SDK_VERSION "\(.*\)")/\1/p' VERSION.cmake)
          if [[ -z "$PACKAGE_VERSION" ]]; then
            echo "Failed to read version from VERSION.cmake"
            exit 1
          fi
          CURRENT_TAG=$(git tag --points-at HEAD | grep -E '^sdk-cpp-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          IS_TAGGED_RELEASE="false"

          if [[ -n "$CURRENT_TAG" ]]; then
            VERSION="${CURRENT_TAG#sdk-cpp-v}"
            if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($VERSION) does not match VERSION.cmake version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION_TAG="$CURRENT_TAG"
            IS_TAGGED_RELEASE="true"
            echo "Tagged release detected: $CURRENT_TAG"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG_INPUT="${{ inputs.tag }}"
            VERSION="${TAG_INPUT#sdk-cpp-v}"
            if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($VERSION) does not match VERSION.cmake version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION_TAG="$TAG_INPUT"
            IS_TAGGED_RELEASE="true"
          else
            VERSION="$PACKAGE_VERSION"
            VERSION_TAG="sdk-cpp-v${VERSION}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "is_tagged_release=${IS_TAGGED_RELEASE}" >> $GITHUB_OUTPUT

          echo "Generated version: ${VERSION}"
          echo "Generated tag: ${VERSION_TAG}"

  release-build:
    if: |
      startsWith(github.ref, 'refs/tags/sdk-cpp-v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'sdk-cpp-v'))
    needs: version
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Windows - MD (动态 CRT，推荐)
          - os: windows-latest
            arch: x64
            vcpkg_triplet: x64-windows-static-md
            artifact_name: windows-x64-md
            display_name: "Windows x64 (MD)"

          # Windows - MT (静态 CRT，独立应用)
          - os: windows-latest
            arch: x64
            vcpkg_triplet: x64-windows-static
            artifact_name: windows-x64-mt
            display_name: "Windows x64 (MT)"

          # Linux
          - os: ubuntu-latest
            arch: x64
            vcpkg_triplet: x64-linux
            artifact_name: linux-x64
            display_name: "Linux x64"

          # macOS Intel
          - os: macos-latest
            arch: x64
            vcpkg_triplet: x64-osx
            artifact_name: macos-x64
            display_name: "macOS x64"

          # macOS ARM64
          - os: macos-latest
            arch: arm64
            vcpkg_triplet: arm64-osx
            artifact_name: macos-arm64
            display_name: "macOS ARM64"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./sdks/cpp
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: "recursive"

      - name: Setup Windows Environment
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version
          cmake --version

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $installPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with C++ tools was not found."
          }

          $vsDevCmd = Join-Path $installPath "Common7/Tools/VsDevCmd.bat"
          $env:VSCMD_SKIP_SENDTELEMETRY = "1"

          cmd /c "`"$vsDevCmd`" -no_logo -arch=${{ matrix.arch }} -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^[^=]+=') {
                Add-Content -Path $env:GITHUB_ENV -Value $_
              }
            }

      - name: Setup Linux Environment
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Setup macOS Environment
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $scriptPath = Join-Path "${{ github.workspace }}" "sdks/cpp/scripts/bootstrap-vcpkg.ps1"
          $vcpkgRoot = Join-Path "${{ github.workspace }}" "sdks/cpp/vcpkg"
          & $scriptPath -VcpkgRoot $vcpkgRoot -VcpkgCommit "2025.04.09"

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          bash "${{ github.workspace }}/sdks/cpp/scripts/bootstrap-vcpkg.sh" \
            "${{ github.workspace }}/sdks/cpp/vcpkg" \
            "2025.04.09"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE="Release" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" -DVCPKG_HOST_TRIPLET="${{ matrix.vcpkg_triplet }}" -DVCPKG_BUILD_TYPE="release" -DCMAKE_INSTALL_PREFIX=install -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=ON -DBUILD_EXAMPLES=ON -DBUILD_TESTS=ON -DCPACK_PACKAGE_VERSION="${{ needs.version.outputs.version }}"

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        run: |
          BUILD_TESTS=ON
          BUILD_EXAMPLES=ON
          # macOS 交叉编译需要明确指定目标架构
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.arch }}" == "x64" ]]; then
              CMAKE_ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=x86_64"
            elif [[ "${{ matrix.arch }}" == "arm64" ]]; then
              CMAKE_ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/sdks/cpp/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/sdks/cpp/vcpkg-overlays" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DVCPKG_BUILD_TYPE=release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_EXAMPLES=${BUILD_EXAMPLES} \
            -DBUILD_TESTS=${BUILD_TESTS} \
            ${CMAKE_ARCH_ARGS} \
            -DCPACK_PACKAGE_VERSION="${{ needs.version.outputs.version }}"

      - name: Build SDK
        timeout-minutes: 20
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        if: matrix.arch == 'x64'
        timeout-minutes: 30
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PWD/build/bin:$PWD/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin:$PATH"
          fi
          cd build && ctest --build-config Release --output-on-failure --timeout 60
        shell: bash

      - name: Create Separate Static and Dynamic Packages
        timeout-minutes: 10
        run: |
          mkdir -p package-static package-dynamic
          cmake --install build --prefix package-install

          cp -r package-install/include package-static/ 2>/dev/null || true
          cp -r package-install/include package-dynamic/ 2>/dev/null || true
          cp -r package-install/share package-static/ 2>/dev/null || true
          cp -r package-install/share package-dynamic/ 2>/dev/null || true
          cp -r package-install/bin package-dynamic/ 2>/dev/null || true

          mkdir -p package-static/lib package-dynamic/lib

          find package-install -name "*.a" -exec cp {} package-static/lib/ \; 2>/dev/null || true
          find package-install -name "*.lib" -exec cp {} package-static/lib/ \; 2>/dev/null || true

          find package-install -name "*.so*" -exec cp {} package-dynamic/lib/ \; 2>/dev/null || true
          find package-install -name "*.dylib*" -exec cp {} package-dynamic/lib/ \; 2>/dev/null || true
          find package-install -name "*.dll" -exec cp {} package-dynamic/lib/ \; 2>/dev/null || true

          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'package-static/*' -DestinationPath 'croupier-cpp-sdk-static-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}.zip' -Force"
            powershell -Command "Compress-Archive -Path 'package-dynamic/*' -DestinationPath 'croupier-cpp-sdk-dynamic-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}.zip' -Force"
          else
            tar -czf "croupier-cpp-sdk-static-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}.tar.gz" -C package-static .
            tar -czf "croupier-cpp-sdk-dynamic-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}.tar.gz" -C package-dynamic .
          fi
        shell: bash

      - name: Upload Static Library Artifacts
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-cpp-sdk-static-${{ matrix.artifact_name }}
          path: croupier-cpp-sdk-static-*-${{ matrix.artifact_name }}.*
          retention-days: 30

      - name: Upload Dynamic Library Artifacts
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-cpp-sdk-dynamic-${{ matrix.artifact_name }}
          path: croupier-cpp-sdk-dynamic-*-${{ matrix.artifact_name }}.*
          retention-days: 30

  release:
    if: |
      startsWith(github.ref, 'refs/tags/sdk-cpp-v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'sdk-cpp-v'))
    needs: [version, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download All Static Artifacts
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          pattern: croupier-cpp-sdk-static-*
          path: static-artifacts/

      - name: Download All Dynamic Artifacts
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          pattern: croupier-cpp-sdk-dynamic-*
          path: dynamic-artifacts/

      - name: Prepare Release Assets
        timeout-minutes: 5
        run: |
          mkdir -p release_assets

          find static-artifacts/ -name "*.zip" -o -name "*.tar.gz" | while read file; do
            cp "$file" release_assets/
          done

          find dynamic-artifacts/ -name "*.zip" -o -name "*.tar.gz" | while read file; do
            cp "$file" release_assets/
          done

          echo "Release assets:"
          ls -la release_assets/
          echo ""
          echo "Package summary:"
          echo "Static packages: $(ls release_assets/*static* 2>/dev/null | wc -l)"
          echo "Dynamic packages: $(ls release_assets/*dynamic* 2>/dev/null | wc -l)"
          echo "Total packages: $(ls release_assets/*.* 2>/dev/null | wc -l)"

      - name: Generate Release Notes
        timeout-minutes: 2
        run: |
          cat << EOF > RELEASE_NOTES.md
          # Croupier C++ SDK ${{ needs.version.outputs.version }}

          ## Available Packages

          ### Static Library Packages
          - Windows: `croupier-cpp-sdk-static-*-windows-x64.zip`
          - Linux: `croupier-cpp-sdk-static-*-linux-x64.tar.gz`
          - macOS: `croupier-cpp-sdk-static-*-macos-x64.tar.gz`, `croupier-cpp-sdk-static-*-macos-arm64.tar.gz`

          ### Dynamic Library Packages
          - Windows: `croupier-cpp-sdk-dynamic-*-windows-x64.zip`
          - Linux: `croupier-cpp-sdk-dynamic-*-linux-x64.tar.gz`
          - macOS: `croupier-cpp-sdk-dynamic-*-macos-x64.tar.gz`, `croupier-cpp-sdk-dynamic-*-macos-arm64.tar.gz`

          ## Build Information
          - Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.run_id }}
          - Version Tag: ${{ needs.version.outputs.version_tag }}

          EOF

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v4
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          name: "Croupier C++ SDK ${{ needs.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
