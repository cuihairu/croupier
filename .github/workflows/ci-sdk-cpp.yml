name: CI - C++ SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_COMMIT: ce613c41372b23b1f51333815feb3edd87ef8a8b

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure CMake
        working-directory: sdks/cpp
        run: cmake --preset linux-x64-debug-tests-vcpkg

      - name: Build
        working-directory: sdks/cpp
        run: cmake --build --preset linux-x64-debug-tests

      - name: Test
        working-directory: sdks/cpp
        run: ctest --test-dir build/linux-x64-debug-tests-vcpkg --output-on-failure

      - name: Upload coverage
        if: ${{ hashFiles('sdks/cpp/build/linux-x64-debug-tests-vcpkg/coverage.info') != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/build/linux-x64-debug-tests-vcpkg/coverage.info
          flags: cpp-sdk
