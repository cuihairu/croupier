name: CI - C++ SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'sdks/cpp/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
        working-directory: sdks/cpp
      - run: make -j$(nproc) && ctest --output-on-failure
        working-directory: sdks/cpp/build
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/build/coverage.info
          flags: cpp-sdk
