name: Docs Check

# Lightweight docs gates that run independently of the VitePress build/deploy
# (docs-pages.yml): internal-link integrity and deprecated-term regression.
# Both checks are pure bash scripts under scripts/, so this job needs no
# Node/pnpm install and finishes in seconds.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'sdks/**/README.md'
      - 'scripts/check-docs-links.sh'
      - 'scripts/check-docs-terms.sh'
      - 'scripts/docs-terms-baseline.txt'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'sdks/**/README.md'
      - 'scripts/check-docs-links.sh'
      - 'scripts/check-docs-terms.sh'
      - 'scripts/docs-terms-baseline.txt'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7

      - name: Check internal markdown links
        timeout-minutes: 3
        run: ./scripts/check-docs-links.sh

      - name: Check deprecated terms regression
        timeout-minutes: 3
        run: ./scripts/check-docs-terms.sh
