name: Docs Check

# Lightweight docs gates that run independently of the VitePress build/deploy
# (docs-pages.yml): internal-link integrity, deprecated-term regression,
# architecture-asset drift (SVG XML, scoped links/evidence, README diagram
# refs, todo.md task DAG) and EN/zh locale parity. All checks are pure stdlib
# scripts, so this job needs no Node/pnpm install and finishes in seconds.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "sdks/**/README.md"
      - "scripts/check-docs-links.sh"
      - "scripts/check-docs-terms.sh"
      - "scripts/docs-terms-baseline.txt"
      - "scripts/docs/check-config-evidence.sh"
      - "scripts/docs/config-switch-evidence.sh"
      - "scripts/docs/config-evidence-capture.js"
      - "docs/public/evidence/**"
      - "scripts/docs/**"
      - "todo.md"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "sdks/**/README.md"
      - "scripts/check-docs-links.sh"
      - "scripts/check-docs-terms.sh"
      - "scripts/docs-terms-baseline.txt"
      - "scripts/docs/check-config-evidence.sh"
      - "scripts/docs/config-switch-evidence.sh"
      - "scripts/docs/config-evidence-capture.js"
      - "docs/public/evidence/**"
      - "scripts/docs/**"
      - "todo.md"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      - name: Check internal markdown links
        timeout-minutes: 3
        run: ./scripts/check-docs-links.sh

      - name: Check deprecated terms regression
        timeout-minutes: 3
        run: ./scripts/check-docs-terms.sh

      # DOC-001: 配置开关证据回归 — off/on 截图+GIF 产物存在且被双语页引用、
      # 路由-only 标志（extensions）无 GUI 证据目录。纯 stdlib，秒级完成。
      - name: Check config-switch evidence regression
        timeout-minutes: 3
        run: ./scripts/docs/check-config-evidence.sh

      # ARCH-020: 架构文档防漂移 — SVG XML、作用域内链接/证据路径、README SVG
      # 引用与 todo.md 任务 DAG（唯一 ID、依赖、无环、完成证据）。纯 stdlib，
      # 秒级完成，与 VitePress 构建解耦；作用域限定，不开启全站 strict。
      - name: Check architecture assets and TODO DAG
        timeout-minutes: 3
        run: python3 scripts/docs/check-architecture.py

      # CR-FIX-17: locale parity — the zh tree mirrors the EN tree page-for-page
      # (modulo srcExclude'd archive/review), zh sidebar carries every EN link's
      # /zh counterpart, and all sidebar links resolve. Pure stdlib, seconds.
      - name: Check locale parity (EN/zh)
        timeout-minutes: 3
        run: python3 scripts/docs/check-locale-parity.py
