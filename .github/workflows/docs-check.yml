name: Docs Check

# Lightweight docs gates that run independently of the VitePress build/deploy
# (docs-pages.yml): internal-link integrity, deprecated-term regression and
# architecture-asset drift (SVG XML, scoped links/evidence, README diagram
# refs, todo.md task DAG). All checks are pure stdlib scripts, so this job
# needs no Node/pnpm install and finishes in seconds.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "sdks/**/README.md"
      - "scripts/check-docs-links.sh"
      - "scripts/check-docs-terms.sh"
      - "scripts/docs-terms-baseline.txt"
      - "scripts/docs/**"
      - "todo.md"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "sdks/**/README.md"
      - "scripts/check-docs-links.sh"
      - "scripts/check-docs-terms.sh"
      - "scripts/docs-terms-baseline.txt"
      - "scripts/docs/**"
      - "todo.md"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      - name: Check internal markdown links
        timeout-minutes: 3
        run: ./scripts/check-docs-links.sh

      - name: Check deprecated terms regression
        timeout-minutes: 3
        run: ./scripts/check-docs-terms.sh

      # ARCH-020: 架构文档防漂移 — SVG XML、作用域内链接/证据路径、README SVG
      # 引用与 todo.md 任务 DAG（唯一 ID、依赖、无环、完成证据）。纯 stdlib，
      # 秒级完成，与 VitePress 构建解耦；作用域限定，不开启全站 strict。
      - name: Check architecture assets and TODO DAG
        timeout-minutes: 3
        run: python3 scripts/docs/check-architecture.py
