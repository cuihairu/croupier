name: CI - Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-dashboard.yml"
      - ".github/scripts/dashboard_guard.sh"
      - "scripts/dashboard_e2e_guard.sh"
      - "cmd/server/**"
      - "internal/**"
      - "web/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/ci-dashboard.yml"
      - ".github/scripts/dashboard_guard.sh"
      - "scripts/dashboard_e2e_guard.sh"
      - "cmd/server/**"
      - "internal/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Tag 构建 (例如: v1.0.0)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  dashboard-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Contract guard
        timeout-minutes: 2
        run: |
          test -f src/services/contracts/extensions.ts || (echo "missing generated contracts" && exit 1)
          test -f src/services/errors/codes.ts || (echo "missing error code mapping" && exit 1)

      - name: Dashboard model guard
        timeout-minutes: 2
        working-directory: .
        run: bash .github/scripts/dashboard_guard.sh

      - name: Lint dashboard product path
        timeout-minutes: 5
        run: |
          pnpm exec eslint \
            src/components/index.ts \
            src/components/PageRenderer/index.tsx \
            src/pages/Console/index.tsx \
            src/pages/Console/Page.tsx \
            src/pages/Functions/Detail.tsx \
            src/pages/Functions/Directory/index.tsx \
            src/pages/Functions/Invoke/index.tsx \
            src/pages/PageStudio/index.tsx \
            src/pages/ResourceCatalog/index.tsx \
            src/pages/Proposals/index.tsx \
            src/services/api/pages.ts \
            src/services/dashboard.ts \
            src/services/console.ts \
            src/types/dashboard.ts

      - name: Type check dashboard
        timeout-minutes: 5
        run: pnpm exec tsc --noEmit

  mock-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Mock E2E tests
        timeout-minutes: 15
        run: pnpm exec playwright test --project=mock-dashboard --reporter=list
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mock
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-mock
          path: web/test-results/
          retention-days: 7

  real-dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Dashboard E2E guard
        timeout-minutes: 2
        working-directory: .
        run: bash scripts/dashboard_e2e_guard.sh web/e2e

      - name: Run real Dashboard scenarios
        timeout-minutes: 25
        run: >-
          pnpm exec playwright test --project=real-dashboard --retries=0 --reporter=list
          --grep '@sdk-|@openapi-|@schema-change|@governance-change|@stale-|@safe-|@identity-|@republish-'
        env:
          CI: true
          REAL_DASHBOARD_FIXTURE: "1"

      - name: Upload real test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-dashboard
          path: web/playwright-report/
          retention-days: 7

      - name: Upload real test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-real-dashboard
          path: web/test-results/
          retention-days: 7

  docker-dashboard:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' && (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 5
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/croupier-dashboard

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          cache_dependency_path: web/pnpm-lock.yaml

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Build dist
        timeout-minutes: 10
        run: |
          pnpm run build
          test -s dist/index.html
          # utoopack splits bundles differently; check for any JS chunk >100k
          test "$(find dist -maxdepth 1 -name '*.js' -type f -size +100k | wc -l)" -ge 1

      - name: Build and push Docker image
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
