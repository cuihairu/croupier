name: CI - Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-dashboard.yml"
      - ".github/scripts/dashboard_guard.sh"
      - "scripts/dashboard_e2e_guard.sh"
      - "scripts/localized_text_guard.sh"
      - "cmd/server/**"
      - "internal/**"
      - "web/**"
      - "docker/Dockerfile.web"
      - "docker/nginx-main.conf"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/ci-dashboard.yml"
      - ".github/scripts/dashboard_guard.sh"
      - "scripts/dashboard_e2e_guard.sh"
      - "scripts/localized_text_guard.sh"
      - "cmd/server/**"
      - "internal/**"
      - "web/**"
      - "docker/Dockerfile.web"
      - "docker/nginx-main.conf"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Tag 构建 (例如: v1.0.0)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  dashboard-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Contract guard
        timeout-minutes: 2
        run: |
          test -f src/services/contracts/extensions.ts || (echo "missing generated contracts" && exit 1)
          test -f src/services/errors/codes.ts || (echo "missing error code mapping" && exit 1)

      - name: Dashboard model guard
        timeout-minutes: 2
        working-directory: .
        run: bash .github/scripts/dashboard_guard.sh

      - name: LocalizedText contract guard
        timeout-minutes: 2
        working-directory: .
        run: bash scripts/localized_text_guard.sh

      - name: Lint dashboard product path
        timeout-minutes: 5
        run: |
          pnpm exec eslint \
            src/components/index.ts \
            src/components/PageRenderer/index.tsx \
            src/pages/Console/index.tsx \
            src/pages/Console/Page.tsx \
            src/pages/Functions/Detail.tsx \
            src/pages/Functions/Directory/index.tsx \
            src/pages/Functions/Invoke/index.tsx \
            src/pages/PageStudio/index.tsx \
            src/pages/ResourceCatalog/index.tsx \
            src/pages/Proposals/index.tsx \
            src/services/api/pages.ts \
            src/services/dashboard.ts \
            src/services/console.ts \
            src/types/dashboard.ts

      - name: Type check dashboard
        timeout-minutes: 5
        run: pnpm exec tsc --noEmit

  mock-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 15
        id: pw_install
        run: pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        # azure.archive.ubuntu.com 区域镜像今天持续 Ign；切换到主源再装依赖
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -qq
          pnpm exec playwright install-deps chromium

      - name: Build mock web (production, MOCK=all)
        timeout-minutes: 12
        run: pnpm exec max build
        env:
          MOCK: all

      - name: Verify dist has console chunks
        run: |
          ls dist | head -5
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test "$(ls dist/*.async.js 2>/dev/null | wc -l)" -gt 10 || (echo "too few chunks" && exit 1)

      - name: Run Mock E2E tests
        timeout-minutes: 15
        run: pnpm exec playwright test --project=mock-dashboard --reporter=list
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mock
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-mock
          path: web/test-results/
          retention-days: 7

  real-dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 5
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        timeout-minutes: 15
        id: pw_install
        run: pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        # azure.archive.ubuntu.com 区域镜像今天持续 Ign；切换到主源再装依赖
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -qq
          pnpm exec playwright install-deps chromium

      - name: Install ripgrep
        timeout-minutes: 2
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Dashboard E2E guard
        timeout-minutes: 2
        working-directory: .
        run: bash scripts/dashboard_e2e_guard.sh web/e2e

      - name: Run real Dashboard scenarios
        timeout-minutes: 25
        run: >-
          pnpm exec playwright test --project=real-dashboard --retries=0 --reporter=list
          --grep '@sdk-|@openapi-|@schema-change|@governance-change|@stale-|@safe-|@identity-|@republish-'
        env:
          CI: true
          REAL_DASHBOARD_FIXTURE: "1"

      - name: Upload real test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-dashboard
          path: web/playwright-report/
          retention-days: 7

      - name: Upload real test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-real-dashboard
          path: web/test-results/
          retention-days: 7

  docker-dashboard:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' && (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - timeout-minutes: 5
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/croupier-dashboard

      - name: Build and push Docker image
        timeout-minutes: 25
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nginx config smoke test (nginx -t + healthcheck 冒烟)
        timeout-minutes: 5
        working-directory: .
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/croupier-dashboard:main"
          docker pull --quiet "${IMAGE}" >/dev/null
          # 1) 配置语法
          docker run --rm --entrypoint nginx "${IMAGE}" -t
          # 2) 容器起得来 + healthcheck 命令可用且 200（compose 同款 wget 探测）
          docker run -d --name dash-smoke --network bridge "${IMAGE}" >/dev/null
          sleep 3
          docker exec dash-smoke wget -qO- http://127.0.0.1/ >/dev/null
          docker rm -f dash-smoke >/dev/null
          echo "smoke OK"
