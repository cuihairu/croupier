name: CI - Java SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdks/java/**"]
  pull_request:
    branches: [main]
    paths: ["sdks/java/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'zoomies-pool' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: chmod +x gradlew || true
        working-directory: sdks/java
      - run: ./gradlew test jacocoTestReport
        working-directory: sdks/java
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java-sdk
          disable_search: true
