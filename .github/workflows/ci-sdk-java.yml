name: CI - Java SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sdks/java/**'
      - '.github/workflows/ci-sdk-java.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/java/**'
      - '.github/workflows/ci-sdk-java.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Java
        timeout-minutes: 5
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission
        timeout-minutes: 2
        working-directory: sdks/java
        run: chmod +x gradlew || true
      - name: Run checkstyle
        timeout-minutes: 10
        working-directory: sdks/java
        run: ./gradlew checkstyleMain checkstyleTest || true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Java
        timeout-minutes: 5
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission
        timeout-minutes: 2
        working-directory: sdks/java
        run: chmod +x gradlew || true
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/java
        run: ./gradlew test jacocoTestReport
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Java
        timeout-minutes: 5
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission
        timeout-minutes: 2
        working-directory: sdks/java
        run: chmod +x gradlew || true
      - name: Build
        timeout-minutes: 10
        working-directory: sdks/java
        run: ./gradlew build
