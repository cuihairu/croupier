name: Build and Release Java SDK

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags:
      - "sdk-java-v*"
    paths:
      - ".github/workflows/ci-sdk-java.yml"
      - "proto/**"
      - "sdks/java/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-sdk-java.yml"
      - "proto/**"
      - "sdks/java/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Tag 构建 (例如: sdk-java-v1.0.0)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        java-version: ["17", "21"]
    defaults:
      run:
        working-directory: ./sdks/java

    steps:
      - name: Checkout SDK repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Java JDK
        timeout-minutes: 5
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - name: Setup Gradle
        timeout-minutes: 5
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        timeout-minutes: 1
        run: chmod +x gradlew

      - name: Start croupier-agent
        timeout-minutes: 10
        run: |
          cd "${{ github.workspace }}"
          docker pull ghcr.io/cuihairu/croupier-agent:latest || docker compose -f docker/docker-compose.ci.yml build
          docker compose -f docker/docker-compose.ci.yml up -d

          for i in {1..60}; do
            if nc -z localhost 19090 2>/dev/null; then
              echo "Agent is ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Agent failed to start"
              docker compose -f docker/docker-compose.ci.yml logs
              exit 1
            fi
            sleep 1
          done

      # Proto 代码无需本地生成
      - name: Unit tests
        timeout-minutes: 15
        run: ./gradlew --no-daemon clean test jacocoTestReport

      - name: Integration tests
        timeout-minutes: 10
        run: ./gradlew --no-daemon test -Dintegration=true

      - name: Show agent logs (if test failed)
        if: failure()
        run: cd "${{ github.workspace }}" && docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop agent
        if: always()
        run: cd "${{ github.workspace }}" && docker compose -f docker/docker-compose.ci.yml down -v

      - name: Upload coverage to Codecov
        if: success() && matrix.java-version == '17'
        timeout-minutes: 5
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: java-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Upload artifacts
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: croupier-java-sdk-jdk${{ matrix.java-version }}
          path: |
            build/libs/*.jar

  publish:
    if: |
      startsWith(github.ref, 'refs/tags/sdk-java-v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'sdk-java-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: write
      packages: write

    defaults:
      run:
        working-directory: ./sdks/java

    steps:
      - name: Checkout SDK repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Determine SDK Version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(sed -n "s/^String baseVersion = '\\(.*\\)'/\\1/p" build.gradle)
          if [[ -z "$PACKAGE_VERSION" ]]; then
            echo "Failed to read baseVersion from build.gradle"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-java-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match build.gradle baseVersion ($PACKAGE_VERSION)"
              exit 1
            fi
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG_VERSION="${{ inputs.tag }}"
            TAG_VERSION="${TAG_VERSION#sdk-java-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match build.gradle baseVersion ($PACKAGE_VERSION)"
              exit 1
            fi
          fi

      - name: Set up Java
        timeout-minutes: 5
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        timeout-minutes: 1
        run: chmod +x gradlew

      - name: Run tests
        timeout-minutes: 10
        run: ./gradlew --no-daemon test

      - name: Build
        timeout-minutes: 15
        run: ./gradlew --no-daemon clean build

      - name: Import GPG key
        timeout-minutes: 5
        uses: crazy-max/ghaction-import-gpg@v8
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}

      - name: Publish to Maven Central
        timeout-minutes: 10
        run: ./gradlew --no-daemon publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}

      - name: Package
        timeout-minutes: 2
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/build/*" -exec cp {} artifacts/ \;
          find build/libs -name "*.jar" -exec cp {} artifacts/ \;

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          files: sdks/java/artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
