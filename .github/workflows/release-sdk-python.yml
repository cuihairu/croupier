name: Release - Python SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --dev --all-extras

      - name: Run tests
        timeout-minutes: 10
        run: uv run pytest -q

      - name: Build wheel and sdist
        timeout-minutes: 10
        run: uv build

      - name: Package
        timeout-minutes: 2
        run: |
          mkdir -p artifacts
          cp dist/* artifacts/

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
