name: Release - Python SDK

on:
  push:
    tags:
      - "sdk-python-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/python
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Determine SDK Version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python3 -c 'import pathlib, tomllib; data = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); print(data["project"]["version"])')
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-python-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PACKAGE_VERSION)"
              exit 1
            fi
          fi

      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "sdks/python/pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --dev --all-extras

      - name: Run tests
        timeout-minutes: 10
        run: uv run pytest -q

      - name: Build wheel and sdist
        timeout-minutes: 10
        run: uv build

      - name: Package
        timeout-minutes: 2
        run: |
          mkdir -p artifacts
          cp dist/* artifacts/

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v4
        with:
          files: sdks/python/artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
