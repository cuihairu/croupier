name: CI - Plugin SDK (Python)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdks/plugins/python/**", "sdks/plugins/hostdriver/**"]
  pull_request:
    branches: [main]
    paths: ["sdks/plugins/python/**", "sdks/plugins/hostdriver/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The integration suite builds the Go hostdriver and drives the real
      # plugin hosts against the Python plugins; the Go toolchain is part
      # of the fixture, not an implementation dependency.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
      - run: pip install -e '.[dev]'
        working-directory: sdks/plugins/python
      - run: pytest -v
        working-directory: sdks/plugins/python
