name: Build and Release Go SDK

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags:
      - "sdk-go-v*"
    paths:
      - ".github/workflows/ci-sdk-go.yml"
      - "proto/**"
      - "sdks/go/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-sdk-go.yml"
      - "proto/**"
      - "sdks/go/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Tag 构建 (例如: sdk-go-v1.0.0)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache: true
          cache-dependency-path: sdks/go/go.sum

      - name: Download dependencies
        timeout-minutes: 5
        working-directory: ./sdks/go
        run: |
          go mod tidy
          go mod download

      # Proto 代码无需本地生成
      - name: Build SDK
        timeout-minutes: 15
        working-directory: ./sdks/go
        run: go build -v ./...

      - name: Create agent config
        timeout-minutes: 2
        run: |
          cat > /tmp/agent-ci.yaml << 'EOF'
          name: croupier-agent
          host: 0.0.0.0
          port: 19090

          server:
            addr: ""
            insecure: true

          agent:
            id: "ci-test-agent"
            gameId: "ci-test-game"
            env: "testing"
            localAddr: "0.0.0.0:19090"
            httpAddr: "0.0.0.0:19090"

          upstream:
            heartbeatInterval: 30
            retryInterval: 5
            maxRetries: 0
            timeout: 5000

          tls:
            enabled: false

          outboundTLS:
            enabled: false
          EOF

      - name: Start croupier-agent
        timeout-minutes: 10
        run: |
          cd "${{ github.workspace }}"
          docker pull ghcr.io/cuihairu/croupier-agent:latest || \
          docker compose -f docker/docker-compose.ci.yml build
          docker compose -f docker/docker-compose.ci.yml up -d

          for i in {1..60}; do
            if nc -z localhost 19090 2>/dev/null; then
              echo "Agent is ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Agent failed to start"
              docker compose -f docker/docker-compose.ci.yml logs
              exit 1
            fi
            sleep 1
          done

      - name: Run tests with coverage
        timeout-minutes: 20
        working-directory: ./sdks/go
        run: |
          # Run tests including integration tests (agent is started via docker-compose)
          # Exclude proto-generated code in pkg/pb from coverage
          go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./pkg/croupier/... ./pkg/croupier
          go test -v -race ./pkg/...

          # Filter out pkg/pb from coverage report
          if [ -f coverage.out ]; then
            grep -v "^github.com/cuihairu/croupier/sdks/go/pkg/pb/" coverage.out > coverage.filtered.out || true
            if [ -s coverage.filtered.out ]; then
              mv coverage.filtered.out coverage.out
            fi
          fi

      - name: Show agent logs (if test failed)
        if: failure()
        run: docker compose -f docker/docker-compose.ci.yml logs

      - name: Stop agent
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v

      - name: Upload coverage to Codecov
        if: success()
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/go/coverage.out
          flags: go-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Build examples
        timeout-minutes: 15
        working-directory: ./sdks/go
        run: go build -v ./examples/...

  publish:
    if: |
      startsWith(github.ref, 'refs/tags/sdk-go-v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'sdk-go-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./sdks/go

    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false

      - name: Determine SDK Version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go)
          if [[ -z "$PACKAGE_VERSION" ]]; then
            echo "Failed to read version from version.go"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-go-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match version.go version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG_VERSION="${{ inputs.tag }}"
            TAG_VERSION="${TAG_VERSION#sdk-go-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match version.go version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi
          echo "sdk_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod

      - name: Add Go bin to PATH
        timeout-minutes: 1
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install protoc
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate proto (CI mode)
        timeout-minutes: 10
        env:
          CROUPIER_CI_BUILD: "1"
        run: go run ./scripts/generate_proto.go

      - name: Go mod download
        timeout-minutes: 5
        run: go mod download

      - name: Run tests
        timeout-minutes: 10
        run: go test ./...

      - name: Build
        timeout-minutes: 15
        run: |
          go build ./...

      - name: Package
        timeout-minutes: 5
        run: |
          mkdir -p artifacts
          tar --exclude='*_test.go' \
            --exclude='examples/**/*.test' \
            -czf "artifacts/croupier-go-sdk-${{ steps.version.outputs.sdk_version }}.tar.gz" \
            go.mod \
            go.sum \
            version.go \
            pkg \
            scripts \
            examples \
            LICENSE \
            README.md \
            SECURITY.md

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          files: sdks/go/artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
