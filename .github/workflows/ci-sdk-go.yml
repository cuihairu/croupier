name: CI - Go SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdks/go/**", "proto/**"]
  pull_request:
    branches: [main]
    paths: ["sdks/go/**", "proto/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: sdks/go
      - name: Filter non-library entrypoints from coverage
        # codecov action 不读取子目录的 codecov.yml，这里手工实现 sdks/go/
        # codecov.yml 声明的 ignore 意图：生成的 protobuf（pkg/pb）、main()
        # 入口（cmd 与全部 examples demo）不属于 SDK 库 API，上传前剔除。
        run: |
          cd sdks/go
          grep -vE 'cmd/|scripts/|examples/|http_invoker_example/|pkg/pb/' coverage.out > coverage.lib.out
          mv coverage.lib.out coverage.out
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/go/coverage.out
          flags: go-sdk
          disable_search: true
