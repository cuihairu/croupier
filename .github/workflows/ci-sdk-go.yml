name: CI - Go SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdks/go/**"]
  pull_request:
    branches: [main]
    paths: ["sdks/go/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: sdks/go
      - name: Filter non-library entrypoints from coverage
        # codecov action 不读取子目录的 codecov.yml；main() 入口与代码生成
        # 脚本不属于库 API，先在上传前从 profile 中剔除（与 pkg/pb 同理）。
        run: |
          cd sdks/go
          grep -vE 'cmd/|scripts/|examples/basic/|examples/comprehensive/' coverage.out > coverage.lib.out
          mv coverage.lib.out coverage.out
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/go/coverage.out
          flags: go-sdk
          disable_search: true
