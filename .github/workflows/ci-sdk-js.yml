name: CI - JavaScript SDK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'sdks/js/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'sdks/js/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v7
        with:
          package_json_file: sdks/js/package.json
      - uses: actions/setup-node@v7.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'sdks/js/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
        working-directory: sdks/js
      - run: pnpm test:coverage
        working-directory: sdks/js
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/js/coverage/lcov.info
          flags: js-sdk
