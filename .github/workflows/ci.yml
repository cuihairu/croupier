name: CI - Server & Agent

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'cmd/**'
      - 'configs/**'
      - 'database/**'
      - 'descriptors/**'
      - 'examples/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - 'pkg/**'
      - 'proto/**'
      - 'scripts/**'
      - 'tools/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'cmd/**'
      - 'configs/**'
      - 'database/**'
      - 'descriptors/**'
      - 'examples/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - 'pkg/**'
      - 'proto/**'
      - 'scripts/**'
      - 'tools/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Architecture guard
        timeout-minutes: 5
        run: bash .github/scripts/architecture_guard.sh
      - name: Contracts guard
        timeout-minutes: 5
        run: bash .github/scripts/contracts_guard.sh
      - name: API response guard
        timeout-minutes: 5
        run: bash .github/scripts/api_response_guard.sh
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install buf
        timeout-minutes: 5
        shell: bash
        env:
          BUF_VERSION: '1.47.2'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$RUNNER_TEMP/bin/buf"
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version
      - name: Lint proto
        timeout-minutes: 5
        run: buf lint proto
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Check gofmt
        timeout-minutes: 5
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        timeout-minutes: 5
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install govulncheck
        timeout-minutes: 5
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Run govulncheck
        timeout-minutes: 10
        run: |
          echo "Running Go vulnerability scan..."
          ~/go/bin/govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码无需本地生成
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Prepare storage directory
        timeout-minutes: 1
        run: mkdir -p data/uploads
      - name: Unit tests
        timeout-minutes: 10
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

  e2e:
    name: E2E Tests
    if: ${{ false }} # Temporarily disabled: health-check endpoint expectation is unstable in CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Setup E2E scripts
        timeout-minutes: 1
        run: chmod +x scripts/e2e/*.sh
      - name: Start Server
        timeout-minutes: 15
        run: |
          go build -o bin/croupier-server ./cmd/server
          mkdir -p data/uploads
          ./bin/croupier-server --config configs/server.yaml &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:18780/healthz > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
      - name: Run E2E tests
        timeout-minutes: 10
        env:
          SERVER_URL: http://localhost:18780
        run: |
          bash scripts/e2e/health-check.sh
          bash scripts/e2e/test-performance.sh
      - name: Cleanup
        timeout-minutes: 2
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
