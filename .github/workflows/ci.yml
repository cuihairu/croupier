name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto
        run: buf lint
      - name: Build protoc-gen-croupier
        run: make croupier-plugin
      - name: Generate proto
        run: buf generate
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build protoc-gen-croupier
        run: make croupier-plugin
      - name: Generate proto
        run: buf generate
      - name: Go mod download
        run: go mod download
      - name: Prepare storage directory
        run: mkdir -p data/uploads
      - name: Clear test cache
        run: go clean -testcache
      - name: Unit tests
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 ./...
