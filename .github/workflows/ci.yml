name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install additional build tools
        run: |
          # 安装 protoc-gen-croupier (自定义插件)
          make croupier-plugin
      - name: Clone proto repository
        run: |
          git clone --depth 1 https://github.com/cuihairu/croupier-proto.git proto
      - name: Lint proto
        run: buf lint proto
      - name: Generate proto
        run: |
          export PATH="$HOME/go/bin:$PATH"
          # 首先生成核心的Go proto代码（--clean 会删除之前生成但现已不存在的文件）
          buf generate proto --template buf.gen.simple.yaml --clean
          # 然后尝试生成所有SDK代码（如果有错误则忽略）
          buf generate proto --clean || echo "Some SDK plugins failed to generate, continuing..."
          # 生成主仓库独有的 proto（如 platform/）
          buf generate . --clean
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install additional build tools
        run: |
          # 安装 protoc-gen-croupier (自定义插件)
          make croupier-plugin
      - name: Clone proto repository
        run: |
          git clone --depth 1 https://github.com/cuihairu/croupier-proto.git proto
      - name: Generate proto
        run: |
          export PATH="$HOME/go/bin:$PATH"
          # 首先生成核心的Go proto代码（--clean 会删除之前生成但现已不存在的文件）
          buf generate proto --template buf.gen.simple.yaml --clean
          # 然后尝试生成所有SDK代码（如果有错误则忽略）
          buf generate proto --clean || echo "Some SDK plugins failed to generate, continuing..."
      - name: Go mod download
        run: go mod download
      - name: Prepare storage directory
        run: mkdir -p data/uploads
      - name: Clear test cache
        run: go clean -testcache
      - name: Unit tests
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
