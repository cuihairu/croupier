name: CI - Server & Agent

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "cmd/**"
      - "configs/**"
      - "database/**"
      - "descriptors/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "migrations/**"
      - "pkg/**"
      - "proto/**"
      - "scripts/**"
      - "tools/**"
      - "docker/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "cmd/**"
      - "configs/**"
      - "database/**"
      - "descriptors/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "migrations/**"
      - "pkg/**"
      - "proto/**"
      - "scripts/**"
      - "tools/**"
      - "docker/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Tag 构建 (例如: v1.0.0)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Architecture guard
        timeout-minutes: 5
        run: bash .github/scripts/architecture_guard.sh
      - name: Contracts guard
        timeout-minutes: 5
        run: bash .github/scripts/contracts_guard.sh
      - name: API response guard
        timeout-minutes: 5
        run: bash .github/scripts/api_response_guard.sh
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install buf
        timeout-minutes: 5
        shell: bash
        env:
          BUF_VERSION: "1.47.2"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$RUNNER_TEMP/bin/buf"
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version
      - name: Lint proto
        timeout-minutes: 5
        run: buf lint proto
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Check gofmt
        timeout-minutes: 5
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        timeout-minutes: 5
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install govulncheck
        timeout-minutes: 5
        run: |
          if ! command -v govulncheck &>/dev/null; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          else
            echo "govulncheck already installed: $(govulncheck -help 2>&1 | head -1)"
          fi
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Run govulncheck
        timeout-minutes: 10
        run: |
          echo "Running Go vulnerability scan..."
          ~/go/bin/govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码无需本地生成
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Prepare storage directory
        timeout-minutes: 1
        run: mkdir -p data/uploads
      - name: Unit tests
        timeout-minutes: 10
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: |
          # Run tests with coverage, excluding proto-generated code in pkg/pb
          go test -count=1 -coverprofile=coverage.out -covermode=atomic \
            -coverpkg=./cmd/...,./internal/...,./pkg/protocol/... ./...

          # Filter out pkg/pb from coverage report
          if [ -f coverage.out ]; then
            grep -v "^pkg/pb/" coverage.out > coverage.filtered.out || true
            if [ -s coverage.filtered.out ]; then
              mv coverage.filtered.out coverage.out
            fi
          fi

      - name: Upload coverage to Codecov
        if: success()
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

  e2e:
    name: E2E Tests
    if: ${{ false }} # Temporarily disabled: health-check endpoint expectation is unstable in CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Setup E2E scripts
        timeout-minutes: 1
        run: chmod +x scripts/e2e/*.sh
      - name: Start Server
        timeout-minutes: 15
        run: |
          go build -o bin/croupier-server ./cmd/server
          mkdir -p data/uploads
          ./bin/croupier-server --config configs/server.yaml &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:18780/healthz > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
      - name: Run E2E tests
        timeout-minutes: 10
        env:
          SERVER_URL: http://localhost:18780
        run: |
          bash scripts/e2e/health-check.sh
          bash scripts/e2e/test-performance.sh
      - name: Cleanup
        timeout-minutes: 2
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  # Docker build jobs
  docker-server:
    name: Docker - Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/croupier-server
      - name: Build and push Docker image
        timeout-minutes: 15
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Make GHCR package public (server)
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}
          PKG: croupier-server
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Ensuring GHCR package visibility: ghcr.io/${GH_OWNER}/${PKG} -> public"
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi

  docker-agent:
    name: Docker - Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/croupier-agent
      - name: Build and push Docker image
        timeout-minutes: 15
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Make GHCR package public (agent)
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}
          PKG: croupier-agent
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Ensuring GHCR package visibility: ghcr.io/${GH_OWNER}/${PKG} -> public"
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi

  # Release job - only run on tags or manual dispatch with tag input
  build-go:
    name: Build Go Binaries (${{ matrix.os }})
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false
      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码无需本地生成
      - name: Go mod download
        timeout-minutes: 5
        run: go mod download
      - name: Build (Linux/Mac)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: make build
      - name: Build (Windows, PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $VERSION = (git describe --tags --always --dirty)
          $BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH:mm:ss")
          $LDFLAGS = "-X main.version=$VERSION -X main.buildTime=$BUILD_TIME -s -w"
          go build -tags "pg sqlite" -ldflags "$LDFLAGS" -o bin/croupier-server.exe ./cmd/server
          go build -ldflags "$LDFLAGS" -o bin/croupier-agent.exe ./cmd/agent
      - name: Package binaries (Linux/Mac, tar.gz with OS/ARCH)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p release
          GOOS=$(go env GOOS)
          GOARCH=$(go env GOARCH)
          TAR="release/croupier-bin-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${TAR}" -C bin .
      - name: Package binaries (Windows, zip)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $GOOS = (go env GOOS)
          $GOARCH = (go env GOARCH)
          $ZIP = "release/croupier-bin-$GOOS-$GOARCH.zip"
          Compress-Archive -Path bin/* -DestinationPath $ZIP -Force
      - name: Upload artifact (binaries)
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: croupier-binaries-${{ matrix.os }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create Release
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (inputs.tag != '' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Tag Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Manual Dispatch Release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
