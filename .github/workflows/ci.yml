name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf and grpc tools
        run: |
          # 使用固定版本的protoc (29.5) - 兼容 vcpkg protobuf 5.29.x
          PROTOC_VERSION="29.5"
          PROTOC_ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          wget "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          unzip -o "$PROTOC_ZIP" -d "$HOME/protoc"
          rm "$PROTOC_ZIP"
          echo "$HOME/protoc/bin" >> $GITHUB_PATH

          # 安装grpc c++插件（使用系统包，版本兼容性较好）
          sudo apt-get update -y
          sudo apt-get install -y libgrpc++-dev protobuf-compiler-grpc

          # 安装Go protoc插件（固定版本）
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

          # 安装Java gRPC插件
          GRPC_JAVA_VERSION="1.68.1"
          wget "https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/${GRPC_JAVA_VERSION}/protoc-gen-grpc-java-${GRPC_JAVA_VERSION}-linux-x86_64.exe" -O "$HOME/protoc/bin/protoc-gen-grpc-java"
          chmod +x "$HOME/protoc/bin/protoc-gen-grpc-java"

          # 安装 Python grpc插件
          pip install grpcio-tools

          # 安装 JS/TS protoc 插件
          npm install -g @bufbuild/protoc-gen-es @connectrpc/protoc-gen-connect-es

          # 验证安装
          "$HOME/protoc/bin/protoc" --version
          which grpc_cpp_plugin || echo "grpc_cpp_plugin not found"
          which protoc-gen-grpc-java || echo "protoc-gen-grpc-java not found"
          which protoc-gen-es || echo "protoc-gen-es not found"
          which protoc-gen-connect-es || echo "protoc-gen-connect-es not found"
      - name: Clone proto repository
        run: |
          git clone --depth 1 https://github.com/cuihairu/croupier-proto.git proto
      - name: Lint proto
        run: buf lint proto
      - name: Build protoc-gen-croupier
        run: make croupier-plugin
      - name: Generate proto
        run: |
          export PATH="$HOME/go/bin:$PWD/bin:$HOME/protoc/bin:$PATH"
          # 首先生成核心的Go proto代码（--clean 会删除之前生成但现已不存在的文件）
          buf generate proto --template buf.gen.simple.yaml --clean
          # 然后尝试生成所有SDK代码（如果有错误则忽略）
          buf generate proto --clean || echo "Some SDK plugins failed to generate, continuing..."
          # 生成主仓库独有的 proto（如 platform/）
          buf generate . --clean
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf and grpc tools
        run: |
          # 使用固定版本的protoc (29.5) - 兼容 vcpkg protobuf 5.29.x
          PROTOC_VERSION="29.5"
          PROTOC_ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          wget "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          unzip -o "$PROTOC_ZIP" -d "$HOME/protoc"
          rm "$PROTOC_ZIP"
          echo "$HOME/protoc/bin" >> $GITHUB_PATH

          # 安装grpc c++插件（使用系统包）
          sudo apt-get update -y
          sudo apt-get install -y libgrpc++-dev protobuf-compiler-grpc

          # 安装Go protoc插件（固定版本）
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

          # 安装Java gRPC插件
          GRPC_JAVA_VERSION="1.68.1"
          wget "https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/${GRPC_JAVA_VERSION}/protoc-gen-grpc-java-${GRPC_JAVA_VERSION}-linux-x86_64.exe" -O "$HOME/protoc/bin/protoc-gen-grpc-java"
          chmod +x "$HOME/protoc/bin/protoc-gen-grpc-java"

          # 安装 Python grpc插件
          pip install grpcio-tools

          # 安装 JS/TS protoc 插件
          npm install -g @bufbuild/protoc-gen-es @connectrpc/protoc-gen-connect-es

          # 验证版本
          "$HOME/protoc/bin/protoc" --version
          which protoc-gen-grpc-java || echo "protoc-gen-grpc-java not found"
          which protoc-gen-es || echo "protoc-gen-es not found"
          which protoc-gen-connect-es || echo "protoc-gen-connect-es not found"
      - name: Build protoc-gen-croupier
        run: make croupier-plugin
      - name: Generate proto
        run: |
          export PATH="$HOME/go/bin:$PWD/bin:$HOME/protoc/bin:$PATH"
          # 首先生成核心的Go proto代码（--clean 会删除之前生成但现已不存在的文件）
          buf generate proto --template buf.gen.simple.yaml --clean
          # 然后尝试生成所有SDK代码（如果有错误则忽略）
          buf generate proto --clean || echo "Some SDK plugins failed to generate, continuing..."
      - name: Go mod download
        run: go mod download
      - name: Prepare storage directory
        run: mkdir -p data/uploads
      - name: Clear test cache
        run: go clean -testcache
      - name: Unit tests
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
