name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Normalize Go toolchain env
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto
        run: buf lint proto
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: cuihairu/croupier-sdk-go
          path: ./croupier-sdk-go
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Normalize Go toolchain env
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: cuihairu/croupier-sdk-go
          path: ./croupier-sdk-go
      - name: Go mod download
        run: go mod download
      - name: Run govulncheck
        run: |
          echo "Running government vulnerability check..."
          ~/go/bin/govulncheck ./...
      - name: Check for vulnerabilities
        run: |
          echo "Checking for security vulnerabilities..."
          if ~/go/bin/govulncheck ./... | grep -q "Vulnerability"; then
            echo "❌ Security vulnerabilities found!"
            exit 1
          else
            echo "✅ No vulnerabilities found"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Normalize Go toolchain env
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      # Proto 代码由 croupier-proto 的 sync-sdks workflow 同步，无需本地生成
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: cuihairu/croupier-sdk-go
          path: ./croupier-sdk-go
      - name: Go mod download
        run: go mod download
      - name: Prepare storage directory
        run: mkdir -p data/uploads
      - name: Unit tests
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  e2e:
    name: E2E Tests
    if: ${{ false }} # Temporarily disabled: health-check endpoint expectation is unstable in CI
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Normalize Go toolchain env
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
          go env GOROOT GOTOOLDIR GOVERSION GOOS GOARCH
      - name: Setup E2E scripts
        run: chmod +x scripts/e2e/*.sh
      - name: Start Server
        run: |
          go build -o bin/croupier-server ./services/server
          mkdir -p data/uploads
          ./bin/croupier-server --config services/server/etc/server.yaml &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:18780/healthz > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
      - name: Run E2E tests
        env:
          SERVER_URL: http://localhost:18780
        run: |
          bash scripts/e2e/health-check.sh
          bash scripts/e2e/test-performance.sh
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
