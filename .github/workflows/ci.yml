name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone proto repository
        run: |
          git clone --depth 1 https://github.com/cuihairu/croupier-proto.git proto
      - name: Lint proto
        run: buf lint proto
      - name: Go mod download
        run: go mod download
      - name: Check gofmt
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z '*.go' || true)
          if [[ ${#go_files[@]} -eq 0 ]]; then
            exit 0
          fi
          fmt_result=$(gofmt -l "${go_files[@]}")
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go mod download
        run: go mod download
      - name: Run govulncheck
        run: |
          echo "Running government vulnerability check..."
          ~/go/bin/govulncheck ./...
      - name: Check for vulnerabilities
        run: |
          echo "Checking for security vulnerabilities..."
          if ~/go/bin/govulncheck ./... | grep -q "Vulnerability"; then
            echo "❌ Security vulnerabilities found!"
            exit 1
          else
            echo "✅ No vulnerabilities found"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      # Proto 代码由 croupier-proto 的 sync-sdks workflow 同步，无需本地生成
      - name: Go mod download
        run: go mod download
      - name: Prepare storage directory
        run: mkdir -p data/uploads
      - name: Clear test cache
        run: go clean -testcache
      - name: Unit tests
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ":memory:"
          STORAGE_DRIVER: file
          STORAGE_BASE_DIR: data/uploads
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: server
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
