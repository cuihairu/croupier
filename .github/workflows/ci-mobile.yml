name: CI - Mobile

# 移动伴侣端（docs/archive/legacy-en/design/mobile-companion-design.md）质量门禁：
# flutter analyze 0 告警 + dart format 零 diff + flutter test 全绿
# + APK debug 构建烟测（设计稿 §7，M2 起追加）
# + workflow_dispatch 手动产 release APK 可下载产物（§7，M4 起追加）。
# 版本与本机工具链对齐（~/flutter 3.35.1，2026-09-29 核实；设计稿 v1
# 写的 3.38 系笔误，实现批按实际 stable 修正）。

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed --output=none .
      - run: flutter analyze
      - run: flutter test --coverage
      # 覆盖率门禁（CR-FIX-26）：低于阈值即失败，防止移动端质量倒退。
      # 阈值随测试补充缓慢抬升；初值 80% 基于 2026-11-10 实测基线 89.0%。
      - name: Coverage gate
        run: |
          python3 - <<'PYEOF'
          import re
          with open("coverage/lcov.info", encoding="utf-8") as f:
              data = f.read()
          total = hit = 0
          for block in data.split("end_of_record"):
              for line in block.splitlines():
                  if line.startswith("LF:"):
                      total += int(line[3:])
                  elif line.startswith("LH:"):
                      hit += int(line[3:])
          pct = hit / total * 100 if total else 0.0
          print(f"mobile coverage: {hit}/{total} lines = {pct:.1f}%")
          threshold = float("${COVERAGE_THRESHOLD:-80}")
          if pct < threshold:
              raise SystemExit(f"coverage {pct:.1f}% below threshold {threshold}%")
          PYEOF
      # 上传覆盖率报告（CR-FIX-26）：CI 页面可见趋势。
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-coverage-lcov
          path: mobile/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error
      # 构建烟测：验证 android/ 工程与原生依赖可编译（不产 artifact）。
      - run: flutter build apk --debug

  # APK 产物流水线（设计稿 §7/§8 M4）：workflow_dispatch 手动触发，门禁
  # job 绿后产 release APK 并上传为可下载产物（retention 14 天）。
  # release 走 android/app/build.gradle.kts 模板默认的 debug keystore 签名
  # （仓库暂无正式发布签名配置），产物定位为内部分发/侧载测试。
  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: croupier-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
