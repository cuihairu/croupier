name: CI - Mobile

# 移动伴侣端（docs/design/mobile-companion-design.md）质量门禁：
# flutter analyze 0 告警 + dart format 零 diff + flutter test 全绿。
# 版本与本机工具链对齐（~/flutter 3.35.1，2026-09-29 核实；设计稿 v1
# 写的 3.38 系笔误，实现批按实际 stable 修正）。

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed --output=none .
      - run: flutter analyze
      - run: flutter test
