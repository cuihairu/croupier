name: CI - Mobile

# 移动伴侣端（docs/archive/legacy-en/design/mobile-companion-design.md）质量门禁：
# flutter analyze 0 告警 + dart format 零 diff + flutter test 全绿
# + APK debug 构建烟测（设计稿 §7，M2 起追加）
# + workflow_dispatch 手动产 release APK 可下载产物（§7，M4 起追加）。
# 版本与本机工具链对齐（~/flutter 3.35.1，2026-09-29 核实；设计稿 v1
# 写的 3.38 系笔误，实现批按实际 stable 修正）。

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Debug-signed rehearsal artifact (false requires signing secrets)"
        type: boolean
        default: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      # AUD-006：锁文件必须与 CI 工具链（Flutter 3.35.1 / Dart 3.9）一致。
      # --enforce-lockfile 在 pubspec.lock 与 pubspec.yaml/当前 SDK 不一致时
      # 直接失败（不再静默重解析改写），把本地新版 Flutter 重解析出的
      # Dart >=3.11 锁文件挡在合并外。
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed --output=none .
      - run: flutter analyze
      - run: flutter test --coverage
      # 覆盖率门禁（CR-FIX-26）：低于阈值即失败，防止移动端质量倒退。
      # 阈值随测试补充缓慢抬升；初值 80% 基于 2026-11-10 实测基线 89.0%。
      # 覆盖阈值经 env COVERAGE_THRESHOLD 覆盖（AUD-011 修单引号 heredoc
      # 内 ${...} 不展开的缺陷）；未设时 Python 侧默认 80。
      - name: Coverage gate
        run: |
          python3 - <<'PYEOF'
          import os
          with open("coverage/lcov.info", encoding="utf-8") as f:
              data = f.read()
          total = hit = 0
          for block in data.split("end_of_record"):
              for line in block.splitlines():
                  if line.startswith("LF:"):
                      total += int(line[3:])
                  elif line.startswith("LH:"):
                      hit += int(line[3:])
          pct = hit / total * 100 if total else 0.0
          print(f"mobile coverage: {hit}/{total} lines = {pct:.1f}%")
          # 单引号 heredoc 内 shell 不展开 ${...}，必须在 Python 侧读 env，
          # 否则 float() 收到字面量恒 ValueError（AUD-011）。
          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "80"))
          if pct < threshold:
              raise SystemExit(f"coverage {pct:.1f}% below threshold {threshold}%")
          PYEOF
      # 上传覆盖率报告（CR-FIX-26）：CI 页面可见趋势。
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-coverage-lcov
          path: mobile/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error
      # 构建烟测：验证 android/ 工程与原生依赖可编译（不产 artifact）。
      - run: flutter build apk --debug

  # APK 产物流水线（设计稿 §7/§8 M4）：workflow_dispatch 手动触发，门禁
  # job 绿后产 release APK 并上传为可下载产物（retention 14 天）。
  # AUD-085 签名分离：默认（rehearsal=true）产出 debug 签名的演练包，
  # artifact 名 croupier-mobile-rehearsal-debugsigned-apk 明确标识签名来源；
  # rehearsal=false 走 secrets 受管签名（MOBILE_RELEASE_KEYSTORE_B64 等），
  # 缺 secrets 直接报错退出，产物 croupier-mobile-release-apk。
  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      # AUD-085: the debug-signed artifact only ships when the dispatch
      # explicitly declares itself a rehearsal.
      CROUPIER_REHEARSAL_BUILD: ${{ inputs.rehearsal == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get --enforce-lockfile
      # AUD-085: production artifacts are signed with the managed keystore
      # from repository secrets; dispatching a non-rehearsal build without
      # them fails here (the gradle task-graph guard would also abort).
      - name: Restore managed keystore
        if: ${{ inputs.rehearsal != true }}
        env:
          CROUPIER_KEYSTORE_B64: ${{ secrets.MOBILE_RELEASE_KEYSTORE_B64 }}
          CROUPIER_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_RELEASE_KEYSTORE_PASSWORD }}
          CROUPIER_KEY_ALIAS: ${{ secrets.MOBILE_RELEASE_KEY_ALIAS }}
          CROUPIER_KEY_PASSWORD: ${{ secrets.MOBILE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$CROUPIER_KEYSTORE_B64" ]; then
            echo "::error::non-rehearsal release requires MOBILE_RELEASE_KEYSTORE_B64 (plus MOBILE_RELEASE_KEYSTORE_PASSWORD / MOBILE_RELEASE_KEY_ALIAS / MOBILE_RELEASE_KEY_PASSWORD); dispatch with rehearsal=true for the debug-signed rehearsal artifact"
            exit 1
          fi
          echo "$CROUPIER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/croupier-release.jks"
          echo "CROUPIER_RELEASE_KEYSTORE=$RUNNER_TEMP/croupier-release.jks" >> "$GITHUB_ENV"
          echo "CROUPIER_RELEASE_KEYSTORE_PASSWORD=$CROUPIER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CROUPIER_RELEASE_KEY_ALIAS=$CROUPIER_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CROUPIER_RELEASE_KEY_PASSWORD=$CROUPIER_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      # AUD-085: print the signing certificate fingerprint so the artifact
      # page records exactly which key signed this build.
      - name: Print signing certificate fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Name artifact by signing source
        run: |
          if [ "$CROUPIER_REHEARSAL_BUILD" = "1" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk /tmp/croupier-mobile-rehearsal-debugsigned.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk /tmp/croupier-mobile-release.apk
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.rehearsal == true && 'croupier-mobile-rehearsal-debugsigned-apk' || 'croupier-mobile-release-apk' }}
          path: /tmp/croupier-mobile-*.apk
          retention-days: 14
          if-no-files-found: error
