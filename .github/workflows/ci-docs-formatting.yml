name: CI - Docs & Formatting

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-docs-formatting.yml"
      - ".github/workflows/*.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6

      - timeout-minutes: 3
        uses: pnpm/action-setup@v6

      - timeout-minutes: 5
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Check docs and workflow formatting
        timeout-minutes: 5
        run: pnpm run format:check
