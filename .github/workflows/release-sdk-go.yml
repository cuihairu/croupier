name: Release - Go SDK

on:
  push:
    tags:
      - "sdk-go-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./sdks/go
    steps:
      - timeout-minutes: 3
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Determine SDK Version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go)
          if [[ -z "$PACKAGE_VERSION" ]]; then
            echo "Failed to read version from version.go"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-go-v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match version.go version ($PACKAGE_VERSION)"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi
          echo "sdk_version=$VERSION" >> "$GITHUB_OUTPUT"

      - timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Add Go bin to PATH
        timeout-minutes: 1
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install protoc
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate proto (CI mode)
        timeout-minutes: 10
        env:
          CROUPIER_CI_BUILD: "1"
        run: go run ./scripts/generate_proto.go

      - name: Go mod download
        timeout-minutes: 5
        run: go mod download

      - name: Run tests
        timeout-minutes: 10
        run: go test ./...

      - name: Build
        timeout-minutes: 15
        run: |
          go build ./...

      - name: Package
        timeout-minutes: 5
        run: |
          mkdir -p artifacts
          tar --exclude='*_test.go' \
            --exclude='examples/**/*.test' \
            -czf "artifacts/croupier-go-sdk-${{ steps.version.outputs.sdk_version }}.tar.gz" \
            go.mod \
            go.sum \
            version.go \
            pkg \
            scripts \
            examples \
            LICENSE \
            README.md \
            SECURITY.md

      - name: Create Release
        timeout-minutes: 10
        uses: softprops/action-gh-release@v4
        with:
          files: sdks/go/artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
