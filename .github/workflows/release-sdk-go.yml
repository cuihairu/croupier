name: Release SDK — Go

# Go SDK 发布到 Go module（tag sdks/go/vX.Y.Z）。入口：
# release-sdk-matrix.yml（workflow_call，正式 tag 发布链）或手动 dispatch；
# 本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# 源提交（AUD-078）：统一经 release-sdk-resolve.yml 解析，子模块 tag 打在
# 与其余五条车道相同的 commit 上，不再取触发 ref 的 checkout HEAD。
# dry_run（AUD-079）：演练执行与正式发布一致的检查——在 pin 定的源提交上
# 构建 Go SDK 并本地演练 git tag（同一 tag 命令），但绝不推送。Go 车道的
# "发布物"就是子模块 tag，演练的可验收产物即本地 tag 指向 pin 定的 commit。
# contents:write 只存在于被 dry_run 跳过的 publish job。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只解析版本不发 tag"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只解析版本不发 tag"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve version & pin source commit
    uses: ./.github/workflows/release-sdk-resolve.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
    # 解析只在 version 为空时需要只读 GITHUB_TOKEN；不 inherit 仓库 secret。

  build:
    name: Build SDK & rehearse submodule tag (local only, no credentials)
    needs: resolve
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.4"

      - name: Build Go SDK at pinned commit
        working-directory: sdks/go
        run: go build ./...

      - name: Rehearse submodule tag locally (same command as a real publish, no push)
        env:
          SUBMODULE_TAG: sdks/go/${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git tag "$SUBMODULE_TAG" "$SOURCE_SHA"
          echo "rehearsed $SUBMODULE_TAG -> $(git rev-parse "$SUBMODULE_TAG^{commit}") (local only, not pushed)"
          git show --no-patch --format='tagged commit: %H %s' "$SUBMODULE_TAG"

  publish:
    name: Tag Go submodule & push
    needs: [resolve, build]
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Tag Go submodule
        env:
          SUBMODULE_TAG: sdks/go/${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$SUBMODULE_TAG" >/dev/null; then
            echo "tag $SUBMODULE_TAG 已存在，跳过（幂等）"
            exit 0
          fi
          git tag "$SUBMODULE_TAG" "$SOURCE_SHA"
          git push origin "$SUBMODULE_TAG"
