name: Docs (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Setup PNPM
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Pages
        timeout-minutes: 3
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Enable Corepack and prepare pnpm
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          corepack enable
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found after corepack; installing via npm as fallback"
            npm i -g pnpm
          fi
          pnpm --version

      - name: Install dependencies (pnpm)
        timeout-minutes: 5
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build website (pnpm)
        timeout-minutes: 10
        working-directory: docs
        run: pnpm build

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

      - name: Wait for artifact metadata to be queryable
        timeout-minutes: 3
        run: |
          set -euxo pipefail
          for i in $(seq 1 24); do
            count=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d.get("artifacts",[]) if a.get("name")=="github-pages"))' 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "artifact visible (attempt ${i})"
              exit 0
            fi
            echo "attempt ${i}: artifact not queryable yet; sleeping 10s"
            sleep 10
          done
          echo "artifact never became queryable"
          exit 1

      - name: Deploy to GitHub Pages
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v5.0.1
