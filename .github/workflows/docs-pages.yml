name: Docs (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7.4.0
        with:
          node-version: 22
      - name: Setup PNPM
        timeout-minutes: 3
        uses: pnpm/action-setup@v7

      - name: Setup Pages
        timeout-minutes: 3
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enable Corepack and prepare pnpm
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          corepack enable
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found after corepack; installing via npm as fallback"
            npm i -g pnpm
          fi
          pnpm --version

      - name: Install dependencies (pnpm)
        timeout-minutes: 5
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build website (pnpm)
        timeout-minutes: 10
        working-directory: docs
        run: pnpm build

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v6
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v6
