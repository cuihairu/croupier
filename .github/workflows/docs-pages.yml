name: Docs (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Setup PNPM
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Pages
        timeout-minutes: 3
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Enable Corepack and prepare pnpm
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          corepack enable
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found after corepack; installing via npm as fallback"
            npm i -g pnpm
          fi
          pnpm --version

      - name: Install dependencies (pnpm)
        timeout-minutes: 5
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build website (pnpm)
        timeout-minutes: 10
        working-directory: docs
        run: pnpm build

      - name: Purge stale same-run Pages artifacts
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | python3 -c '
          import json, sys, os, urllib.request
          d = json.load(sys.stdin)
          tok = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          stale = [a for a in d.get("artifacts", []) if a.get("name") == "github-pages"]
          ids = ",".join(str(a["id"]) for a in stale)
          print("stale artifact ids:", ids or "none")
          for a in stale:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/actions/artifacts/%d" % (repo, a["id"]),
                  method="DELETE",
                  headers={"Authorization": "Bearer " + tok})
              try:
                  urllib.request.urlopen(req)
                  print("deleted", a["id"])
              except Exception as e:
                  print("delete failed", a["id"], e)
          '

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

      - name: Wait for artifact metadata to be queryable
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          for i in $(seq 1 50); do
            resp=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
            code=$(echo "${resp}" | tail -1)
            count=$(echo "${resp}" | head -n -1 \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d.get("artifacts",[]) if a.get("name")=="github-pages" and not a.get("expired")))' 2>/dev/null || echo 0)
            if [ "${count:-0}" -eq 1 ]; then
              echo "artifact visible exactly-once (attempt ${i}, http ${code})"
              exit 0
            fi
            echo "attempt ${i}: http=${code} count=${count}; sleeping 10s"
            if [ "${code}" != "200" ] && [ "${i}" = "1" ]; then
              echo "${resp}" | head -c 500 || true
            fi
            sleep 10
          done
          echo "artifact never became queryable exactly-once"
          exit 1

      - name: Deploy to GitHub Pages
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v5.0.1
