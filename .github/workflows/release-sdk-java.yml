name: Release SDK — Java

# Java SDK 发布到 GitHub Packages（可选 Maven Central）。入口：
# release-sdk-matrix.yml（workflow_call，正式 tag 发布链）或手动 dispatch；
# 本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# 源提交（AUD-078）：统一 checkout release-sdk-resolve.yml 解析出的 commit，
# 不再取触发 ref——触发分支领先 tag 时构建产物也只来自 tag 的源码。
# dry_run（AUD-079）：演练执行与正式发布一致的构建打包检查（gradle build +
# publishToMavenLocal 出全套构件），不要求任何发布凭据，绝不 publish 到
# GitHub Packages / Maven Central。packages:write 与各 secret 只存在于被
# dry_run 跳过的 publish job。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
      sha:
        description: "源提交 SHA（留空=按 version 解析）"
        required: false
        type: string
        default: ""

jobs:
  resolve:
    name: Resolve version & pin source commit
    uses: ./.github/workflows/release-sdk-resolve.yml
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
    # 解析只在 version 为空时需要只读 GITHUB_TOKEN；不 inherit 仓库 secret。

  build:
    name: Build & package (Maven local; no credentials)
    needs: resolve
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Stamp version
        run: |
          cd sdks/java
          sed -i 's/^    public static final String VERSION = ".*";/    public static final String VERSION = "${{ needs.resolve.outputs.version }}";/' \
            src/main/java/io/github/cuihairu/croupier/sdk/SdkInfo.java
      - name: Build & package to local Maven repo (same checks as a real publish)
        # 不带 -PforceRelease：非发布路径不配置 Sonatype/GitHub Packages 仓库，
        # 不触发签名，publishToMavenLocal 全程零凭据、零外部写。
        working-directory: sdks/java
        run: |
          ./gradlew build publishToMavenLocal -PoverrideVersion=${{ needs.resolve.outputs.version }}
      - name: List packaged artifacts
        run: |
          find ~/.m2/repository -path '*croupier*' -type f \( -name '*.jar' -o -name '*.pom' \) -print -exec stat -c'%s bytes  %n' {} \;

  publish:
    name: Publish (GitHub Packages；可选同步 Maven Central)
    needs: [resolve, build]
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Stamp version
        run: |
          cd sdks/java
          sed -i 's/^    public static final String VERSION = ".*";/    public static final String VERSION = "${{ needs.resolve.outputs.version }}";/' \
            src/main/java/io/github/cuihairu/croupier/sdk/SdkInfo.java
      - name: Publish (GitHub Packages；可选同步 Maven Central)
        run: |
          cd sdks/java
          EXTRA=""
          if [ -n "$MC_USER" ]; then
            EXTRA="-PforceRelease"
            echo "已配置 Maven Central 凭据，同步发布 Central"
          fi
          # shellcheck disable=SC2086
          ./gradlew publish -PoverrideVersion=${{ needs.resolve.outputs.version }} $EXTRA
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
          MC_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
