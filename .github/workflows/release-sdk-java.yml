name: Release SDK — Java

# Java SDK 发布到 GitHub Packages（可选 Maven Central）。仅手动执行（workflow_dispatch），绝不自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""

permissions:
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$V" in
            v*) TAG="$V"; NUM="${V#v}" ;;
            *)   TAG="v$V"; NUM="$V" ;;
          esac
          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$NUM"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish (GitHub Packages；可选同步 Maven Central)
        run: |
          cd sdks/java
          EXTRA=""
          if [ -n "$MC_USER" ]; then
            EXTRA="-PforceRelease"
            echo "已配置 Maven Central 凭据，同步发布 Central"
          fi
          sed -i 's/^    public static final String VERSION = ".*";/    public static final String VERSION = "${{ steps.ver.outputs.version }}";/' \
            src/main/java/io/github/cuihairu/croupier/sdk/SdkInfo.java
          # shellcheck disable=SC2086
          ./gradlew publish -PoverrideVersion=${{ steps.ver.outputs.version }} $EXTRA
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
          MC_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
