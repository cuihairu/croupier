name: Release SDK — Java

# Java SDK 发布到 GitHub Packages（可选 Maven Central）。入口：
# release-sdk-matrix.yml（workflow_call，正式 tag 发布链）或手动 dispatch；
# 本文件自身绝不因 push/tag 自动触发。
# 版本：留空 = 最新 release tag；可显式指定（v0.2.0 或 0.2.0 等价）。
# dry_run：演练模式——照常注入版本号并构建，但绝不 publish。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        default: ""
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "发布版本（留空=最新 release tag）"
        required: false
        type: string
      dry_run:
        description: "演练模式：只构建不发版"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$V" in
            v*) TAG="$V"; NUM="${V#v}" ;;
            *)   TAG="v$V"; NUM="$V" ;;
          esac
          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$NUM"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stamp version
        run: |
          cd sdks/java
          sed -i 's/^    public static final String VERSION = ".*";/    public static final String VERSION = "${{ steps.ver.outputs.version }}";/' \
            src/main/java/io/github/cuihairu/croupier/sdk/SdkInfo.java
      - name: Publish (GitHub Packages；可选同步 Maven Central)
        if: ${{ ! inputs.dry_run }}
        run: |
          cd sdks/java
          EXTRA=""
          if [ -n "$MC_USER" ]; then
            EXTRA="-PforceRelease"
            echo "已配置 Maven Central 凭据，同步发布 Central"
          fi
          # shellcheck disable=SC2086
          ./gradlew publish -PoverrideVersion=${{ steps.ver.outputs.version }} $EXTRA
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
          MC_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
