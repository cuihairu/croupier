name: CI - SDKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sdks/**'
      - '.github/workflows/ci-sdks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/**'
      - '.github/workflows/ci-sdks.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Go SDK
  go-lint:
    name: Go - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/go/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        shell: bash
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
      - name: Go mod download
        timeout-minutes: 5
        working-directory: sdks/go
        run: go mod download
      - name: Check gofmt
        timeout-minutes: 5
        working-directory: sdks/go
        run: |
          fmt_result=$(gofmt -l .)
          if [[ -n "$fmt_result" ]]; then
            echo "The following files need gofmt:"
            echo "$fmt_result"
            exit 1
          fi
      - name: Vet Go code
        timeout-minutes: 5
        working-directory: sdks/go
        run: go vet ./...

  go-security:
    name: Go - Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/go/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLDIR || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
      - name: Install govulncheck
        timeout-minutes: 5
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go mod download
        timeout-minutes: 5
        working-directory: sdks/go
        run: go mod download
      - name: Run govulncheck
        timeout-minutes: 10
        working-directory: sdks/go
        run: ~/go/bin/govulncheck ./...

  go-test:
    name: Go - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/go/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Normalize Go toolchain env
        timeout-minutes: 2
        run: |
          go env -u GOROOT || true
          go env -u GOTOOLCHAIN || true
          echo "GOCACHE=$RUNNER_TEMP/go-build-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-${{ github.run_id }}" >> "$GITHUB_ENV"
          go version
      - name: Go mod download
        timeout-minutes: 5
        working-directory: sdks/go
        run: go mod download
      - name: Unit tests
        timeout-minutes: 10
        working-directory: sdks/go
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/go/coverage.out
          flags: go-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  # JavaScript SDK
  js-lint:
    name: JavaScript - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/js/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'sdks/js/package-lock.json'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/js
        run: npm ci
      - name: Run ESLint
        timeout-minutes: 5
        working-directory: sdks/js
        run: npm run lint

  js-test:
    name: JavaScript - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/js/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'sdks/js/package-lock.json'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/js
        run: npm ci
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/js
        run: npm test
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/js/coverage/lcov.info
          flags: js-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  # Python SDK
  python-lint:
    name: Python - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/python/')
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/python
        run: pip install -e '.[dev]'
      - name: Run ruff
        timeout-minutes: 5
        working-directory: sdks/python
        run: ruff check .
      - name: Run mypy
        timeout-minutes: 5
        working-directory: sdks/python
        run: mypy .

  python-test:
    name: Python - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/python/')
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdks/python/requirements*.txt'
      - name: Install dependencies
        timeout-minutes: 5
        working-directory: sdks/python
        run: pip install -e '.[dev]'
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/python
        run: pytest --cov=. --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  # Java SDK
  java-lint:
    name: Java - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/java/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Java
        timeout-minutes: 5
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission
        timeout-minutes: 2
        working-directory: sdks/java
        run: chmod +x gradlew || true
      - name: Run checkstyle
        timeout-minutes: 10
        working-directory: sdks/java
        run: ./gradlew checkstyleMain checkstyleTest || true

  java-test:
    name: Java - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/java/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup Java
        timeout-minutes: 5
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission
        timeout-minutes: 2
        working-directory: sdks/java
        run: chmod +x gradlew || true
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/java
        run: ./gradlew test jacocoTestReport
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  # C++ SDK
  cpp-lint:
    name: C++ - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/cpp/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Install clang-tidy
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
      - name: Run clang-tidy
        timeout-minutes: 10
        working-directory: sdks/cpp
        run: find src -name '*.cpp' -o -name '*.cc' | xargs clang-tidy -- -Iinclude || true

  cpp-test:
    name: C++ - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/cpp/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev
      - name: Configure CMake
        timeout-minutes: 5
        working-directory: sdks/cpp
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        timeout-minutes: 10
        working-directory: sdks/cpp/build
        run: make -j$(nproc)
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/cpp/build
        run: ctest --output-on-failure
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/cpp/build/coverage.info
          flags: cpp-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  # C# SDK
  csharp-lint:
    name: C# - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/csharp/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: Cache NuGet
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Run format check
        timeout-minutes: 10
        working-directory: sdks/csharp
        run: dotnet format --verify-no-changes --verbosity diagnostic

  csharp-test:
    name: C# - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || contains(github.event.commits[0].modified, 'sdks/csharp/')
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
      - name: Setup .NET
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: Cache NuGet
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Run tests
        timeout-minutes: 10
        working-directory: sdks/csharp
        run: |
          dotnet test --nologo --no-build --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            DataCollector.CodeCoverage.dll
      - name: Upload coverage to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sdks/csharp/TestResults/*/coverage.cobertura.xml
          flags: csharp-sdk
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
