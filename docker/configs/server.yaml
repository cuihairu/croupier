# Docker deployment override for croupier-server.
server:
  host: 0.0.0.0
  port: 18780
  timeout: 600000
  mode: dev

# HA 多实例（docs/architecture/server-ha-multi-instance.md）：
# 身份字段（instanceId/advertiseAddr）由环境变量按实例注入
# （CROUPIER_CLUSTER_*，cmd/server root.go applyClusterEnvironmentOverrides）；
# 本文件仅提供共享默认值。enabled=true 但未给 advertiseAddr 时仍按单实例运行。
cluster:
  enabled: true
  heartbeatInterval: 5s
  leaseTtl: 15s
  ownerTtl: 3m

database:
  driver: postgres
  dataSource: "host=postgres port=5432 user=croupier password=croupier_dev_password dbname=croupier sslmode=disable TimeZone=Asia/Shanghai"

sse:
  updateInterval: 60
  keepAliveInterval: 30

control:
  addr: ":19090"
  ipcAddr: ""
  cert: ""
  key: ""
  ca: ""

registry:
  # 绝对路径：写入 /app/data volume（docker-compose.deploy.yml 挂载），
  # 避免相对路径被 bootstrapData.baseDir 解析进容器可写层 /app/configs/data
  # 而在容器重建时丢失启用状态。
  assignmentsPath: "/app/data/assignments.json"
  analyticsFiltersPath: "schemas/analytics_filters.json"
  rateLimitsPath: "data/rate_limits.json"

agentDispatch:
  jobRoutingDir: "data"
  jobRoutingTTL: ""
  toAgentTLS:
    enabled: false
    certFile: ""
    keyFile: ""
    caFile: ""
    serverName: ""
    insecureSkipVerify: false

auth:
  jwtSecret: "localdevsecret-change-me"
  rbacConfig: "configs/rbac.json"
  usersConfig: "configs/users.json"
  gamesConfig: "configs/games.json"

bootstrapData:
  baseDir: "configs"

descriptors:
  dir: "descriptors"

schemas:
  dir: "schemas"

storage:
  driver: "file"
  baseDir: "data/uploads"

cache:
  enabled: true
  type: "redis"
  addr: "redis:6379"
  password: ""
  db: 0
  poolSize: 50
  ttl: "5m"
  evictTTL: "10m"
  maxItems: 10000

log:
  level: "info"
  format: "console"
  output: "stdout"

metrics:
  perFunction: true
  perGameDenies: false
