# Docker deployment override for croupier-server.
server:
  host: 0.0.0.0
  port: 18780
  timeout: 600000
  mode: dev

database:
  driver: postgres
  dataSource: "host=postgres port=5432 user=croupier password=croupier_dev_password dbname=croupier sslmode=disable TimeZone=Asia/Shanghai"

sse:
  updateInterval: 2
  keepAliveInterval: 30

control:
  addr: ":19090"
  ipcAddr: ""
  cert: ""
  key: ""
  ca: ""

registry:
  assignmentsPath: "data/assignments.json"
  analyticsFiltersPath: "schemas/analytics_filters.json"
  rateLimitsPath: "data/rate_limits.json"

agentDispatch:
  jobRoutingDir: "data"
  jobRoutingTTL: ""
  toAgentTLS:
    enabled: false
    certFile: ""
    keyFile: ""
    caFile: ""
    serverName: ""
    insecureSkipVerify: false

auth:
  jwtSecret: "localdevsecret-change-me"
  rbacConfig: "configs/rbac.json"
  usersConfig: "configs/users.json"
  gamesConfig: "configs/games.json"

bootstrapData:
  baseDir: "configs"

descriptors:
  dir: "descriptors"

schemas:
  dir: "schemas"

storage:
  driver: "file"
  baseDir: "data/uploads"

cache:
  enabled: true
  type: "redis"
  addr: "redis:6379"
  password: ""
  db: 0
  poolSize: 50
  ttl: "5m"
  evictTTL: "10m"
  maxItems: 10000

log:
  level: "info"
  format: "console"
  output: "stdout"

metrics:
  perFunction: true
  perGameDenies: false
