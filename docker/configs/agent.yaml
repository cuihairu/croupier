# Docker deployment override for croupier-agent.
name: croupier-agent
host: 0.0.0.0
port: 19091

server:
  addr: "server:19090"
  insecure: true
  serverName: ""
  insecureSkipVerify: false

agent:
  id: "croupier-docker-agent"
  gameId: "demo-game"
  env: "development"
  localAddr: "agent:19091"
  httpAddr: "agent:19091"
  labels: {}

upstream:
  heartbeatInterval: 30
  retryInterval: 5
  maxRetries: 3
  timeout: 10000

tls:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  insecureSkipVerify: false

outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

# Ops module configuration
# Controls system metrics collection and reporting
ops:
  enabled: true
  metrics_interval: 30s
  metrics_enabled: true
