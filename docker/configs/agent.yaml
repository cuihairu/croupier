# Docker deployment override for croupier-agent.
# 上游经 dashboard nginx 的 L4 stream LB（haproxy:19090）打散
# 到 server/server2——断连重连由 LB 分发至存活实例（架构文档 §6.1）。
name: croupier-agent
host: 0.0.0.0
port: 19091

server:
  addr: "haproxy:19090"
  insecure: true
  serverName: ""
  insecureSkipVerify: false

agent:
  id: "croupier-docker-agent"
  gameId: "default"
  env: "dev"
  localAddr: "0.0.0.0:19091"
  httpAddr: "agent:19091"
  labels: {}

upstream:
  heartbeatInterval: 30
  retryInterval: 5
  maxRetries: 3
  timeout: 10000

tls:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  insecureSkipVerify: false

outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

# Ops module configuration
# Controls system metrics collection and reporting
ops:
  enabled: true
  metrics_interval: 30s
  metrics_enabled: true
