# Docker deployment override for croupier-agent.
# 上游经 dashboard nginx 的 L4 stream LB（haproxy:19090）打散
# 到 server/server2——断连重连由 LB 分发至存活实例（架构文档 §6.1）。
name: croupier-agent
host: 0.0.0.0
port: 19091

server:
  addr: "haproxy:19090"
  insecure: true
  serverName: ""
  insecureSkipVerify: false

agent:
  id: "croupier-docker-agent"
  gameId: "default"
  env: "dev"
  localAddr: "0.0.0.0:19091"
  httpAddr: "agent:19091"
  labels: {}

upstream:
  heartbeatInterval: 30
  retryInterval: 5
  maxRetries: 3
  timeout: 10000

tls:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  insecureSkipVerify: false

outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

# OTel 遥测面（与 server 同一结构/语义，OTEL_* 环境变量同口径覆盖）。
# enabled 是总开关：false（含缺省）时 tracing/metrics 子开关一律无效，
# 不创建 exporter/周期导出任务；collector_url 未配置时不向默认远端导出。
# 以 `no_otel` build tag 构建的二进制在 enabled=true 时启动即报错。
# telemetry:
#   enabled: false
#   serviceName: croupier-agent    # 缺省 croupier-agent
#   collectorUrl: ""               # OTLP/HTTP，如 http://collector:4318
#   enableTracing: true
#   enableMetrics: true
#   samplingRatio: 1.0
#   useTls: false

# Ops module configuration
# Controls system metrics collection and reporting
ops:
  enabled: true
  metricsInterval: 30s
  metricsEnabled: true
