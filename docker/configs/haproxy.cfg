# HAProxy L4 负载均衡：Agent 自研 transport TCP 入口
# （docs/operations/load-balancing.md——多宿主生产推荐，单机 compose 亦可承担）
#
# 与 nginx stream 相比的 decisive 能力：
# - resolvers：运行时 DNS 重解析，server 容器重建换 IP 自动跟随
# - option tcp-check：主动健康检查，摘除僵死实例（长连接场景关键）
# - stats：每后端会话分布实时可观测

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s
    hold nx 3s
    hold other 3s
    hold refused 3s
    hold timeout 3s

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    retries 2

frontend croupier_agent_fe
    bind *:19090
    default_backend croupier_agent_lb

backend croupier_agent_lb
    balance leastconn
    # 主动健康检查：TCP 建连探活 server 的 control listener（:19090）
    option tcp-check
    default-server inter 2s fall 3 rise 2 resolvers docker_dns init-addr libc,none
    # 单活 + 冷备：agent 的函数注册 registry 是 server 实例内存态、无跨
    # 实例同步——leastconn 双活会让 agent 重连漂移实例后，旧实例留 24h
    # TTL 悬尸 session、新实例视图缺数据（2026-09-11 线上事故根因）。
    # server2 标记 backup：主实例健康时全部 agent 连主实例（单一 registry
    # 视图），主实例故障摘除后 agent 重连自动落 backup 重新注册。
    server croupier-server croupier-server:19090 check
    server croupier-server2 croupier-server2:19090 check backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    # 内置 Prometheus exporter（HAProxy 2.4+，零额外容器）：
    # 供 Prometheus scrape（LB 监控管道，docs/operations/load-balancing.md）
    http-request use-service prometheus-exporter if { path /metrics }
