# Docker deployment override for croupier-agent (instance 2).
# 上游同实例 1：经 dashboard nginx L4 LB（haproxy:19090）
# 打散到 server/server2。Agent ID 与 httpAddr 必须与实例 1 区分
# （注册与回调寻址冲突）。
name: croupier-agent-2
host: 0.0.0.0
port: 19091

server:
  addr: "haproxy:19090"
  insecure: true
  serverName: ""
  insecureSkipVerify: false

agent:
  id: "croupier-docker-agent-2"
  gameId: "default"
  env: "dev"
  localAddr: "0.0.0.0:19091"
  httpAddr: "agent2:19091"
  labels: {}

upstream:
  heartbeatInterval: 30
  retryInterval: 5
  maxRetries: 3
  timeout: 10000

tls:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  insecureSkipVerify: false

outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

# Ops module configuration
# Controls system metrics collection and reporting
ops:
  enabled: true
  metricsInterval: 30s
  metricsEnabled: true
