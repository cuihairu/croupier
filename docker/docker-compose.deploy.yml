services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: croupier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-croupier}
      POSTGRES_USER: ${POSTGRES_USER:-croupier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-croupier_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - croupier-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-croupier} -d ${POSTGRES_DB:-croupier}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: croupier-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - croupier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:23}
    container_name: croupier-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/?query=SELECT%201 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croupier-network

  # OTel 追踪栈：server/agent 的 span 经 collector 入 Jaeger。
  # 未部署此栈时 server 不应开启 OTEL_ENABLED（invoke traceId 将为空）。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: croupier-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./configs/otel-collector.yaml:/etc/otel-collector.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:13133/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croupier-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: croupier-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-17686}:16686"
    networks:
      - croupier-network

  server:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-server:${CROUPIER_SERVER_TAG:-main}
    container_name: croupier-server
    restart: unless-stopped
    volumes:
      - ./configs/server.yaml:/app/configs/server.yaml:ro
      # assignments.json / 历史与上传文件落在容器可写层，up -d 重建即丢；
      # 挂 named volume 使启用状态跨部署持久化。
      - server_data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://croupier:croupier_dev_password@postgres:5432/croupier?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://clickhouse:9000/analytics?dial_timeout=5s&compress=true}
      IP2LOCATION_BIN_PATH: /app/configs/IP2LOCATION-LITE-DB3.BIN
      IP2LOCATION_BIN_PATH_V6: /app/configs/IP2LOCATION-LITE-DB3.IPV6.BIN
      GEOIP_TIMEOUT_MS: ${GEOIP_TIMEOUT_MS:-800}
      # OTel：trace 全链路（server→agent→provider）与 Dashboard 调试页
      # traceId 展示依赖此配置；未启用时 invoke 响应 traceId 为空。
      OTEL_ENABLED: "true"
      OTEL_ENABLE_TRACING: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      CROUPIER_JAEGER_URL: ${CROUPIER_JAEGER_URL:-}
    command: ["server", "--config", "/app/configs/server.yaml"]
    ports:
      - "${SERVER_TLS_PORT:-8443}:8443"
      - "${SERVER_HTTP_PORT:-18780}:18780"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:18780/healthz | grep -q ''"ok":true''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - croupier-network

  agent:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-agent:${CROUPIER_AGENT_TAG:-main}
    container_name: croupier-agent
    restart: unless-stopped
    volumes:
      - ./configs/agent.yaml:/app/configs/agent.yaml:ro
    command: ["agent", "--config", "/app/configs/agent.yaml"]
    ports:
      - "${AGENT_GRPC_PORT:-19090}:19090"
      - "${AGENT_HTTP_PORT:-19091}:19091"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # busybox applets 在 agent 镜像中位于 /usr/local/bin（distroless 的
      # /bin 对 nonroot 不可写）；TCP listener 绑定 0.0.0.0 后 localhost 可达。
      test: ["CMD", "/usr/local/bin/busybox", "nc", "-z", "127.0.0.1", "19091"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - croupier-network

  dashboard:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-dashboard:${CROUPIER_DASHBOARD_TAG:-main}
    container_name: croupier-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - croupier-network

  sdk-example-demo:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-go-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-go
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_GO_EXAMPLE_SERVICE_ID:-game-demo-go}
      CROUPIER_LOCAL_LISTEN: ${CROUPIER_SDK_EXAMPLE_LOCAL_LISTEN:-0.0.0.0:19103}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-python:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-python-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-python
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_PYTHON_EXAMPLE_SERVICE_ID:-game-demo-python}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-java:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-java-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-java
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_JAVA_EXAMPLE_SERVICE_ID:-game-demo-java}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-js:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-js-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-js
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_JS_EXAMPLE_SERVICE_ID:-game-demo-js}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-cpp:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-cpp-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-cpp
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_CPP_EXAMPLE_SERVICE_ID:-game-demo-cpp}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-csharp:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-csharp-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-csharp
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_CSHARP_EXAMPLE_SERVICE_ID:-game-demo-csharp}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

volumes:
  postgres_data:
    driver: local
  server_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local

networks:
  croupier-network:
    driver: bridge
