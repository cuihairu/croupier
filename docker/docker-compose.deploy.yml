x-server-common: &server-common
  image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-server:${CROUPIER_SERVER_TAG:-main}
  restart: unless-stopped
  volumes:
    - ./configs/server.yaml:/app/configs/server.yaml:ro
    # assignments.json / 历史与上传文件落在容器可写层，up -d 重建即丢；
    # 挂 named volume 使启用状态跨部署持久化（双实例共享同一卷）。
    - server_data:/app/data
  environment: &server-env
    DATABASE_URL: ${DATABASE_URL:-postgres://croupier:croupier_dev_password@postgres:5432/croupier?sslmode=disable}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://clickhouse:9000/analytics?dial_timeout=5s&compress=true}
    IP2LOCATION_BIN_PATH: /app/configs/IP2LOCATION-LITE-DB3.BIN
    IP2LOCATION_BIN_PATH_V6: /app/configs/IP2LOCATION-LITE-DB3.IPV6.BIN
    GEOIP_TIMEOUT_MS: ${GEOIP_TIMEOUT_MS:-800}
    # OTel：trace 全链路（server→agent→provider）与 Dashboard 调试页
    # traceId 展示依赖此配置；未启用时 invoke 响应 traceId 为空。
    OTEL_ENABLED: "true"
    OTEL_ENABLE_TRACING: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    # 同一 compose 网络内的 Jaeger UI（all-in-one 容器名直连）；
    # 外部 Jaeger 时在 .env 覆盖 CROUPIER_JAEGER_URL
    CROUPIER_JAEGER_URL: ${CROUPIER_JAEGER_URL:-http://croupier-jaeger:16686}
    CROUPIER_GRAFANA_EXPLORE_URL: ${CROUPIER_GRAFANA_EXPLORE_URL:-}
  command: ["server", "--config", "/app/configs/server.yaml"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  healthcheck: &server-healthcheck
    test:
      [
        "CMD-SHELL",
        'wget -qO- http://127.0.0.1:18780/healthz | grep -q ''"ok":true''',
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  networks:
    - croupier-network
x-agent-common: &agent-common
  image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-agent:${CROUPIER_AGENT_TAG:-main}
  restart: unless-stopped
  command: ["agent", "--config", "/app/configs/agent.yaml"]
  depends_on:
    server:
      condition: service_healthy
    server2:
      condition: service_healthy
    haproxy:
      condition: service_started
  healthcheck: &agent-healthcheck
    # busybox applets 在 agent 镜像中位于 /usr/local/bin（distroless 的
    # /bin 对 nonroot 不可写）；TCP listener 绑定 0.0.0.0 后 localhost 可达。
    test: ["CMD", "/usr/local/bin/busybox", "nc", "-z", "127.0.0.1", "19091"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s
  networks:
    - croupier-network

services:
  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:15-alpine}
    container_name: croupier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-croupier}
      POSTGRES_USER: ${POSTGRES_USER:-croupier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-croupier_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - croupier-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-croupier} -d ${POSTGRES_DB:-croupier}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7-alpine}
    container_name: croupier-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - croupier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:23}
    container_name: croupier-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./configs/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/?query=SELECT%201 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croupier-network

  # OTel 追踪栈：server/agent 的 span 经 collector 入 Jaeger。
  # 未部署此栈时 server 不应开启 OTEL_ENABLED（invoke traceId 将为空）。
  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.91.0}
    container_name: croupier-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./configs/otel-collector.yaml:/etc/otel-collector.yaml:ro # 拷贝自 configs/otel-collector-config.yaml
    # contrib 0.91 是 distroless（无 shell/wget/healthcheck 二进制），
    # 无法承载 Docker healthcheck；OTLP 发送端自带重连，server 不以
    # collector 健康为启动前置。
    networks:
      - croupier-network

  jaeger:
    # 锁定版本：latest 每次部署都强制走外网拉取，镜像源抖动会阻塞整个部署。
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.62.0}
    container_name: croupier-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-17686}:16686"
    networks:
      - croupier-network

  # HA 双实例：server/server2 共享配置（cluster 成员表 + owner 转发，
  # 见 docs/architecture/server-ha-multi-instance.md）。agent 的 mTLS 出站
  # 连接单实例断线重连即可漂移；dashboard nginx 按请求分流两实例。
  # server_data named volume 双实例共享（assignments/上传文件跨实例可见）。
  server:
    <<: *server-common
    container_name: croupier-server
    # 宿主端口只由 server-1 发布（双实例不能绑同一宿主端口）；
    # 集群内互联走容器名，宿主直连（调试）走 server-1。
    ports:
      - "${SERVER_TLS_PORT:-8443}:8443"
      - "${SERVER_HTTP_PORT:-18780}:18780"
    environment:
      <<: *server-env
      # HA 编排必须显式开集群（成员表 + owner 转发 + 跨实例调用），
      # 只配 advertiseAddr 不开 enabled 会退化为两个互不知晓的单实例：
      # 节点页只见本实例 agent、函数调用不转发（曾在线上复现）。
      CROUPIER_CLUSTER_ENABLED: "true"
      CROUPIER_CLUSTER_INSTANCE_ID: croupier-server
      CROUPIER_CLUSTER_ADVERTISE_ADDR: croupier-server:19099
      # LB 监控数据源（telemetry 与 deploy 双网络时指宿主映射端口）；
      # 未配置则 /ops/lb 页隐藏
      CROUPIER_LB_PROMETHEUS_URL: ${CROUPIER_LB_PROMETHEUS_URL:-http://prometheus:9090}

  server2:
    <<: *server-common
    container_name: croupier-server2
    environment:
      <<: *server-env
      CROUPIER_CLUSTER_ENABLED: "true"
      CROUPIER_CLUSTER_INSTANCE_ID: croupier-server2
      CROUPIER_CLUSTER_ADVERTISE_ADDR: croupier-server2:19099
      CROUPIER_LB_PROMETHEUS_URL: ${CROUPIER_LB_PROMETHEUS_URL:-http://prometheus:9090}

  # HA 双实例 agent：agent → server、agent2 → server2（configs/agent*.yaml
  # 分别指定上游地址与 Agent ID）。宿主端口只由实例 1 发布。
  agent:
    <<: *agent-common
    container_name: croupier-agent
    volumes:
      - ./configs/agent.yaml:/app/configs/agent.yaml:ro
    ports:
      - "${AGENT_HTTP_PORT:-19091}:19091"

  agent2:
    <<: *agent-common
    container_name: croupier-agent-2
    volumes:
      - ./configs/agent2.yaml:/app/configs/agent.yaml:ro

  dashboard:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-dashboard:${CROUPIER_DASHBOARD_TAG:-main}
    container_name: croupier-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:80"
    depends_on:
      server:
        condition: service_healthy
      server2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - croupier-network

  # Agent L4 负载均衡（HAProxy）：自研 transport TCP 入口打散到
  # server/server2。与 nginx stream 的关键差异：resolvers 运行时
  # DNS 重解析（server 容器重建换 IP 自动跟随，无需 reload）+
  # tcp-check 主动健康检查（摘除僵死实例）+ stats 可观测（:8404）。
  # 配置：docker/configs/haproxy.cfg；选型：docs/guide/load-balancing.md
  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:2.9-alpine}
    container_name: croupier-haproxy
    restart: unless-stopped
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Agent 接入入口：外部宿主网段的 agent 需要时取消注释映射；
      # compose 内 agent 走容器网直连 croupier-haproxy:19090
      # - "${AGENT_LB_PORT:-19090}:19090"
      # stats 排查页（连接分布/健康状态），默认仅集群内可达
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    depends_on:
      server:
        condition: service_healthy
      server2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - croupier-network

  sdk-demo-go:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-go-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-go
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_GO_EXAMPLE_SERVICE_ID:-game-demo-go}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-python:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-python-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-python
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_PYTHON_EXAMPLE_SERVICE_ID:-game-demo-python}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-java:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-java-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-java
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_JAVA_EXAMPLE_SERVICE_ID:-game-demo-java}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-js:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-js-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-js
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_JS_EXAMPLE_SERVICE_ID:-game-demo-js}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-cpp:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-cpp-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-cpp
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_CPP_EXAMPLE_SERVICE_ID:-game-demo-cpp}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  sdk-demo-csharp:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-sdk-csharp-example-demo:${CROUPIER_SDK_EXAMPLE_TAG:-main}
    container_name: croupier-sdk-demo-csharp
    restart: unless-stopped
    profiles: ["sdk-examples"]
    environment:
      CROUPIER_AGENT_ADDR: ${CROUPIER_AGENT_ADDR:-agent:19091}
      CROUPIER_GAME_ID: ${CROUPIER_SDK_EXAMPLE_GAME_ID:-default}
      CROUPIER_SERVICE_ID: ${CROUPIER_SDK_CSHARP_EXAMPLE_SERVICE_ID:-game-demo-csharp}
      CROUPIER_ENV: ${CROUPIER_SDK_EXAMPLE_ENV:-dev}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - croupier-network

  # Analytics pipeline (optional): events ingestion + ClickHouse worker.
  # Enable with: docker compose --profile analytics up -d
  ingestion:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-ingest:${CROUPIER_INGEST_TAG:-main}
    container_name: croupier-ingestion
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYTICS_MQ_TYPE: ${ANALYTICS_MQ_TYPE:-redis}
      ANALYTICS_INGEST_SECRET: ${ANALYTICS_INGEST_SECRET:-change-me}
      ANALYTICS_REDIS_STREAM_EVENTS: ${ANALYTICS_REDIS_STREAM_EVENTS:-analytics:events}
      ANALYTICS_REDIS_STREAM_PAYMENTS: ${ANALYTICS_REDIS_STREAM_PAYMENTS:-analytics:payments}
      ANALYTICS_INGEST_SKEW: ${ANALYTICS_INGEST_SKEW:-300}
    ports:
      - "${INGEST_PORT:-18081:8088}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - croupier-network

  analytics-worker:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/croupier-analytics-worker:${CROUPIER_ANALYTICS_WORKER_TAG:-main}
    container_name: croupier-analytics-worker
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYTICS_REDIS_STREAM_EVENTS: ${ANALYTICS_REDIS_STREAM_EVENTS:-analytics:events}
      ANALYTICS_REDIS_STREAM_PAYMENTS: ${ANALYTICS_REDIS_STREAM_PAYMENTS:-analytics:payments}
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://clickhouse:9000/analytics}
      WORKER_GROUP: ${WORKER_GROUP:-analytics-worker}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - croupier-network

volumes:
  postgres_data:
    driver: local
  server_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local

networks:
  croupier-network:
    driver: bridge
