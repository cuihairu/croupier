# Local OpenTelemetry validation stack. It is deliberately self-contained:
# Croupier services export OTLP to the Collector, Jaeger receives traces, and
# Prometheus scrapes the Collector's Prometheus exporter.

services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "14317:4317" # OTLP gRPC receiver
      - "14318:4318" # OTLP HTTP receiver
      - "13313:13133" # Collector health endpoint
      - "18889:8889" # Collector Prometheus exporter
    depends_on:
      - jaeger
      - prometheus
    networks:
      - croupier-telemetry

  # Jaeger - 分布式链路追踪
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "17686:16686" # Jaeger UI
      - "15250:14250" # Jaeger gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - croupier-telemetry

  # Prometheus - 指标收集和存储
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    ports:
      - "19092:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    networks:
      - croupier-telemetry

  # Grafana - 监控仪表板
  grafana:
    image: grafana/grafana:latest
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - croupier-telemetry

volumes:
  prometheus-storage:
  grafana-storage:

networks:
  croupier-telemetry:
    driver: bridge

# Host endpoints: OTLP HTTP :14318, OTLP gRPC :14317, Collector health
# :113133, Collector metrics :18889, Jaeger :17686, Prometheus :19092, and
# Grafana :13000 (admin/admin). Run scripts/test-telemetry.sh for the full
# audit-to-trace validation.
