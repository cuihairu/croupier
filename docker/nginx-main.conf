user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# dashboard 只承载 L7（SPA 静态资源 + API 反代）；Agent 的 L4 接入
# 由独立的 haproxy 服务承担（docker/configs/haproxy.cfg，
# docs/guide/load-balancing.md——两层各司其职：nginx 管人，HAProxy 管机器）。

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HA 双实例负载均衡（http 级，split_clients 只允许在 http 块；
    # conf.d 的 server 块直接引用 $croupier_backend 变量）：
    # - resolver + 变量 proxy_pass 运行时解析（开源 nginx upstream 块只在
    #   启动时解析一次，server 容器重建换 IP 会 502；变量方式 10s 重解析）
    # - split_clients 按请求随机哈希分流，两实例各半；服务端为无状态
    #   （JWT 认证 + 共享 DB），SSE watch 亦为共享库轮询实现，任意实例
    #   均可服务；函数调用经集群互联转发到 owner 实例（HA 二期）
    split_clients $request_id $croupier_backend {
        50%      croupier-server:18780;
        *        croupier-server2:18780;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
