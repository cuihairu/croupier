user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# dashboard 只承载 L7（SPA 静态资源 + API 反代）；Agent 的 L4 接入
# 由独立的 haproxy 服务承担（docker/configs/haproxy.cfg，
# docs/operations/load-balancing.md——两层各司其职：nginx 管人，HAProxy 管机器）。

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 单活流量入口（http 级，split_clients 只允许在 http 块；
    # conf.d 的 server 块直接引用 $croupier_backend 变量）：
    # - resolver + 变量 proxy_pass 运行时解析（开源 nginx upstream 块只在
    #   启动时解析一次，server 容器重建换 IP 会 502；变量方式 10s 重解析）
    # - server 的 agent session 表与函数注册 registry 是实例内存态，
    #   无跨实例同步：L7 双活会把同一会话的 API 请求分流到「无该 agent
    #   数据」的实例，函数实例列表/invoke 路由视图分裂（2026-09-11
    #   线上事故根因）。因此 L7 全量指向主实例；server2 为冷备
    #   （haproxy.cfg 的 backup 语义），主实例故障时提升此处再切流
    # - 未登录请求回退 $request_id 随机
    split_clients $http_authorization$croupier_anon_key $croupier_backend {
        100%     croupier-server:18780;
        *        croupier-server2:18780;
    }
    map $http_authorization $croupier_anon_key {
        ""      $request_id;
        default "";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
