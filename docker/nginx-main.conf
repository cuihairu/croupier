user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# L4 TCP 负载均衡：Agent 出站 TCP session（自研 transport，19090）
# 打散到集群各 Server 实例；断连重连由 LB 分发至存活实例
#（docs/architecture/server-ha-multi-instance.md §6.1 连接分布）。
# 注意：stream upstream 与 http 一致，只在启动/reload 时解析域名——
# Server 实例重建换 IP 后需重载 dashboard 容器（docker compose up -d
# --force-recreate dashboard）或 nginx -s reload。
stream {
    log_format agent_lb '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time -> $upstream_addr';
    access_log /var/log/nginx/agent_lb.log agent_lb;

    upstream croupier_agent_lb {
        # least_conn：按活跃会话数分发，贴合长连接多路复用会话
        least_conn;
        server croupier-server:19090;
        server croupier-server2:19090;
    }

    server {
        listen 19090;
        proxy_pass croupier_agent_lb;
        # agent 心跳 30s 持续激活连接；1h 空闲超时兜底回收僵尸会话
        proxy_timeout 1h;
        # 故障快速切换：建连失败 3s 内换实例
        proxy_connect_timeout 3s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # SPA + API 反代（web/nginx.conf → conf.d/default.conf）
    include /etc/nginx/conf.d/*.conf;
}
