openapi: 3.0.3
info:
  title: Request contract fixture
  version: 1.0.0
paths:
  /players/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: filter
        in: query
        schema: { type: integer }
    post:
      operationId: updatePlayer
      parameters:
        - name: filter
          in: query
          style: form
          explode: false
          schema: { type: string }
        - name: X-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: session
          in: cookie
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              required: [filter]
              properties:
                filter: { type: integer }
      responses:
        "204":
          description: Updated
  /bulk:
    post:
      operationId: bulkPlayers
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { type: integer }
      responses:
        "204":
          description: Updated
  /limit:
    post:
      operationId: setLimit
      parameters:
        - name: scope
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: integer, minimum: 0 }
      responses:
        "204":
          description: Updated
  /compatible:
    post:
      operationId: createCompatible
      parameters:
        - name: scope
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "204":
          description: Created
