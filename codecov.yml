# CR-FIX-14: SDK flags enforce an absolute floor (target: 85, tolerance 1%)
# so a coverage collapse fails CI instead of silently drifting. server and
# web-dashboard stay on target:auto (relative to base) with the same 1%
# tolerance; the informational markers were removed so every project check
# gates. if_not_found: success keeps flags without fresh reports green
# (carryforward covers untested SDKs on unrelated PRs).
# Carryforward flags: when only some SDKs are tested,
# use previous coverage data for untested flags
flags:
  go-sdk:
    paths:
      - sdks/go/**
    carryforward: true
  js-sdk:
    paths:
      - sdks/js/**
    carryforward: true
  cpp-sdk:
    paths:
      - sdks/cpp/**
    carryforward: true
  python-sdk:
    paths:
      - sdks/python/**
    carryforward: true
  java-sdk:
    paths:
      - sdks/java/**
    carryforward: true
  csharp-sdk:
    paths:
      - sdks/csharp/**
    carryforward: true
  server:
    paths:
      - internal/**
      - core/**
      - agents/**
    carryforward: true
  web-dashboard:
    paths:
      - web/src/**
    carryforward: true

coverage:
  status:
    project:
      default:
        flags:
          - server
        target: auto
        threshold: 1%
      go-sdk:
        flags:
          - go-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      js-sdk:
        flags:
          - js-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      cpp-sdk:
        flags:
          - cpp-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      python-sdk:
        flags:
          - python-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      java-sdk:
        flags:
          - java-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      csharp-sdk:
        flags:
          - csharp-sdk
        target: 85
        threshold: 1%
        if_not_found: success
      server:
        flags:
          - server
        target: auto
        threshold: 1%
        if_not_found: success
      web-dashboard:
        flags:
          - web-dashboard
        target: auto
        threshold: 1%
        if_not_found: success
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  # Generated code and protocols
  - "proto/**"
  - "pkg/pb/**"
  - "gen/**"
  - "generated/**"

  # SDK generated code (relative to repo root)
  - "sdks/go/pkg/pb/**"
  - "sdks/go/downloaded_proto/**"
  - "sdks/js/generated/**"
  - "sdks/cpp/generated/**"
  - "sdks/cpp/vcpkg/**"
  - "sdks/cpp/vcpkg_installed/**"
  - "sdks/cpp/build/**"
  - "sdks/python/croupier/pb/**"
  - "sdks/python/generated/**"
  - "sdks/java/build/**"
  - "sdks/csharp/**/obj/**"
  - "sdks/csharp/generated/**"

  # Non-SDK code
  - "dashboard/**"
  - "examples/**"
  - "scripts/**"
  # web 子模块仅统计 src 下的覆盖率（lcov 只含 src，此处忽略构建产物等杂项）
  - "web/config/**"
  - "web/e2e/**"
  - "web/tests/**"
  - "web/mock/**"
  # 部署后一次性线上 smoke 套件（直连线上，同 e2e 无单测覆盖）
  - "web/e2e-verify/**"
  # web 根配置（jest/playwright），不属于 src 覆盖产物
  - "web/*.config.ts"
  # 纯类型定义目录：编译后为空模块，v8 lcov 无语句记录（0 个 SF 条目），
  # 计入 patch/project 只会贡献假 missed，不提供任何覆盖信号
  - "web/src/types/**"

github_checks:
  annotations: true
