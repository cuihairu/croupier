coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

comment: false

ignore:
  - "proto/**"
  - "pkg/pb/**"
  - "pkg/protocol/**"
  - "gen/**"
  - "dashboard/**"
  - "cmd/**"
  - "examples/**"
  - "scripts/**"

github_checks:
  annotations: true
