# capture-agent 示例配置（复制为 capture-agent.yaml 后按环境修改）。
# 命名遵循仓内配置契约（lowerCamelCase）；capture.enabled 缺省关。

agent:
  # 注册用 agent 唯一 id（必填）。
  id: capture-01
  # 上游控制面地址（必填，tcp:// 前缀可省）。
  serverAddr: "127.0.0.1:19090"
  # 游戏域标签（必填，注册携带，面板按此过滤）。
  gameId: demo
  # 逻辑环境标签（prod/stage/dev，可空）。
  env: prod
  # supervisable 心跳打点文件（监管方采样 mtime 得 last_heartbeat_unix）。
  heartbeatFile: data/capture/agent-heartbeat

# 上行控制通道 TLS（enabled=false 时裸连；生产建议启用并配 caFile）。
outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

capture:
  # 总开关，缺省关（开启前确认 MySQL 前置：binlog_format=ROW、
  # binlog_row_image=FULL、REPLICATION SLAVE 权限、server_id 不冲突）。
  enabled: false
  # 位点文件目录（每源一文件：mysql.json，tmp+rename 原子写）。
  bookmarkDir: data/capture/bookmarks
  # 位点周期落盘间隔（秒，默认 5）。
  bookmarkFlushIntervalSec: 5
  mysql:
    host: 127.0.0.1
    port: 3306
    user: repl
    password: ""
    # 与源实例及其他 binlog 订阅者不冲突。
    serverId: 4242
    # 订阅白名单（"库.表"，必填非空——只订道具相关表，噪声与带宽双控）。
    tables:
      game.items: true
      game.player_wallet: true
  # 闸层规则（C2 起；空 = 只采不判）。规则模板是代码、规则本体是纯数据
  # （无 DSL）。启动即全量校验：表须 "库.表" 两段、对账闸同表不得跨规则
  # 复用、itemTable ≠ ledgerTable、severity ∈ {warn, critical}。
  gates:
    # 对账闸：道具变更必须能在 windowSec 内对上业务流水，超窗未销 =
    # reconcile.missing_ledger 告警（命中落 agent 日志+计数）。
    reconcile:
      rules: []
      # 示例（键形态：整数串 = 行像位置下标，C1 行像为位置数组 JSON）：
      # - name: item-ledger
      #   itemTable: game.items
      #   ledgerTable: game.ledger
      #   itemKey: "1"        # 道具行像下标（如 player_id 列）
      #   ledgerKey: "0"      # 流水行像下标（如 player_id 列）
      #   windowSec: 300      # 0 → 默认 300
      #   severity: warn      # 缺省 warn；critical 走严重通道
      #   exemptKeys: []      # 关联键值精确豁免（批处理流水等）
      #   maxPending: 10000  # 单规则在窗条目上限，0 → 默认 10000
    # CEP 闸三模板（同一表可同时挂多实例）：
    cep:
      # 非白名单时段：名单外时段的变更即 cep.off_hours 告警。
      offHours: []
      # - name: wallet-night
      #   table: game.player_wallet
      #   ops: []              # 空 = 全部变更；可列 insert/update/delete
      #   windows:
      #     - startMin: 120    # 每日 02:00
      #       endMin: 240      # 至 04:00（右端开；start > end = 跨零点）
      #   tzOffsetMin: 480     # 东八区；0 = UTC
      #   severity: warn
      # 数量突变：单事件 delta 或滑动窗口累计 |delta| 超阈值 =
      # cep.burst_delta 告警。
      burst: []
      # - name: wallet-drain
      #   table: game.player_wallet
      #   deltaField: "2"      # 数量字段下标（键形态同 reconcile）
      #   threshold: 100000
      #   mode: single         # single | window
      #   windowSec: 300       # mode=window 必填
      #   severity: critical
      # 连续试探：同 (行键, 表) 窗口内 N 次小额变更（慢刷形态）=
      # cep.probing 告警。C1 账号不可得，键降级为行键（见简档 §8.2）。
      probing: []
      # - name: wallet-scrape
      #   table: game.player_wallet
      #   keyField: "0"        # 行键下标
      #   deltaField: "2"
      #   smallBelow: 10       # 单次 |delta| < 此值算小变更
      #   count: 5
      #   windowSec: 600
      #   maxTracked: 10000    # 追踪键上限，0 → 默认 10000
    # 血缘闸：非白名单账号写受监控表 = lineage.whitelist_violation 告警。
    # C1 降级态：binlog/WAL 不带会话账号，空账号事件跳过并计数（见简档 §8.3）；
    # 源侧补上账号后零改动生效。
    lineage:
      rules: []
      # - name: items-accounts
      #   table: game.items
      #   ops: []               # 空 = 全部变更
      #   allowAccounts:        # 应用账号 + 运维豁免账号
      #     - app_writer
      #   severity: critical
