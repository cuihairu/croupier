# Croupier Server Configuration
server:
  host: 0.0.0.0
  port: 18780
  timeout: 600000
  mode: dev

# 功能开关（控制面：API 路由 + 前端菜单；未列出的域默认开启）。
# 数据面组件（agent/analytics worker/ingest）不受此配置影响。
# featureFlags:
#   dev: false        # 研发域（缺陷追踪/任务安排）
#   support: false    # 客服域（工单/FAQ/反馈）
#   analytics: false  # 数据分析域
#   ops: false        # 运维中心域（告警/备份/证书/ops API）
#   extensions: false # 扩展中心域

database:
  driver: mysql
  dataSource: "root:root@tcp(localhost:3306)/croupier_meta?charset=utf8mb4&parseTime=True&loc=Local"
  # multiGame: true  # Enable database-per-game architecture.
  # Each (game_id, env) gets its own database
  # (e.g. game_demo_prod, game_demo_staging).
  # The dataSource above is the meta database.
  # gameDbPrefix: "game_"  # Override the default game database name prefix.
  # For PostgreSQL, change Driver to postgres and DataSource to:
  # DataSource: "host=localhost port=5432 user=postgres password=postgres dbname=croupier_meta sslmode=disable TimeZone=Asia/Shanghai"

sse:
  updateInterval: 60
  keepAliveInterval: 30

control:
  addr: ":19090"
  ipcAddr: ""
  cert: ""
  key: ""
  ca: ""

registry:
  assignmentsPath: "data/assignments.json"
  analyticsFiltersPath: "schemas/analytics_filters.json"
  rateLimitsPath: "data/rate_limits.json"

agentDispatch:
  jobRoutingDir: "data"
  jobRoutingTTL: ""
  toAgentTLS:
    enabled: false
    certFile: ""
    keyFile: ""
    caFile: ""
    serverName: ""
    insecureSkipVerify: false

auth:
  jwtSecret: "localdevsecret-change-me"
  rbacConfig: "configs/rbac.json"
  usersConfig: "configs/users.json"
  gamesConfig: "configs/games.json"

bootstrapData:
  baseDir: "configs"

descriptors:
  dir: "descriptors"

schemas:
  dir: "schemas"

storage:
  driver: "file"
  baseDir: "data/uploads"

cache:
  enabled: true
  type: "redis"
  addr: "localhost:6379"
  password: ""
  db: 0
  poolSize: 50
  ttl: "5m"
  evictTTL: "10m"
  maxItems: 10000

log:
  level: "info"
  format: "console"
  output: "stdout"

metrics:
  perFunction: true
  perGameDenies: false
