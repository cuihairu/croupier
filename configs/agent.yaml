# Docker/dev config for croupier-agent (used by docker/docker-compose.yml)
name: croupier-agent
host: 0.0.0.0
port: 19091

server:
  # Upstream control plane address (docker-compose service name)
  addr: "server:19090"
  insecure: true
  serverName: ""
  insecureSkipVerify: false

agent:
  # ID is optional; when empty, agent will auto-generate one at runtime.
  id: ""
  gameId: ""
  env: ""
  # Must be reachable by server within the docker network.
  localAddr: "0.0.0.0:19091"
  httpAddr: "agent:19091"
  labels: {}

upstream:
  heartbeatInterval: 30
  retryInterval: 5
  maxRetries: 3
  timeout: 10000

# Local gateway TLS: encrypts the listener SDK Providers dial into
# (agent.localAddr). Requires certFile+keyFile when enabled (startup error
# otherwise); caFile turns on mutual TLS (client certificates required).
# TLS sits below the framing layer, so the SDK wire protocol is unchanged —
# SDKs dialing this listener must support a TLS dial option.
tls:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  insecureSkipVerify: false

outboundTLS:
  enabled: false
  certFile: ""
  keyFile: ""
  caFile: ""
  serverName: ""
  insecureSkipVerify: false

# Ops module configuration
# Controls system metrics collection and reporting
ops:
  enabled: true
  # Remote operation gates. Update is independent of restart/exec and both
  # default to fail-closed.
  allowRestart: false
  allowExec: false
  allowUpdate: false
  metricsInterval: 30s
  metricsEnabled: true
  # 托管进程监管（supervisor）：每个条目以逻辑名为键。采样周期同 metricsInterval，
  # 超阈值只在面板打标记（mem_over_limit / cpu_over_limit），不自动杀进程。
  # 退避自动拉起：退出后按 restartBackoffInitial 起步、逐次倍增、封顶
  # restartBackoffMax；连续失败 restartBreakerLimit 次熔断为 BROKEN，需人工
  # Start/Restart 复位。存活超过退避封顶视为启动成功并清零失败计数。
  # managedProcesses:
  #   demo-app:
  #     command: /usr/local/bin/demo-app
  #     args: ["--port", "8080"]
  #     workingDir: /srv/demo-app
  #     memThresholdBytes: 2147483648   # RSS 超过 2GiB 打 mem_over_limit
  #     cpuThresholdPercent: 90         # CPU 超过 90% 打 cpu_over_limit
  #     autoRestart: true
  #     restartBackoffInitial: 1s       # 首次重试退避（缺省 1s）
  #     restartBackoffMax: 60s          # 退避封顶（缺省 60s）
  #     restartBreakerLimit: 5          # 连续失败熔断阈值（0=不熔断）
  # supervisor 事件日志：本地轮转文件全量留存 + metrics 上报捎带 server 内存环。
  # supervisorLog:
  #   dir: logs/supervisor   # 缺省 logs/supervisor
  #   maxSizeMB: 10
  #   maxBackups: 5
  #   maxAgeDays: 7
  # Crash snapshot base directory (one 0700 subdirectory per process).
  # snapshotDir: logs/snapshots

# 声明式探针（probe.targets[]）：周期探测本机可达的依赖，开故障窗口并上行
# （窗口事件 + 失败明细走告警事件面；成功率/时延/窗口时长随 metrics 批量上报）。
# 阈值、语义、间隔不写即用默认：failThreshold=3、recoverThreshold=1、
# semantics=readiness、interval=30s（与 metrics 周期同档）。配置非法时 agent
# 启动失败——观测面配错静默不探比报错危险。
