# Croupier 应用配置示例
# 复制此文件并根据需要修改

app:
  name: "croupier"
  version: "1.0.0"
  env: "development"  # development, testing, staging, production
  debug: true

network:
  server:
    host: "localhost"
    http_port: 8080
    grpc_port: 9090
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed_headers:
        - "*"
    rate_limit:
      enabled: true
      requests: 1000
      window: "1m"

database:
  enabled: true
  primary:
    host: "localhost"
    port: 5432
    database: "croupier_dev"
    username: "croupier"
    password: "password"
    ssl_mode: "disable"
  read_only:
    enabled: false
  connection_pool:
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"
  migration:
    enabled: true
    path: "./migrations"

security:
  jwt:
    enabled: true
    secret: "your-very-long-secret-key-here-at-least-32-characters"
    expiry: "1h"
    refresh_expiry: "24h"
  totp:
    enabled: false
    issuer: "Croupier"
  password_policy:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_symbols: false
  api_keys:
    enabled: false
    header_name: "X-API-Key"
  audit:
    enabled: true
    retention: "90d"

observability:
  logging:
    enabled: true
    level: "info"  # debug, info, warn, error
    format: "json"
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  tracing:
    enabled: false
    jaeger:
      enabled: false
      endpoint: ""
    zipkin:
      enabled: false
      url: ""
  health_check:
    enabled: true
    port: 8081

business:
  games:
    max_concurrent_games: 1000
    max_players_per_game: 10
    default_game_timeout: "1h"
  functions:
    registry:
      max_size: 10000
    execution:
      default_timeout: "30s"
      max_timeout: "5m"
  jobs:
    queue:
      max_size: 5000
    retry:
      max_attempts: 3
      initial_delay: "1s"

storage:
  files:
    enabled: true
    base_path: "./data/files"
  objects:
    enabled: false
    provider: "s3"  # s3, minio, oss
    s3:
      bucket: "croupier-files"
      region: "us-east-1"
      access_key: ""
      secret_key: ""
    minio:
      endpoint: ""
      bucket: ""
      access_key: ""
      secret_key: ""
    oss:
      endpoint: ""
      bucket: ""
      access_key: ""
      secret_key: ""