# Prometheus configuration for the self-contained local telemetry stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The Collector's Prometheus exporter contains metrics received through
  # OTLP. Keeping this target inside the Compose network makes the stack
  # portable and avoids assuming host.docker.internal is available.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_interval: 10s
    metrics_path: "/metrics"
