# Croupier Server Configuration (SQLite - Development)
server:
  host: 0.0.0.0
  port: 18780
  timeout: 600000
  mode: dev

database:
  driver: sqlite
  dataSource: "data/croupier.db"
  # SQLite 不支持 multiGame 模式

sse:
  updateInterval: 60
  keepAliveInterval: 30

control:
  addr: ":19090"
  ipcAddr: ""
  cert: ""
  key: ""
  ca: ""

registry:
  assignmentsPath: "data/assignments.json"
  analyticsFiltersPath: "schemas/analytics_filters.json"
  rateLimitsPath: "data/rate_limits.json"

agentDispatch:
  jobRoutingDir: "data"
  jobRoutingTTL: ""
  toAgentTLS:
    enabled: false
    certFile: ""
    keyFile: ""
    caFile: ""
    serverName: ""
    insecureSkipVerify: false

auth:
  jwtSecret: "localdevsecret-change-me"
  rbacConfig: "configs/rbac.json"
  usersConfig: "configs/users.json"
  gamesConfig: "configs/games.json"

bootstrapData:
  baseDir: "configs"

descriptors:
  dir: "descriptors"

schemas:
  dir: "schemas"

storage:
  driver: "file"
  baseDir: "data/uploads"

cache:
  enabled: false

log:
  level: "info"
  format: "console"
  output: "stdout"

metrics:
  perFunction: true
  perGameDenies: false
