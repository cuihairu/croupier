# Croupier Server Configuration (SQLite Test)
server:
  host: 0.0.0.0
  port: 18780
  timeout: 600000
  mode: dev

database:
  driver: sqlite
  dataSource: "test-data/croupier.db"

auth:
  jwtSecret: "localdevsecret-change-me"
  rbacConfig: "configs/rbac.json"
  usersConfig: "configs/users.json"
  gamesConfig: "configs/games.json"
  # demo/e2e exemption: seed the factory default password admin123 as-is
  allowDefaultCredentials: true

bootstrapData:
  baseDir: "configs"

cache:
  enabled: false

log:
  level: "debug"
  format: "console"
  output: "stdout"
