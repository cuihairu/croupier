# Docker/dev config for croupier-edge (used by docker/docker-compose.yml)
Name: croupier-edge
Host: 0.0.0.0
Port: 9080

Server:
  InternalAddr: "0.0.0.0:9443"
  PublicAddr: "edge.local"
  Insecure: true
  TLSCertFile: ""
  TLSKeyFile: ""

Upstream:
  # Upstream control plane (optional). When configured, Edge proxies agent Register/Heartbeat to Server.
  Addr: "server:8443"
  Insecure: true
  TLSCertFile: ""
  TLSKeyFile: ""
  CAFile: ""
  ServerName: ""
  InsecureSkipVerify: false

Edge:
  Labels: {}

Metrics:
  Enabled: true
  Port: 9091
  Path: /metrics

TLS:
  Enabled: false
  CertFile: ""
  KeyFile: ""
  CAFile: ""
  InsecureSkipVerify: false

Dispatch:
  JobRoutingDir: "data"
  JobRoutingTTL: "" # e.g. "24h"; empty disables cleanup
  AgentTLS:
    Enabled: false
    CertFile: ""
    KeyFile: ""
    CAFile: ""
    ServerName: ""
    InsecureSkipVerify: false
